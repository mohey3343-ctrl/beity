<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بيتي">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>بيتي — ميزانية البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5fb; --card:#ffffff; --card-2:#f7f8fd;
    --ink:#1f1c3d; --soft:#69708a; --line:#e3e7f2;
    --night:#2b2752; --night-2:#1a1834;
    --gold:#e9a83e; --gold-2:#d68d22;
    --good:#0f9d6b; --good-bg:#e5f6ef;
    --bad:#d94545; --bad-bg:#fdecec;
    --warn:#c97a10; --warn-bg:#fdf3e2;
    --blue:#3b6fd8; --blue-bg:#e9f0fd;
    --purple:#7a5bd6; --purple-bg:#efeafc;
    --radius:16px;
    --shadow:0 4px 18px rgba(30,30,80,.07);
    /* ألوان الرسوم (باليتة مختبرة لعمى الألوان) */
    --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c-other:#a8a69f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121124; --card:#1d1b36; --card-2:#242244;
      --ink:#ecebf7; --soft:#a3a6c2; --line:#302d55;
      --good-bg:#12342a; --bad-bg:#3a1c25; --warn-bg:#3a2c14; --blue-bg:#1a2a4d; --purple-bg:#2a2250;
      --shadow:0 4px 18px rgba(0,0,0,.35);
      --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c-other:#6b6a64;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  h1,h2,h3{font-family:'El Messiri', sans-serif; margin:0;}
  .num{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace; font-weight:600; direction:ltr; unicode-bidi:isolate;}
  .wrap{max-width:620px; margin:0 auto; padding:0 14px;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    color:#fff; padding:calc(14px + env(safe-area-inset-top)) 0 20px;
    border-radius:0 0 26px 26px; box-shadow:0 14px 32px rgba(10,8,30,.3);
  }
  .hero::before{content:''; position:absolute; top:-140px; left:50%; transform:translateX(-50%);
    width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(233,168,62,.22) 0%, rgba(233,168,62,0) 70%); pointer-events:none;}
  .hero .wrap{position:relative;}
  .hero-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .hero-top h1{font-size:24px;}
  .hero-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); color:#fff;
    width:36px; height:36px; border-radius:50%; font-size:17px; display:grid; place-items:center;}
  .sync-dot{font-size:11px; color:#c9c6ef; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .month-nav{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:12px;}
  .month-nav button{direction:ltr; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff;
    width:32px; height:32px; border-radius:50%; font-size:18px; line-height:1;}
  .month-label{font-weight:600; font-size:15px; min-width:150px; text-align:center; cursor:pointer;}
  .month-label small{display:block; font-size:11px; color:#bdb9e8; font-weight:500;}
  .hero-main{text-align:center;}
  .hero-main .lbl{font-size:12.5px; color:#cfcbf3;}
  .hero-main .big{font-size:34px; margin:2px 0 6px;}
  .hero-main .big.neg{color:#ffb4b4;}
  .hero-pills{display:flex; justify-content:center; gap:8px; flex-wrap:wrap;}
  .hero-pills span{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14);
    border-radius:999px; padding:4px 10px; font-size:12px;}
  .hero-pills b{color:var(--gold);}

  /* ---------- LAYOUT ---------- */
  main{padding-top:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
  .card h3{font-size:16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card h3 .h-actions{display:flex; gap:6px;}
  .muted{color:var(--soft); font-size:12.5px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 12px; box-shadow:var(--shadow);}
  .stat .t{font-size:12px; color:var(--soft); display:flex; align-items:center; gap:5px;}
  .stat .v{font-size:18px; margin:3px 0 6px;}
  .stat .s{font-size:11.5px; color:var(--soft);}
  .bar{height:7px; background:var(--card-2); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
  .bar > i{display:block; height:100%; border-radius:999px; background:var(--blue);}
  .bar.good > i{background:var(--good);} .bar.bad > i{background:var(--bad);}
  .bar.warn > i{background:var(--warn);} .bar.gold > i{background:var(--gold);} .bar.purple > i{background:var(--purple);}

  .btn{border:1px solid var(--line); background:var(--card-2); color:var(--ink);
    border-radius:12px; padding:9px 14px; font-size:14px; font-weight:600;}
  .btn.sm{padding:6px 10px; font-size:12.5px; border-radius:10px;}
  .btn.primary{background:linear-gradient(160deg, var(--gold) 0%, var(--gold-2) 100%); border-color:transparent; color:#2b1a00;}
  .btn.dark{background:var(--night); color:#fff; border-color:transparent;}
  .btn.good{background:var(--good-bg); color:var(--good); border-color:transparent;}
  .btn.danger{background:var(--bad-bg); color:var(--bad); border-color:transparent;}
  .btn.ghost{background:transparent;}
  .btn.block{display:block; width:100%;}
  .btn:active{transform:scale(.97);}
  .btns{display:flex; gap:8px; flex-wrap:wrap;}

  .today{background:linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);}
  .today-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .today .big{font-size:30px; color:var(--good);}
  .today .big.neg{color:var(--bad);}
  .today-side{font-size:12.5px; color:var(--soft); line-height:1.9; text-align:left;}
  .today-side b{color:var(--ink);}

  .plan-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .plan-line:last-child{border-bottom:none;}
  .plan-line.total{font-weight:700; font-size:15px; border-top:2px solid var(--line); border-bottom:none; margin-top:4px; padding-top:9px;}
  .pos{color:var(--good);} .neg{color:var(--bad);}

  .alert{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; margin-bottom:8px; font-size:13.5px;}
  .alert .ic{font-size:18px;}
  .alert .tx{flex:1; line-height:1.6;}
  .alert.bad{background:var(--bad-bg);} .alert.warn{background:var(--warn-bg);} .alert.info{background:var(--blue-bg);} .alert.good{background:var(--good-bg);}

  .cat-row{margin-bottom:10px;}
  .cat-row .row{font-size:13.5px; margin-bottom:4px;}

  .list-item{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .li-ic{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--card-2); font-size:18px; flex-shrink:0; border:1px solid var(--line);}
  .li-main{flex:1; min-width:0;}
  .li-title{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .li-sub{font-size:12px; color:var(--soft); margin-top:1px;}
  .li-end{text-align:left; flex-shrink:0;}
  .day-h{display:flex; justify-content:space-between; font-size:12.5px; color:var(--soft); padding:12px 2px 4px; font-weight:600;}

  .seg{display:flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px; margin-bottom:12px;}
  .seg button{flex:1; border:none; background:transparent; color:var(--soft); padding:8px 6px; border-radius:9px; font-size:13.5px; font-weight:600;}
  .seg.s4 button{font-size:12px; padding:8px 3px;}
  .seg button.on{background:var(--night); color:#fff;}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:12.5px; white-space:nowrap;}
  .chip.on{background:var(--night); color:#fff; border-color:var(--night);}
  .tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); color:var(--soft);}
  .tag.good{background:var(--good-bg); color:var(--good); border-color:transparent;}
  .tag.bad{background:var(--bad-bg); color:var(--bad); border-color:transparent;}
  .tag.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent;}
  .tag.blue{background:var(--blue-bg); color:var(--blue); border-color:transparent;}

  .empty{text-align:center; padding:26px 10px; color:var(--soft); font-size:14px; line-height:1.8;}
  .empty .e-ic{font-size:36px; margin-bottom:6px;}

  .steps .step{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .steps .step:last-child{border-bottom:none;}
  .steps .done{color:var(--good); font-weight:700;}
  .steps .step .tx{flex:1;}

  table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
  .tbl th{font-size:11.5px; color:var(--soft); font-weight:600; text-align:right; padding:6px 4px; border-bottom:1px solid var(--line);}
  .tbl td{padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}

  .jard-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .jard-row:last-child{border-bottom:none;}
  .jard-row .nm{flex:1; font-size:14px; font-weight:600;}
  .jard-row .nm .ed{font-size:11px; opacity:.55;}
  .jard-row .nm small{display:block; font-weight:400; color:var(--soft); font-size:11.5px;}
  .jard-row select{width:74px; padding:8px 4px; border:1px solid var(--line); border-radius:10px; background:var(--card-2); color:var(--ink); font-size:13px;}
  .jard-row input{width:90px; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--card-2); color:var(--ink); text-align:center;}
  .list-q{position:sticky; top:8px; z-index:5; margin:-4px 0 4px;}
  .list-q.solo{margin:0 0 12px;}
  .list-q input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--solid, var(--card)); color:var(--ink); font-size:16px;}
  .group-h{font-size:12.5px; color:var(--soft); font-weight:700; margin:12px 0 2px;}

  /* ---------- TABBAR + FAB ---------- */
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center;
    background:var(--card); border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(30,40,90,.08);
    padding:6px 4px calc(8px + env(safe-area-inset-bottom));}
  .tabbar .in{display:flex; width:100%; max-width:620px;}
  .tabbar button{flex:1; border:none; background:none; color:var(--soft); display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; font-size:11px; font-weight:600;}
  .tabbar svg{width:23px; height:23px;}
  .tabbar button.active{color:var(--night);}
  @media (prefers-color-scheme: dark){ .tabbar button.active{color:var(--gold);} }
  .tabbar button.active .tb-ic{background:var(--warn-bg);}
  .tb-ic{border-radius:10px; padding:3px 10px;}
  .fab{position:fixed; z-index:31; left:max(16px, calc(50% - 294px)); bottom:calc(80px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; border:none; font-size:30px; line-height:1;
    background:linear-gradient(160deg, var(--gold) 0%, var(--gold-2) 100%); color:#2b1a00;
    box-shadow:0 10px 24px rgba(214,141,34,.45);}

  /* ---------- SHEET ---------- */
  .sheet-wrap{position:fixed; inset:0; z-index:50; background:rgba(14,12,32,.55); display:none; align-items:flex-end; justify-content:center;}
  .sheet-wrap.open{display:flex;}
  .sheet{background:var(--card); width:100%; max-width:620px; max-height:92vh; overflow-y:auto;
    border-radius:22px 22px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); animation:up .18s ease-out;}
  @keyframes up{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .sheet-head h2{font-size:19px;}
  .sheet-head .x{background:var(--card-2); border:1px solid var(--line); color:var(--ink); width:34px; height:34px; border-radius:50%; font-size:16px;}
  .fld{display:block; margin-bottom:11px;}
  .fld > span{display:block; font-size:12.5px; color:var(--soft); margin-bottom:4px; font-weight:600;}
  .fld input, .fld select, .fld textarea{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card-2); color:var(--ink);}
  .fld input:focus, .fld select:focus{outline:2px solid var(--gold); outline-offset:0; border-color:transparent;}
  .fld .hint{font-size:11.5px; color:var(--soft); margin-top:4px; line-height:1.6;}
  /* الأرقام دايمًا من الشمال لليمين عشان 0.5 ما تتعرضش "5." */
  input[inputmode="decimal"]{direction:ltr;}
  .fld input[inputmode="decimal"]:not(.amount){text-align:right;}
  .fld.err input, input.err{border-color:var(--bad) !important; background:var(--bad-bg) !important;}
  .fld-err{color:var(--bad); font-size:11.5px; margin-top:4px; font-weight:600;}
  .jard-row{flex-wrap:wrap;} .jard-row .fld-err{width:100%; text-align:left;}
  .fld input.amount{font-size:28px; text-align:center; font-family:'IBM Plex Mono', monospace; font-weight:600; padding:12px;}
  .fld2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ml-row{border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:8px; background:var(--card-2);}
  .ml-top, .ml-sub{display:flex; gap:6px; align-items:center;}
  .ml-sub{margin-top:6px;}
  .ml-row select, .ml-row input{min-width:0; padding:9px 8px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:15px;}
  .ml-top select{flex:1.4;} .ml-top input{flex:1; text-align:center; font-family:'IBM Plex Mono', monospace; font-weight:600;}
  .ml-sub select, .ml-sub input{flex:1;} .ml-sub input[data-f="qty"]{flex:.6; text-align:center;}
  .ml-u{font-size:12px; min-width:34px;}
  .plan-line > b{white-space:nowrap; flex:none;}
  #heroMain.mini{padding:10px 14px !important; border-radius:18px !important;}
  .hero-mini{display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:space-between; font-size:12.5px; color:var(--soft); cursor:pointer;}
  .hero-mini b{color:var(--ink); font-size:15px; margin-inline-start:4px;}
  .hero-total{margin:-4px 0 10px; font-size:13px; color:var(--soft);}
  .hero-total b{color:var(--ink); font-size:17px; margin-inline-start:4px;}
  .hero-total small{opacity:.7; margin-inline-start:4px;}
  .tabbar .in{align-items:center;}
  .tabbar .fab{position:relative !important; left:auto !important; right:auto !important; bottom:auto !important; flex:none; width:54px !important; height:54px !important;
    border-radius:18px !important; margin:-26px 4px 0; font-size:28px; line-height:1; display:flex; align-items:center; justify-content:center;
    background:var(--grad) !important; color:#fff !important; border:1px solid rgba(255,255,255,.3) !important; box-shadow:0 0 22px rgba(124,92,255,.6) !important; gap:0; padding:0;}
  .more-alerts{margin-bottom:12px;} .more-alerts > summary{cursor:pointer; color:var(--soft); font-size:13px; padding:6px 4px; list-style:none;}
  .more-alerts > summary::-webkit-details-marker{display:none;} .more-alerts[open] > summary{margin-bottom:8px;}
  .evopt{display:block; text-align:center; padding:9px 6px; border-radius:13px; cursor:pointer; font-size:13.5px; color:var(--soft);}
  .seg input[type="radio"]:checked + .evopt{background:rgba(255,255,255,.14); color:var(--ink); font-weight:600;}
  .pause-btn{min-height:22px !important; padding:0 7px; font-size:10.5px; margin-top:3px; color:var(--soft); white-space:nowrap; border-radius:8px !important;}
  .toast.long{border-radius:18px !important; width:min(92vw, 560px); max-width:none; text-align:right; line-height:1.75; padding:12px 16px;}
  #refreshBtn{font-size:20px;} #refreshBtn.spin{animation:spin 1s linear infinite; pointer-events:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .mpick{display:flex; gap:5px;} .mpick select:first-child{flex:1.35;} .fld .mpick select{flex:1; min-width:0; padding:11px 8px 11px 2px; font-size:14px;}
  .out-btn{min-height:28px !important; padding:2px 10px; font-size:11.5px; margin-top:4px; color:var(--bad);}
  .ml-sub select.ml-unit{flex:none; width:auto; max-width:90px;}
  .ml-x{border:none; background:none; color:var(--bad); font-size:16px; width:28px; flex-shrink:0;}
  .catpick{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:12px;}
  .catpick label{display:block;}
  .catpick input{position:absolute; opacity:0; pointer-events:none;}
  .catpick span{display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding:8px 4px; border:1px solid var(--line); border-radius:12px; font-size:11.5px; background:var(--card-2); min-height:58px; justify-content:center;}
  .catpick span em{font-style:normal; font-size:20px;}
  .catpick input:checked + span{border-color:var(--gold); background:var(--warn-bg); box-shadow:0 0 0 1px var(--gold) inset;}
  .sheet-foot{display:flex; gap:8px; margin-top:8px;}
  .sheet-foot .btn{flex:1; padding:12px;}
  .switch{display:flex; align-items:center; gap:10px; font-size:13.5px; margin-bottom:11px;}
  .switch input{width:20px; height:20px; accent-color:var(--gold);}

  .toast{position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom));
    background:var(--night); color:#fff; padding:10px 18px; border-radius:999px; font-size:13.5px; box-shadow:0 8px 20px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--bad);}
  .undo-bar{position:fixed; z-index:61; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom));
    background:var(--night); color:#fff; padding:6px 6px 6px 14px; border-radius:999px; font-size:13.5px; box-shadow:0 8px 20px rgba(0,0,0,.25);
    display:none; align-items:center; gap:10px; white-space:nowrap;}
  .undo-bar.show{display:flex;}
  .undo-bar button{background:var(--gold); color:#2b1a00; border:none; border-radius:999px; padding:7px 14px; font-weight:700; font-size:13px;}

  .hist-row{display:grid; grid-template-columns:72px 1fr 70px; align-items:center; gap:8px; font-size:12px; margin-bottom:7px;}
  .hist-row .bar{height:12px;}
  .kv{display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;}
  .kv span{color:var(--soft);}
  .goal-hero{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .goal-hero .gi{font-size:34px;}
  .ring{--p:0; width:70px; height:70px; border-radius:50%; display:grid; place-items:center; flex-shrink:0;
    background:conic-gradient(var(--gold) calc(var(--p)*1%), var(--card-2) 0);}

<script>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const pad = n => String(n).padStart(2, '0');
/* بيقبل أرقام عربي/إنجليزي، والفاصلة العشرية (. أو ٫)، وبيشيل فواصل الآلاف */
function normNum(v){
  return String(v == null ? '' : v).trim()
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g, '.').replace(/[,،٬\s]/g, '');
}
function num(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(normNum(v));
  return isFinite(n) ? n : 0;
}
/* التحقق من خانة رقم: فاضي، أو رقم سليم موجب، وإلا رسالة الغلط */
function numCheck(raw, el){
  const t = normNum(raw);
  if(t === '') return {empty:true};
  if(!/^(\d+\.?\d*|\.\d+)$/.test(t)) return {err:/^-/.test(t) ? 'الرقم مينفعش يبقى بالسالب' : 'اكتب رقم بس، من غير حروف أو رموز'};
  const v = parseFloat(t);
  if(el && el.hasAttribute('data-int') && v % 1) return {err:'اكتب رقم صحيح من غير كسور'};
  if(el && el.dataset.max && v > +el.dataset.max) return {err:'أقصى رقم هنا ' + el.dataset.max};
  return {v};
}
function markField(el){
  const r = numCheck(el.value, el), box = el.closest('.fld') || el.parentNode;
  el.classList.toggle('err', !!r.err);
  if(box.classList.contains('fld')) box.classList.toggle('err', !!r.err);
  let m = box.querySelector(':scope > .fld-err');
  if(r.err){ if(!m){ m = document.createElement('div'); m.className = 'fld-err'; box.appendChild(m); } m.textContent = '⚠️ ' + r.err; }
  else if(m) m.remove();
  return !r.err;
}
function validNums(root){

  if(bad.length){ bad[0].focus(); toast('فيه رقم مش مظبوط — صلّحه الأول', true); return false; }

}
const fmt = n => Math.round(n || 0).toLocaleString('en-US');
const fmtQ = n => (n || 0).toLocaleString('en-US', {maximumFractionDigits:Math.abs(n || 0) < 10 ? 2 : 1});
/* الصنف: base = PCS/KG/L، و pu = اسم العبوة، و pf = العبوة فيها كام من الـ base */
const baseOf = it => BASES[it.base] ? it.base : 'PCS';
const hasPack = it => !!(it.pu && it.pf > 0);
const packF = it => hasPack(it) ? it.pf : 1;
const entryUnit = it => hasPack(it) ? it.pu : BASES[baseOf(it)].en;
/* بيتباع فرط (بأي كمية: ربع، نص، كيلو ونص…): الكيلو واللتر من غير عبوة، والخضار والفاكهة واللحوم والجبن بالوزن.
   الباقي (رز، سكر، زيت…) عبوة مقفولة — وتقدر تغيّر ده من الصنف */
const LOOSE_G = /خضار|فاكه|لحوم|لحمة|فراخ|سمك|جبن|ألبان/;
const isLoose = it => baseOf(it) !== 'PCS' && (it.loose != null ? !!it.loose : !hasPack(it) || LOOSE_G.test(it.group || ''));
/* "نص كيلو" بدل 0.5 KG */
function looseTxt(it, q){
  const ar = BASES[baseOf(it)].ar, r = Math.round(q * 4) / 4, n = {0.25:'ربع ' + ar, 0.5:'نص ' + ar, 0.75:'تلت تربع ' + ar, 1:ar, 1.5:ar + ' ونص', 2:'2 ' + ar}[r];
  return Math.abs(q - r) < 1e-6 && n ? n : `${fmtQ(q)} ${ar}`;
}
function qtyPlain(it, q){
  const en = BASES[baseOf(it)].en;
  // ⁦…⁩ بيعزل "0.9 KG" عشان ما يتقلبش لـ "KG 0.9" جوه الكلام العربي
  if(!hasPack(it)) return `\u2066${fmtQ(q)} ${en}\u2069`;
  return `${fmtQ(q / it.pf)} ${it.pu}` + (baseOf(it) === 'PCS' && it.pf === 1 ? '' : ` (\u2066${fmtQ(q)} ${en}\u2069)`);
}
function qtyTxt(it, q){
  const en = BASES[baseOf(it)].en, ltr = x => `<span dir="ltr" style="unicode-bidi:isolate">${fmtQ(x)} ${en}</span>`;
  if(!hasPack(it)) return ltr(q);
  return `${fmtQ(q / it.pf)} ${esc(it.pu)}` + (baseOf(it) === 'PCS' && it.pf === 1 ? '' : ` <small class="muted">(${ltr(q)})</small>`);
}
const money = (n, cls) => `<span class="num ${cls || ''}">${fmt(n)}</span> <small>ج</small>`;
function ds(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pd(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); }
const todayS = () => ds(new Date());
function diffDays(a, b){ return Math.round((pd(b) - pd(a)) / 864e5); }
function addDays(s, n){ const d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
function dayLabel(s){
  const t = todayS();
  if(s === t) return 'النهاردة';
  if(s === addDays(t, -1)) return 'امبارح';
  const d = pd(s);
  return ['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'][d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}
function monthName(key){ const p = key.split('-').map(Number); return MONTHS[p[1] - 1] + ' ' + p[0]; }

/* ---------------- البيانات ---------------- */
function fresh(){
  return {
    v:1, updatedAt:0,
    settings:{cycleDay:1, coverMode:'month', bufferDays:3, debtExtra:0, syncUrl:'', syncSecret:''},
    incomes:[], bills:[], debts:[], goals:[], items:[], counts:[], tx:[], cashCounts:[], dues:[], recvs:[], wallets:[{id:'w_main', name:'كاش', icon:'💵'}],
    cats: DEFAULT_CATS.map(c => Object.assign({}, c)),
  };
}
function migrate(o){
  const f = fresh();
  for(const k in f) if(o[k] === undefined) o[k] = f[k];
  o.settings = Object.assign(f.settings, o.settings || {});
  if(!Array.isArray(o.cats) || !o.cats.length) o.cats = f.cats;
  if(!Array.isArray(o.wallets) || !o.wallets.length) o.wallets = [{id:'w_main', name:'كاش', icon:'💵'}];
  if(!o.cats.some(c => c.id === 'house')) o.cats.splice(1, 0, Object.assign({}, DEFAULT_CATS[1]));
  // الأصناف القديمة كان ليها "وحدة" نص حر — نحوّلها لمقياس أساسي + عبوة
  (o.items || []).forEach(it => {
    if(it.base) return;
    const u = String(it.unit || '').trim();
    if(['كيلو', 'كجم', 'kg', 'KG'].includes(u)) it.base = 'KG';
    else if(['لتر', 'l', 'L'].includes(u)) it.base = 'L';
    else { it.base = 'PCS'; if(u && u !== 'قطعة'){ it.pu = u; it.pf = 1; } }
    if(it.pack > 0 && !it.pu){ it.pu = 'عبوة'; it.pf = it.pack; }
    delete it.pack; delete it.unit;
  });
  // مرة واحدة: الأصناف الشائعة اللي اتضافت قبل نظام العبوات تاخد عبوتها الافتراضية
  if(!o.settings.packsV2){
    (o.items || []).forEach(it => {
      const sd = SEED_ITEMS.find(x => x[1] === it.name);
      if(sd && sd[3] && !it.pu && it.base === sd[2]){ it.pu = sd[3]; it.pf = sd[4]; }
    });
    o.settings.packsV2 = true;
  }
  return o;
}
let S;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ S = migrate(JSON.parse(raw)); syncEvents(); LASTJ = null; stampChanges(); return; }
  }catch(e){}

}
/* EPOCH بيزيد مع أي تغيير — الحسابات التقيلة بتتخزن مؤقتًا لحد ما يزيد */
let EPOCH = 0, PERSISTED = null;
function memo(fn, keyf){
  const c = new Map(); let e = -1;
  return (...a) => { if(e !== EPOCH){ c.clear(); e = EPOCH; } const k = keyf(...a); if(c.has(k)) return c.get(k); const v = fn(...a); c.set(k, v); return v; };
}
/* نسخة تلقائية يومية على الجهاز (آخر 7 أيام) — بتحمي من تعديل أو مسح بالغلط */
const SNAP_KEY = KEY + '::snaps';
const JDRAFT_KEY = KEY + '::jardDraft';
function snapshots(){ try{ return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); }catch(e){ return []; } }
function takeSnapshot(){
  try{
    const old = localStorage.getItem(KEY); if(!old) return;
    const snaps = snapshots(), td = todayS();
    if(snaps.length && snaps[snaps.length - 1].d === td) return;
    snaps.push({d:td, raw:old});
    while(snaps.length > 7) snaps.shift();
    for(;;){ try{ localStorage.setItem(SNAP_KEY, JSON.stringify(snaps)); break; }catch(e){ if(snaps.length <= 1) break; snaps.shift(); } }
  }catch(e){}
}
/* كل سجل بيتعدّل بياخد وقت تعديله (_m) — عشان لما جهازين يعدّلوا نفس الحاجة، الدمج ياخد الأحدث مش نسخة الشيت دايمًا */
let LASTJ = null;
const SYNC_LOCAL = ['syncUrl', 'syncSecret', 'lastWallet', '_m'];
function stampChanges(){
  const now = Date.now(), first = !LASTJ, next = new Map();
  const mark = (key, x, skip) => {
    const j = JSON.stringify(x, (k, v) => skip.includes(k) ? undefined : v);
    next.set(key, j); if(!first && LASTJ.get(key) !== j) x._m = now;
  };
  MERGE_KEYS.forEach(k => (S[k] || []).forEach(x => { if(x && x.id) mark(k + ':' + x.id, x, ['_m']); }));
  if(S.settings) mark('settings', S.settings, SYNC_LOCAL);
  LASTJ = next;
}
function persist(){
  syncEvents();
  EPOCH++;
  stampChanges();
  takeSnapshot();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('مش قادر يحفظ على الجهاز!', true); }
}
function save(){
  // أي حركة جديدة اتعملت من شاشة فيها اختيار محفظة بتاخد المحفظة دي
  if(PENDING_WALLET) for(let i = PENDING_WALLET.n0; i < S.tx.length; i++) if(!S.tx[i].walletId && S.tx[i].type !== 'xfer') S.tx[i].walletId = PENDING_WALLET.w;
  S.updatedAt = Date.now();
  persist();
  scheduleSync();
  render();
}

/* ---------------- الشهر المالي ---------------- */
/* لو المرتب بينزل يوم 25 مثلًا، الشهر المالي بيبدأ 25 وبيخلص 24 الشهر اللي بعده */
function periodOf(dateS){
  const d = pd(dateS), cd = S.settings.cycleDay || 1;
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() < cd){ m--; if(m < 0){ m = 11; y--; } }
  return {y, m};
}
function addMonths(p, n){ const d = new Date(p.y, p.m + n, 1); return {y:d.getFullYear(), m:d.getMonth()}; }
function samePeriod(a, b){ return a.y === b.y && a.m === b.m; }
/* الدخل بيتحسب للشهر بتاعه مش ليوم ما نزل: مرتب نوفمبر لو نزل بدري يوم 28 أكتوبر بيتحسب لنوفمبر (forP) */
const pKey = p => p.y + '-' + pad(p.m + 1);
const incFor = t => t.forP || pKey(periodOf(t.date));
const incTx = (inc, p) => S.tx.filter(t => t.type === 'inc' && t.incomeId === inc.id && incFor(t) === pKey(p));
const incGot = (inc, p) => sum(incTx(inc, p), t => t.amount);
// "ده كله" = نزل أقل من المتوقع ومفيش باقي جاي (خصم مثلًا)
const incClosed = (inc, p) => incTx(inc, p).some(t => t.final) || incGot(inc, p) >= (inc.amount || 0) - 0.5;
function periodRange(p){
  const cd = S.settings.cycleDay || 1;
  const start = new Date(p.y, p.m, cd), end = new Date(p.y, p.m + 1, cd - 1);
  return {start:ds(start), end:ds(end), days:diffDays(ds(start), ds(end)) + 1};
}
function periodLabel(p){
  const cd = S.settings.cycleDay || 1;
  if(cd === 1) return MONTHS[p.m] + ' ' + p.y;
  const r = periodRange(p), a = pd(r.start), b = pd(r.end);
  return MONTHS[p.m] + ' ' + p.y + `<small>${a.getDate()} ${MONTHS[a.getMonth()]} ← ${b.getDate()} ${MONTHS[b.getMonth()]}</small>`;
}
/* ميعاد يوم معيّن (زي يوم دفع فاتورة) جوه شهر مالي */
function dueDateIn(r, day){
  const s = pd(r.start), m = day < (S.settings.cycleDay || 1) ? s.getMonth() + 1 : s.getMonth();
  // يوم 31 في شهر 30 يوم (أو فبراير) = آخر يوم في الشهر، مش أول الشهر اللي بعده
  const last = new Date(s.getFullYear(), m + 1, 0).getDate();
  let out = ds(new Date(s.getFullYear(), m, Math.min(day, last)));
  if(out > r.end) out = r.end;
  return out;
}
/* عدد الشهور الباقية لحد شهر الهدف (شامل الشهر الحالي) */
function monthsUntil(deadline){
  const p = deadline.split('-').map(Number), cur = periodOf(todayS());
  return Math.max(1, (p[0] - cur.y) * 12 + (p[1] - 1 - cur.m) + 1);
}

/* ---------------- الحسابات ---------------- */
const catOf = id => S.cats.find(c => c.id === id) || {id, name:'متنوع', icon:'🧾'};
const byId = (arr, id) => arr.find(x => x.id === id);
function txBetween(a, b){ return S.tx.filter(t => t.date >= a && t.date <= b); }

function debtPaidTotal(d, upto){ return sum(S.tx.filter(t => t.type === 'debt' && t.debtId === d.id && (!upto || t.date <= upto)), t => t.amount); }
function debtRemaining(d, upto){ return Math.max(0, (d.total || 0) - debtPaidTotal(d, upto)); }
function goalSaved(g, upto){ return (g.initial || 0) + sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && (!upto || t.date <= upto)), t => t.amount); }
/* المطلوب شهريًا = (المطلوب − اللي اتحوّش قبل الشهر الحالي) ÷ الشهور الباقية شامل الشهر ده،
   عشان أي تحويش الشهر ده يتحسب من حصة الشهر ده نفسه */
function goalRequired(g){
  const before = goalSaved(g, addDays(periodRange(periodOf(todayS())).start, -1));
  // لو التحويش لسه ما بدأش: المطلوب يتقسم على الشهور من البداية للميعاد بس
  const months = goalNotStarted(g) ? Math.max(1, monthsUntil(g.deadline) - monthsUntil(g.start) + 1) : monthsUntil(g.deadline);
  return Math.max(0, (g.target || 0) - before) / months;
}
const curKey = () => { const p = periodOf(todayS()); return p.y + '-' + pad(p.m + 1); };
/* الهدف أو الجمعية ليهم "يبدأ من شهر" — قبله مش بيتخصموا من خطة الشهر */
const goalNotStarted = g => !!(g.start && curKey() < g.start);
function goalMonthlyAt(g, key){
  if(g.doneOn) return 0;
  if(g.start && key < g.start) return 0;
  if(key > g.deadline) return 0;
  const left = (g.target || 0) - goalSaved(g);
  if(left < 0.5) return 0;
  return g.kind === 'gameya' ? g.monthly : Math.min(g.monthly > 0 ? g.monthly : goalRequired(g), left);
}
function goalPlanMonthly(g){ return goalMonthlyAt(g, curKey()); }

/* ---- الاستوك ومعدلات الاستهلاك ----
   المعدل الفعلي بيتحسب من الجرد: (أول جرد + اللي اتشرى بعده − آخر جرد) ÷ عدد الأيام.
   محتاج جردين بينهم أسبوع على الأقل، وقبل كده بنستخدم الرقم التقديري اللي انت كاتبه. */
const evKey = e => e.date + '|' + String(e.ts || 0).padStart(15, '0');
function itemCounts(it){ return S.counts.filter(c => c.itemId === it.id).sort((a, b) => evKey(a) < evKey(b) ? -1 : 1); }
function itemBuys(it){ return S.tx.filter(t => t.itemId === it.id && t.qty > 0); }
/* الفرق بين جردين بالأيام — بالساعة والدقيقة لو وقت التسجيل متسجل (6.2 يوم مثلًا)، وإلا بالتاريخ */
const tsOk = c => c && c.ts > 1e12 && ds(new Date(c.ts)) === c.date;
const evGap = (a, b) => tsOk(a) && tsOk(b) ? Math.max(0, (b.ts - a.ts) / 864e5) : diffDays(a.date, b.date);
const nowEv = () => ({date:todayS(), ts:Date.now()});
function durTxt(g){
  const d = Math.floor(g + 1e-9), h = Math.round((g - d) * 24);
  return d ? `${d} يوم${h ? ` و${h} ساعة` : ''}` : `${Math.max(1, h)} ساعة`;
}
/* بعد جرد صنف: استهلكت كام من آخر جرد، ويطلع كام في الشهر */
function sinceLastTxt(it, c){
  const cs = itemCounts(it).filter(x => x.id !== c.id && evKey(x) < evKey(c)), prev = cs[cs.length - 1];
  if(!prev) return '';
  const g = evGap(prev, c); if(g < 1 / 24) return '';
  const bought = sum(itemBuys(it).filter(t => evKey(t) > evKey(prev) && evKey(t) <= evKey(c)), t => t.qty);
  const used = prev.qty + bought - c.qty;
  if(used < -1e-9) return `${it.name}: معاك أكتر من آخر جرد — في شراء ما اتسجلش؟`;
  return `${it.name}: من آخر جرد (${durTxt(g)}) استهلكت ${qtyPlain(it, used)}` + (g >= 1 ? ` — يعني حوالي ${qtyPlain(it, used / g * 30)} في الشهر` : '')
    + (g < 7 ? '. البرنامج هيعتمد المعدل لما يعدّي أسبوع على الأقل بين جردين.' : '.');
}
function learnedDaily(it){
  const cs = itemCounts(it);
  if(cs.length < 2) return null;
  const last = cs[cs.length - 1];
  // ناخد أقدم جرد في آخر 4 شهور تقريبًا عشان المعدل يبقى حديث
  let first = null;
  for(const c of cs){
    const d = diffDays(c.date, last.date);
    if(d >= 7 && d <= 125){ first = c; break; }
  }
  if(!first){
    for(let i = cs.length - 2; i >= 0; i--){ const d = diffDays(cs[i].date, last.date); if(d >= 7 && d <= 365){ first = cs[i]; break; } }
  }
  if(!first) return null;
  const fk = evKey(first), lk = evKey(last);
  const bought = sum(itemBuys(it).filter(t => { const k = evKey(t); return k > fk && k <= lk; }), t => t.qty);
  const used = first.qty + bought - last.qty;
  if(used < 0) return null;
  // كان خلصان ولسه خلصان (جرد صفر + صفر) — مفيش معلومة عن الاستهلاك، نرجع للرقم التقديري
  if(used < 1e-9 && last.qty < 1e-9) return null;
  return used / Math.max(evGap(first, last), 1e-6);
}
const dailyRate = memo(dailyRateRaw, it => it.id);
const estStock = memo(estStockRaw, it => it.id);
function dailyRateRaw(it){
  const l = learnedDaily(it);
  if(l != null) return {v:l, src:'learned'};
  if(it.monthly > 0) return {v:it.monthly / 30, src:'manual'};
  return {v:0, src:'none'};
}
/* الموجود المتوقع دلوقتي = آخر جرد + اللي اتشرى بعده − الاستهلاك من ساعتها.
   بنمشي بالترتيب: الاستوك ما بينزلش تحت الصفر، فلو كان خلص قبل الشراء
   (العيش مثلًا) اللي اشتريته النهارده بيبان كامل وما يتاكلش في استهلاك أيام كان فيها خلصان. */
function estStockRaw(it){
  const cs = itemCounts(it), last = cs[cs.length - 1], lk = last ? evKey(last) : '', r = dailyRate(it).v;
  const buys = itemBuys(it).filter(t => evKey(t) > lk).sort((a, b) => evKey(a) < evKey(b) ? -1 : 1);
  // ما اتجردش خالص بس اتشرى: كان صفر قبل أول شراء (مش لازم تجرده عشان يتحسب)
  if(!last && !buys.length) return null;
  let s = last ? last.qty : 0, at = last || buys[0];
  for(const t of buys){ s = Math.max(0, s - r * evGap(at, t)) + t.qty; at = t; }
  return Math.max(0, s - r * evGap(at, nowEv()));   // من آخر حركة لدلوقتي بالساعة
}
function daysLeft(it){
  const r = dailyRate(it).v, e = estStock(it);
  if(e == null || r <= 0) return null;
  return e / r;
}
/* صنف متوقف: "مش الشهر ده" (لحد آخر الشهر المالي) أو "موسمي" (لحد ما ترجّعه) — مش بيدخل قايمة الشراء ولا الخطة */
const isPaused = it => !!it.pause && (it.pause === 'always' || todayS() <= it.pause);
const pauseTxt = it => it.pause === 'always' ? 'موقوف (موسمي)' : 'مش الشهر ده';
function houseMonthlyCost(){ return sum(S.items.filter(it => it.pause !== 'always'), it => dailyRate(it).v * 30 * (it.price || 0)); }
function coverDays(){
  if(S.settings.coverMode === 'period'){
    const r = periodRange(periodOf(todayS()));
    return diffDays(todayS(), r.end) + 1;
  }
  return 30;
}
function shopList(){
  const cover = coverDays() + (S.settings.bufferDays || 0);
  return S.items.filter(it => !isPaused(it)).map(it => {
    const rate = dailyRate(it), est = estStock(it), have = est == null ? 0 : est;
    const need = rate.v * cover - have;
    let qty = 0;
    // العبوة المقفولة بنقرّبها لعدد عبوات كامل — والفرط (خضار، فاكهة، لحمة…) بالظبط على قد الاستهلاك (لأقرب 10 جرام/مللي)
    if(need > 0.001){ const step = isLoose(it) ? 0.01 : hasPack(it) ? it.pf : 1; qty = Math.round(Math.ceil(need / step - 1e-9) * step * 1000) / 1000; }
    return {it, rate, est, have, need, qty, cost:qty * (it.price || 0)};
  });
}

/* ---- مواعيد السداد (مبلغ في تاريخ معيّن، مرة واحدة أو بيتكرر) ----
   بنحسب تشيل كام كل شهر عشان يوم الميعاد تبقى الفلوس جاهزة:
   (المبلغ − اللي شلته قبل الشهر ده) ÷ عدد الشهور الباقية لحد الميعاد (شامل الشهر ده). */
const REPEATS = {0:'مرة واحدة', 1:'كل شهر', 3:'كل 3 شهور', 6:'كل 6 شهور', 12:'كل سنة'};
function addMonthsDate(s_, n, dom){
  // dom = يوم الشهر الأصلي (31 مثلًا) عشان ما يزحفش: 31 يناير → 28 فبراير → 31 مارس
  const d = pd(s_), day = dom || d.getDate(), x = new Date(d.getFullYear(), d.getMonth() + n, 1);
  x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate()));
  return ds(x);
}
function periodsBetween(a, b){ return (b.y - a.y) * 12 + (b.m - a.m); }
// ميعاد مربوط بدين اتسدد كله (حتى لو اتدفع من غير الميعاد) مابقاش عليك
const activeDues = () => (S.dues || []).filter(d => !d.paidOn && !(d.debtId && byId(S.debts, d.debtId) && debtRemaining(byId(S.debts, d.debtId)) < 0.5));
const dueName = d => d.debtId && byId(S.debts, d.debtId) ? byId(S.debts, d.debtId).name + (d.name && d.name !== byId(S.debts, d.debtId).name ? ' — ' + d.name : '') : d.name;
/* اللي اتشال للدورة الحالية من الميعاد ده */
function dueReserved(d, upto, from){
  return sum(S.tx.filter(t => t.type === 'reserve' && t.dueId === d.id && t.dueDate === d.date && (!upto || t.date <= upto) && (!from || t.date >= from)), t => t.amount);
}
function duePerMonth(d, p){
  const r = periodRange(p);
  if(r.start > todayS()){
    // شهر جاي: الباقي (بعد اللي اتشال لحد النهارده) يتقسم من الشهر الجاي لحد الميعاد
    const n = Math.max(1, periodsBetween(periodOf(todayS()), periodOf(d.date)));
    return Math.max(0, d.amount - Math.max(0, dueReserved(d))) / n;
  }
  const before = dueReserved(d, addDays(r.start, -1));
  const n = Math.max(1, periodsBetween(p, periodOf(d.date)) + 1);
  return Math.max(0, d.amount - before) / n;
}
function totalReserved(){ return sum(activeDues(), d => Math.max(0, dueReserved(d))); }
/* المناسبة: اتصرف عليها كام في الدورة الحالية — من الحركات نفسها (كل دفعة فاكرة ميعادها) */
const evPays = d => S.tx.filter(t => t.type === 'exp' && t.dueId === d.id);
const evSpent = d => sum(evPays(d).filter(t => t.duePrev && t.duePrev.date === d.date), t => t.amount);
/* الفاضل في ميزانية المناسبة = الميزانية − اللي اتصرف (بيتحسب من جديد بعد أي تعديل أو مسح أو ربط) */
function syncEvents(){
  (S.dues || []).forEach(d => {
    if(d.kind !== 'event' || d.paidOn || !(d.baseAmount > 0) || !evPays(d).length) return;
    const left = Math.max(0, Math.round((d.baseAmount - evSpent(d)) * 100) / 100);
    if(d.amount !== left) d.amount = left;
  });
}
function nextDueOfDebt(debt){ return activeDues().filter(d => d.debtId === debt.id).sort((a, b) => a.date < b.date ? -1 : 1)[0] || null; }

/* ---- فلوس ليا عند الناس ----
   كل شخص: المبلغ الكلي + جدول مواعيد. اللي رجع بيتسجل دخل (recvId)،
   وبيتوزع على المواعيد بالترتيب عشان نعرف الدفعة الجاية. */
const recvGot = r => sum(S.tx.filter(t => t.type === 'inc' && t.recvId === r.id), t => t.amount);
const recvRemaining = r => Math.max(0, (r.total || 0) - recvGot(r));
function recvSchedule(r){
  let acc = recvGot(r);
  return (r.sched || []).slice().sort((a, b) => a.date < b.date ? -1 : 1).map(it => {
    const paid = Math.min(acc, it.amount); acc -= paid;
    return Object.assign({}, it, {paid, left:it.amount - paid});
  });
}
function recvNext(r){
  if(recvRemaining(r) <= 0.5) return null;
  const it = recvSchedule(r).find(x => x.left > 0.5);
  return it || {date:null, left:recvRemaining(r)};
}
const activeRecvs = () => (S.recvs || []).filter(r => recvRemaining(r) > 0.5);

/* ---- تاريخ أسعار الصنف (سعر العبوة في كل مرة اشتريته) ---- */
function priceHistory(it){
  return itemBuys(it).filter(t => t.amount > 0 && t.qty > 0).sort((a, b) => evKey(a) < evKey(b) ? -1 : 1)
    .map(t => ({date:t.date, p:t.amount / t.qty * packF(it)}));
}
/* التغيير في آخر سعر مقارنة باللي قبله (نسبة) */
function priceChange(it){
  const h = priceHistory(it); if(h.length < 2) return null;
  const a = h[h.length - 2].p, b = h[h.length - 1].p;
  return {from:a, to:b, pct:(b / a - 1) * 100, date:h[h.length - 1].date};
}

/* ---- الديون: خطة السداد (كرة التلج — الأصغر الأول) ---- */
function debtPaidIn(d, r){ return S.tx.some(t => t.type === 'debt' && t.debtId === d.id && t.date >= r.start && t.date <= r.end); }
function debtPlan(extra){
  const r0 = periodRange(periodOf(todayS()));
  const cur = periodOf(todayS());
  const ds_ = S.debts.map(d => {
    // دفعات بمواعيد محددة: كل دفعة في رقم الشهر بتاعها من دلوقتي
    const sched = {};
    activeDues().filter(x => x.debtId === d.id).forEach(x => {
      const i = Math.max(0, periodsBetween(cur, periodOf(x.date)));
      sched[i] = (sched[i] || 0) + x.amount;
    });
    return {d, rem:debtRemaining(d), m:d.monthly || 0, paid0:debtPaidIn(d, r0), sched, end:null};
  }).filter(x => x.rem > 0.5).sort((a, b) => a.rem - b.rem);
  let freed = 0, month = 0;
  const freedAt = [];
  while(ds_.some(x => x.end == null) && month < 360){
    freedAt[month] = freed;
    let progress = 0;
    for(const x of ds_){
      if(x.end != null) continue;
      let pay = (month === 0 && x.paid0) ? 0 : Math.min(x.m, x.rem);
      pay += Math.min(x.sched[month] || 0, x.rem - pay);
      x.rem -= pay; progress += pay;
    }
    let pool = (extra || 0) + freed;
    for(const x of ds_){
      if(x.end != null || pool <= 0) continue;
      const pay = Math.min(pool, x.rem);
      x.rem -= pay; pool -= pay; progress += pay;
    }
    let newlyFreed = 0;
    for(const x of ds_) if(x.end == null && x.rem <= 0.5){ x.end = month; newlyFreed += x.m; }
    freed += newlyFreed;
    const pendingSched = ds_.some(x => x.end == null && Object.keys(x.sched).some(k => +k > month));
    if(progress <= 0 && !pendingSched) break;
    month++;
  }
  const stuck = ds_.some(x => x.end == null);
  return {rows:ds_, months:stuck ? null : month, stuck, freedAt, freedFinal:freed + (extra || 0)};
}
function monthLabelFromNow(i){ const p = addMonths(periodOf(todayS()), i); return MONTHS[p.m] + ' ' + p.y; }

/* ---- الأهداف: توقّع التحويش، ومع تحويل أقساط الديون اللي بتخلص ---- */
function goalProjection(g){
  const saved = goalSaved(g), target = g.target || 0;
  // لو لسه ما بدأش: الشهور اللي قبل البداية مفيهاش تحويش
  const startOff = goalNotStarted(g) ? monthsUntil(g.start) - 1 : 0;
  const base = startOff ? goalMonthlyAt(g, g.start) : goalPlanMonthly(g);
  // أقساط الديون اللي بتخلص بتروح لأول هدف مفعّل عليه التحويل بس (مش لكل الأهداف مع بعض)
  const roller = S.goals.find(x => x.rollDebts && !x.doneOn && x.kind !== 'gameya' && goalSaved(x) < (x.target || 0));
  const plan = g.rollDebts && roller === g ? debtPlan(S.settings.debtExtra || 0) : null;
  const extraAt = i => {
    if(!plan) return 0;
    if(i < plan.freedAt.length) return plan.freedAt[i] || 0;
    return plan.stuck ? (plan.freedAt[plan.freedAt.length - 1] || 0) : plan.freedFinal;
  };
  const months = monthsUntil(g.deadline);
  // اللي اتحوّش فعلًا الشهر ده بيتخصم من مساهمة الشهر الحالي
  const r0 = periodRange(periodOf(todayS()));
  const savedNow = sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && t.date >= r0.start && t.date <= r0.end), t => t.amount);
  let acc = saved, reachAt = saved >= target ? 0 : null, atDeadline = null;
  for(let i = 0; i < 240; i++){
    if(i >= startOff) acc += (i === 0 ? Math.max(0, base - savedNow) : base) + extraAt(i);
    if(reachAt == null && acc >= target - 0.5) reachAt = i;   // سماحية كسور القروش
    if(i === months - 1) atDeadline = acc;
    if(i >= months - 1 && reachAt != null) break;
  }
  return {saved, base, atDeadline:atDeadline == null ? acc : atDeadline, reachAt, months};
}

/* ---- الرصيد الفعلي ----
   = آخر جرد للفلوس + أي دخل اتسجل بعده − أي حاجة اتصرفت/اتدفعت/اتحوّشت بعده.
   المرتب المتوقع مش بيدخل هنا غير لما تسجّل إنه نزل فعلًا. */
/* المحافظ: كاش، بنك، محفظة موبايل... كل حركة ليها محفظة (الافتراضي أول واحدة)،
   والتحويل بين محفظتين (xfer) ما بيأثرش على الإجمالي */
const mainWallet = () => S.wallets[0].id;
const walletOf = t => t.walletId && byId(S.wallets, t.walletId) ? t.walletId : mainWallet();
function walletFlow(t, wid){
  if(t.type === 'xfer') return (t.to === wid ? t.amount : 0) - (t.from === wid ? t.amount : 0);
  if(walletOf(t) !== wid) return 0;
  return t.type === 'inc' ? t.amount : -t.amount;
}
function walletBalance(w){
  const cs = (S.cashCounts || []).filter(c => (c.walletId && byId(S.wallets, c.walletId) ? c.walletId : mainWallet()) === w.id).sort((a, b) => evKey(a) < evKey(b) ? -1 : 1);
  const last = cs[cs.length - 1] || null, lk = last ? evKey(last) : '';
  return {w, known:!!last, last, value:(last ? last.amount : 0) + sum(S.tx.filter(t => !last || evKey(t) > lk), t => walletFlow(t, w.id))};
}
function cashBalance(){
  const bs = S.wallets.map(walletBalance);
  const last = bs.map(b => b.last).filter(Boolean).sort((a, b) => evKey(a) < evKey(b) ? -1 : 1).pop() || null;
  return {known:bs.some(b => b.known), last, value:sum(bs, b => b.value), wallets:bs};
}

/* ---- ملخص شهر مالي ---- */
const summary = memo(summaryRaw, p => p.y + '-' + p.m);
function summaryRaw(p){
  const r = periodRange(p), T = txBetween(r.start, r.end);
  const o = {p, r, T};
  // الدخل: اللي اتسجل فعلًا، وإلا المتوقع من مصادر الدخل الثابتة
  o.incReceived = 0; o.incExpected = 0; o.incLines = [];
  const pk = pKey(p), incT = S.tx.filter(t => t.type === 'inc' && incFor(t) === pk);
  S.incomes.forEach(inc => {
    const got = incGot(inc, p), closed = incClosed(inc, p);
    // نزل جزء ولسه الباقي جاي: المتوقع يفضل المبلغ كله
    o.incReceived += got; o.incExpected += closed ? got : Math.max(got, inc.amount || 0);
    o.incLines.push({inc, got, closed});
  });
  o.incExtra = sum(incT.filter(t => !byId(S.incomes, t.incomeId)), t => t.amount);
  o.incReceived += o.incExtra;
  // شهر خلص: الدخل = اللي اتسجل فعلًا (مش المتوقع)
  o.income = r.end < todayS() ? o.incReceived : o.incExpected + o.incExtra;
  // الالتزامات الثابتة
  o.billLines = S.bills.filter(b => !b.off).map(b => {
    const paidT = T.filter(t => t.type === 'bill' && t.billId === b.id);
    const paid = sum(paidT, t => t.amount);
    return {b, paid, paidT, planned:paidT.length ? paid : (b.amount || 0), due:dueDateIn(r, b.dueDay || 1)};
  });
  // دفع ميعاد سداد (مش مربوط بدين) بيتسجّل "bill" بس مكانه سطر المواعيد، مش الالتزامات الثابتة
  o.billPaid = sum(T.filter(t => t.type === 'bill' && !t.dueId), t => t.amount);
  o.duePaid = sum(T.filter(t => t.type === 'bill' && t.dueId), t => t.amount);
  o.billPlanned = sum(o.billLines, l => l.planned) + (o.billPaid - sum(o.billLines, l => l.paid));
  // أقساط الديون
  o.debtLines = S.debts.map(d => {
    const paidT = T.filter(t => t.type === 'debt' && t.debtId === d.id);
    const paid = sum(paidT, t => t.amount);
    let remBefore = debtRemaining(d, addDays(r.start, -1));
    if(r.start > todayS()){
      // شهر جاي: نفترض إن الأقساط اللي قبله هتتدفع
      const cur = periodRange(periodOf(todayS())), paidCur = debtPaidTotal(d) - debtPaidTotal(d, addDays(cur.start, -1));
      const k = periodsBetween(periodOf(todayS()), p);
      remBefore = Math.max(0, debtRemaining(d) - Math.max(0, (d.monthly || 0) - paidCur) - (d.monthly || 0) * (k - 1));
    }
    const due = Math.min(d.monthly || 0, remBefore);
    return {d, paid, paidT, planned:Math.max(paid, due), remBefore, due:dueDateIn(r, d.dueDay || 1)};
  });
  o.debtPaid = sum(T.filter(t => t.type === 'debt'), t => t.amount);
  o.debtPlanned = sum(o.debtLines, l => l.planned) + (o.debtPaid - sum(o.debtLines, l => l.paid));
  // التحويش
  const key = p.y + '-' + pad(p.m + 1);
  o.goalLines = S.goals.map(g => {
    const saved = sum(T.filter(t => t.type === 'save' && t.goalId === g.id), t => t.amount);
    const need = goalMonthlyAt(g, key);
    // need = المطلوب الشهر ده؛ السحب (سالب) ما بيزوّدش المطلوب
    return {g, saved, need, planned:Math.max(saved, need)};
  });
  o.saved = sum(T.filter(t => t.type === 'save'), t => t.amount);
  o.savePlanned = sum(o.goalLines, l => l.planned) + (o.saved - sum(o.goalLines, l => l.saved));
  // مواعيد السداد: اللي المفروض يتشال الشهر ده
  const isCur = todayS() >= r.start && todayS() <= r.end;
  o.dueLines = activeDues().map(d => {
    if(d.date >= r.start || isCur){
      const resThis = dueReserved(d, r.end, r.start), per = duePerMonth(d, p);
      return {d, resThis, per, planned:Math.max(resThis, per), reserved:dueReserved(d)};
    }
    // شهر جاي وميعاد بيتكرر ميعاده الجاي قبله: نحسب حصته الشهرية العادية (600 كل شهر مثلًا)
    if(r.start > todayS() && d.repeat > 0){ const per = (d.baseAmount || d.amount) / d.repeat; return {d, resThis:0, per, planned:per, reserved:0}; }
    return null;
  }).filter(Boolean);
  o.reserveNet = sum(T.filter(t => t.type === 'reserve'), t => t.amount);
  // اللي فاضل تشيله للمواعيد ما بيتخصمش من الخطة غير لما تشيله فعلًا (الشهر الحالي واللي فات)؛ الشهور الجاية بنخطط بالمطلوب
  o.reserveToDo = sum(o.dueLines, l => Math.max(0, l.per - l.resThis));
  o.reserveActual = r.start <= todayS();
  o.reservePlanned = o.reserveActual ? o.reserveNet : sum(o.dueLines, l => l.planned) + (o.reserveNet - sum(o.dueLines, l => l.resThis));
  // استوك البيت
  // الشهر الحالي: اللي اتصرف + اللي فاضل تشتريه لآخر الشهر (حسب الموجود ومعدل الاستهلاك)
  // شهر فات: اللي اتصرف بس · شهر جاي: تكلفة الشهر كله
  o.houseMonthly = houseMonthlyCost();
  o.houseSpent = sum(T.filter(t => t.type === 'exp' && t.cat === 'house'), t => t.amount);
  o.houseToBuy = 0;
  if(isCur){
    // نفس تكلفة "أشتري إيه" بالظبط (عبوات كاملة + أيام الاحتياطي) — الفلوس اللي هتدفعها فعلًا
    o.houseToBuy = sum(shopList(), x => x.cost);
    o.houseBudget = o.houseSpent + o.houseToBuy;
  }else o.houseBudget = r.start > todayS() ? o.houseMonthly : o.houseSpent;
  o.houseReserved = Math.max(o.houseBudget, o.houseSpent);
  // المصروف اليومي (المتغير)
  const varT = T.filter(t => t.type === 'exp' && t.cat !== 'house' && !t.dueId);
  o.varSpent = sum(varT, t => t.amount);
  // مصروف مناسبات (أعياد ميلاد...) — متخطط له ومتشال، فمش بيتحسب على مصروف اليوم
  o.eventSpent = sum(T.filter(t => t.type === 'exp' && t.dueId), t => t.amount);
  o.varBudget = o.income - o.billPlanned - o.debtPlanned - o.savePlanned - o.reservePlanned - o.houseReserved;
  o.lent = sum(T.filter(t => t.type === 'lend'), t => t.amount);
  o.varBudget -= o.lent + o.eventSpent + o.duePaid;
  // المتوقع يرجعلك الشهر ده (مش داخل في الخطة لحد ما يوصل فعلًا)
  o.recvExpected = sum(S.recvs || [], rv => sum(recvSchedule(rv).filter(it => it.date >= r.start && it.date <= r.end), it => it.left));
  o.recvGot = sum(T.filter(t => t.type === 'inc' && t.recvId), t => t.amount);
  o.outActual = o.billPaid + o.duePaid + o.debtPaid + o.saved + o.reserveNet + o.lent + o.eventSpent + o.houseSpent + o.varSpent;
  o.cash = o.income - o.outActual;
  o.free = o.varBudget - o.varSpent;
  const td = todayS();
  o.isCurrent = td >= r.start && td <= r.end;
  if(o.isCurrent){
    o.daysLeft = diffDays(td, r.end) + 1;
    o.spentToday = sum(varT.filter(t => t.date === td), t => t.amount);
    o.perDay = (o.varBudget - (o.varSpent - o.spentToday)) / o.daysLeft;
    // لو فيه جرد للفلوس: "فاضل للمصروف" بيتحسب من الفلوس اللي معاك فعلًا مش من الخطة على الورق
    //   = الرصيد (من غير المحجوز) − اللي لسه عليك تدفعه الشهر ده
    // والدخل اللي لسه ما نزلش مش بيتحسب لحد ما ينزل. وبكده: الخزنة = المحجوز + اللي لسه عليك + فاضل للمصروف
    const b = cashBalance();
    o.planFree = o.free;
    if(b.known){
      o.cashKnown = true; o.cashLast = b.last;
      o.reservedAll = totalReserved();
      o.safe = b.value + o.reservedAll;
      o.cashNow = b.value;
      o.owedParts = [['📋 التزامات', Math.max(0, o.billPlanned - o.billPaid)], ['💳 أقساط', Math.max(0, o.debtPlanned - o.debtPaid)],
        ['🚗 تحويش', sum(o.goalLines, l => Math.max(0, l.need - Math.max(0, l.saved)))], ['🧺 قايمة الشراء', o.houseToBuy],
        // دخل نزل بدري بس بتاع شهر جاي: في الخزنة بس مش للصرف الشهر ده
        ['💰 دخل الشهر الجاي (نزل بدري)', sum(S.tx.filter(t => t.type === 'inc' && t.forP && t.forP > pk && t.date <= td && !t.useNow), t => t.amount)]].filter(x => x[1] > 0.5);
      o.owedLeft = sum(o.owedParts, x => x[1]);
      o.incPending = Math.max(0, o.income - o.incReceived);
      o.free = b.value - o.owedLeft;
      o.cashGap = o.free - o.planFree;
      // الفرق بين الخطة على الورق والخزنة: دخل لسه ما نزلش (الورق حاسبه) + مصاريف ما اتسجلتش / فلوس زيادة
      o.unrecorded = o.cashGap + o.incPending;
      o.perDay = (o.free + o.spentToday) / o.daysLeft;
    }
    o.todayLeft = o.perDay - o.spentToday;
  }
  // المتاح للمصروف اليومي اللي بيظهر: من الخزنة لو فيه جرد فلوس (عشان كل الأرقام تمشي على حساب واحد)
  o.varAvail = o.isCurrent && o.cashKnown ? o.free + o.varSpent : o.varBudget;
  return o;
}

function stat(title, icon, planned, done, doneLabel, barCls){

  return `<div class="stat"><div class="t">${icon} ${title}</div>

    <div class="s" style="margin-top:5px">${doneLabel} <span class="num">${fmt(done)}</span>${over ? ' <span class="tag bad">زيادة</span>' : ''}</div></div>`;

/* ===================== رسوم ===================== */
const VIZ = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
/* دايرة: أكبر 6 بنود + "الباقي". الدوس على أي جزء (أو سطره) يوريك تفاصيله في النص */
function donutHtml(id, rows, centerLbl){
  rows = rows.filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  const total = sum(rows, r => r.v); if(total <= 0) return '';
  const sl = rows.slice(0, 6), rest = rows.slice(6);
  if(rest.length) sl.push({name:'الباقي (' + rest.length + ')', v:sum(rest, r => r.v), other:true});
  const R = 68, C = 2 * Math.PI * R, gap = sl.length > 1 ? 2 : 0;
  let off = 0;
  const col = (r, i) => r.other ? 'var(--c-other)' : VIZ[i];
  const arcs = sl.map((r, i) => {
    const len = r.v / total * C;
    const a = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${col(r, i)}" stroke-width="28" stroke-dasharray="${Math.max(0.5, len - gap)} ${C}" stroke-dashoffset="${-off}" class="dn-arc" data-act="donutPick" data-d="${id}" data-i="${i}"><title>${esc(r.name)}: ${fmt(r.v)}</title></circle>`;
    off += len; return a;
  }).join('');
  (window.__donuts = window.__donuts || {})[id] = {sl, total, centerLbl, sel:null};
  return `<div class="donut-wrap"><svg viewBox="0 0 180 180" class="donut" role="img" aria-label="${esc(centerLbl)}"><g transform="rotate(-90 90 90)">${arcs}</g>
      <text x="90" y="84" text-anchor="middle" class="dn-l" id="${id}-l">${esc(centerLbl)}</text>
      <text x="90" y="106" text-anchor="middle" class="dn-v" id="${id}-v">${fmt(total)}</text></svg>
    <div class="legend">${sl.map((r, i) => `<div class="lg-row" data-act="donutPick" data-d="${id}" data-i="${i}"><i style="background:${col(r, i)}"></i><span class="lg-n">${esc(r.name)}</span><b class="num">${fmt(r.v)}</b><span class="muted num">${Math.round(r.v / total * 100)}%</span></div>`).join('')}</div></div>`;
}
function donutPick(d){
  const D = window.__donuts[d.d]; if(!D) return;
  const i = +d.i; D.sel = D.sel === i ? null : i;
  const r = D.sel == null ? null : D.sl[D.sel];
  const name = r ? r.name.replace(/^\S+\s/, '') : D.centerLbl;
  document.getElementById(d.d + '-l').textContent = name.length > 16 ? name.slice(0, 15) + '…' : name;
  document.getElementById(d.d + '-v').textContent = r ? `${fmt(r.v)} · ${Math.round(r.v / D.total * 100)}%` : fmt(D.total);
  document.querySelectorAll(`.dn-arc[data-d="${d.d}"]`).forEach((c, k) => c.style.opacity = D.sel == null || k === D.sel ? 1 : .3);
  document.querySelectorAll(`.lg-row[data-d="${d.d}"]`).forEach((c, k) => c.classList.toggle('on', k === D.sel));
}
/* صفوف الدايرة: المصروف بالتصنيف، أو كل اللي خرج (التزامات، أقساط، تحويش...) */
function spendRows(o, mode){
  if(mode === 'all') return outflowRows(o).map(r => ({name:r.name, v:r.v}));
  const by = expByCat(o.T);
  return Object.entries(by).map(([c, v]) => ({name:catOf(c).icon + ' ' + catOf(c).name, v}));
}
/* تقسيم الدخل لأجزاء — شريط واحد بنسبة كل جزء */
function splitBar(o){
  if(!(o.income > 0)) return '';
  // دفعات الديون اللي ليها مواعيد (بتتشال شهريًا) هي سداد ديون، مش "مواعيد" عادية
  const debtRes = sum(o.dueLines.filter(l => l.d.debtId), l => o.reserveActual ? l.resThis : l.planned), otherRes = Math.max(0, o.reservePlanned + o.duePaid + o.eventSpent - debtRes);
  const parts = [
    ['📋 التزامات', o.billPlanned], ['💳 ديون', o.debtPlanned + debtRes], ['🏦 تحويش وجمعيات', o.savePlanned],
    ['📅 مواعيد ومناسبات', otherRes], ['🧺 استوك', o.houseReserved], ['🛒 مصروف يومي', Math.max(0, o.varBudget)],
  ].filter(x => x[1] > 0.5);
  const tot = Math.max(o.income, sum(parts, x => x[1]));
  const keep = (o.savePlanned + o.debtPlanned + debtRes) / o.income, kp = Math.round(keep * 100);
  return `<div style="margin-top:12px"><div class="muted">المرتب متقسم كده:</div>
    <div class="split">${parts.map((x, i) => `<i style="width:${x[1] / tot * 100}%; background:${VIZ[i]}" title="${x[0]}"></i>`).join('')}</div>
    <div class="split-lg">${parts.map((x, i) => `<span><i style="background:${VIZ[i]}"></i>${x[0]} <b class="num">${Math.round(x[1] / o.income * 100)}%</b></span>`).join('')}</div>
    <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">${keep >= 0.2 ? '💪' : '💡'} التحويش + سداد الديون = <b class="num">${kp}%</b> من الدخل${keep >= 0.2 ? ' — ممتاز' : ' — المستهدف 20%'} <span style="color:var(--blue)">(يعني إيه؟)</span></summary>
      <div class="note" style="line-height:1.9">قاعدة <b>50/30/20</b> طريقة بسيطة تقسّم بيها أي دخل:
        <br>• <b>50% أساسيات</b>: إيجار، فواتير، أكل البيت، مواصلات، علاج، مدارس.
        <br>• <b>30% كماليات</b>: أكل برا، خروجات، هدوم، هدايا.
        <br>• <b>20% لمستقبلك</b>: تحويش، جمعية، سداد ديون.
        <br>عندك دلوقتي <b class="num">${kp}%</b> بيروحوا لمستقبلك${keep >= 0.2 ? ' — ده فوق المستهدف 👏' : ` — يعني ناقص حوالي <b class="num">${fmt(o.income * 0.2 - o.income * keep)}</b> ج في الشهر عشان توصل 20%. ممكن تجيبهم من الكماليات (شوف "حدود المصروف")، أو تزوّد قسط الجمعية/التحويش.`}
        <br><span class="muted">الأرقام دي إرشادية — المهم إن الرقم ده يكبر شهر ورا شهر.</span></div></details></div>`;
}
function spendCard(o, id){
  const mode = S.settings.donutMode === 'all' ? 'all' : 'exp', rows = spendRows(o, mode).filter(r => r.v > 0);
  if(!rows.length) return '';

    ${o.varBudget < 0 ? `<div class="note">⚠️ الدخل مش مغطي الخطة بـ <b class="num">${fmt(-o.varBudget)}</b> جنيه. قلّل التحويش الشهري للهدف، أو راجع الالتزامات، أو زوّد مصدر دخل.</div>` : ''}
  </div>`;

  // ملخص ونقاط تحسين
  if(o.T.length){
    const ins = insights(VIEW);
    h += `<div class="card"><h3>📊 ملخص الشهر ونقاط التحسين <button class="btn sm dark" data-act="tab" data-tab="report">التقرير الكامل</button></h3>
      ${ins.length ? ins.slice(0, 3).map(insightHtml).join('') + (ins.length > 3 ? `<div class="muted">و${ins.length - 3} ملاحظات تانية في التقرير الكامل.</div>` : '') : '<div class="muted">كمّل تسجيل مصاريفك كام يوم، وهتظهر هنا ملاحظات ونقاط تحسين.</div>'}</div>`;
  }
  // الكاش فلو
  if(o.isCurrent && !cashBalance().known){
    h += `<div class="card"><h3>📈 الكاش فلو <button class="btn sm dark" data-act="cashCount">اكتب رصيدك</button></h3>
      <div class="muted">اكتب الفلوس اللي معاك دلوقتي، والبرنامج يتوقعلك رصيدك يوم بيوم وينبّهك قبل أي عجز.</div></div>`;
  }
  if(o.isCurrent && cashBalance().known){
    const F = forecast(30, !!S.settings.fcRecv);
    h += `<div class="card"><h3>📈 الكاش فلو <button class="btn sm dark" data-act="tab" data-tab="cash">التفاصيل</button></h3>
      ${F.firstNeg ? `<div class="alert bad" style="margin:0"><span class="ic">⚠️</span><span class="tx">متوقع عجز ${dayLabel(F.firstNeg.date)} — أقل نقطة <b class="num">${fmt(F.min.bal)}</b>. شوف التفاصيل والحلول.</span></div>`
        : `<div class="muted">أقل رصيد متوقع في الـ 30 يوم الجاية: <b class="num">${fmt(F.min.bal)}</b> ج يوم ${dayLabel(F.min.date)} ✅</div>`}</div>`;
  }
  // حدود المصروف
  h += limitsCard(o);
  // بتصرف فين (دايرة)
  h += spendCard(o, 'dnH');

  // آخر 6 شهور
  const hist = [];
  for(let i = 5; i >= 0; i--){ const s = summary(addMonths(VIEW, -i)); hist.push(s); }
  const hmax = Math.max(1, ...hist.map(s => Math.max(s.incReceived, s.outActual)));
  if(hist.some(s => s.outActual > 0 || s.incReceived > 0)){
    h += `<div class="card"><h3>آخر 6 شهور <span class="muted">🟩 دخل · 🟦 خارج</span></h3>` +
      hist.map(s => `<div class="hist-row"><span class="muted">${MONTHS[s.p.m]}</span>
        <div><div class="bar good" style="margin-bottom:3px"><i style="width:${s.incReceived / hmax * 100}%"></i></div><div class="bar"><i style="width:${s.outActual / hmax * 100}%"></i></div></div>
        <span class="num" style="text-align:left; font-size:11.5px">${fmt(s.incReceived - s.outActual)}</span></div>`).join('') +
      `<div class="muted">الرقم على الشمال = الفرق (دخل − خارج).</div></div>`;
  }
  return h;
};

function onboarding(){
  const steps = [
    [(S.cashCounts || []).length > 0, 'اكتب رصيدك الحالي (الفلوس اللي معاك)', 'cashCount'],
    [S.incomes.length > 0, 'سجّل مرتبك ومصادر دخلك', 'incomeForm'],
    [S.bills.length > 0, 'التزاماتك الشهرية (إيجار، كهربا، نت، مدارس...)', 'billForm'],
    [S.debts.length > 0 || S.settings.noDebts, 'الديون اللي عليك', 'debtForm'],
    [S.goals.length > 0, 'هدف العربية آخر 2027', 'carGoal'],
    [S.items.length > 0, 'أصناف البيت ومعدل استهلاكها', 'seedItems'],
  ];
  if(steps.every(s => s[0]) || S.settings.hideOnboarding) return '';
  return `<div class="card"><h3>👋 يلا نجهّز البيت <button class="btn sm ghost" data-act="hideOnboarding">إخفاء</button></h3>

    <div class="note">بعد كده كل يوم دوس على <b>+</b> وسجّل أي جنيه بتصرفه، والبرنامج هيقولك تقدر تصرف كام في اليوم.</div></div>`;
}

function alertsHtml(o){
  if(!o.isCurrent) return '';
  const td = todayS(), out = [];
  o.incLines.forEach(l => {
    if(l.got > 0 && !l.closed){ out.push(['info', '💰', `${esc(l.inc.name)}: نزل <span class="num">${fmt(l.got)}</span> من <span class="num">${fmt(l.inc.amount)}</span> — فاضل <span class="num">${fmt(l.inc.amount - l.got)}</span>`, `<button class="btn sm good" data-act="receiveIncome" data-id="${l.inc.id}">نزل الباقي</button>`]); return; }
    if(l.got > 0 && l.closed){
      // مرتب الشهر ده نزل — لو مرتب الشهر الجاي قرّب (أسبوع) ممكن ينزل بدري
      const nr = periodRange(addMonths(o.p, 1)), nd = dueDateIn(nr, l.inc.day || S.settings.cycleDay || 1), dd = diffDays(td, nd);
      if(dd > 0 && dd <= 7 && !incGot(l.inc, addMonths(o.p, 1))) out.push(['info', '💰', `${esc(l.inc.name)} الجاي ميعاده ${dayLabel(nd)} (بعد <span class="num">${dd}</span> يوم) — لو نزل بدري سجّله`, `<button class="btn sm good" data-act="receiveIncome" data-id="${l.inc.id}">نزل</button>`]);
      return;
    }
    if(l.got > 0) return;
    const due = dueDateIn(o.r, l.inc.day || S.settings.cycleDay || 1);
    if(td < due && diffDays(td, due) <= 7) out.push(['info', '💰', `${esc(l.inc.name)} ميعاده ${dayLabel(due)} (بعد <span class="num">${diffDays(td, due)}</span> يوم) — لو نزل بدري سجّله`, `<button class="btn sm good" data-act="receiveIncome" data-id="${l.inc.id}">نزل</button>`]);
    if(td >= due) out.push(['info', '💰', `${esc(l.inc.name)} (<span class="num">${fmt(l.inc.amount)}</span>) لسه ما اتسجلش إنه اتستلم`, `<button class="btn sm good" data-act="receiveIncome" data-id="${l.inc.id}">استلمته</button>`]);
  });
  o.billLines.forEach(l => {
    if(l.paidT.length) return;
    const d = diffDays(td, l.due);
    if(d < 0) out.push(['bad', '⏰', `${esc(l.b.name)} متأخر ${-d} يوم (<span class="num">${fmt(l.b.amount)}</span>)`, `<button class="btn sm dark" data-act="payBill" data-id="${l.b.id}">دفعت</button>`]);
    else if(d <= 4) out.push(['warn', '📋', `${esc(l.b.name)} ${d === 0 ? 'النهاردة' : 'كمان ' + d + ' يوم'} (<span class="num">${fmt(l.b.amount)}</span>)`, `<button class="btn sm dark" data-act="payBill" data-id="${l.b.id}">دفعت</button>`]);
  });
  o.debtLines.forEach(l => {
    if(l.paidT.length || l.remBefore <= 0.5 || !(l.d.monthly > 0)) return;
    const d = diffDays(td, l.due);
    if(d < 0) out.push(['bad', '💳', `قسط ${esc(l.d.name)} متأخر ${-d} يوم`, `<button class="btn sm dark" data-act="payDebt" data-id="${l.d.id}">سددت</button>`]);
    else if(d <= 4) out.push(['warn', '💳', `قسط ${esc(l.d.name)} ${d === 0 ? 'النهاردة' : 'كمان ' + d + ' يوم'}`, `<button class="btn sm dark" data-act="payDebt" data-id="${l.d.id}">سددت</button>`]);
  });
  activeDues().slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(d => {
    const left = diffDays(td, d.date), res = Math.max(0, dueReserved(d)), short = d.amount - res;
    const nm = esc(dueName(d)), ev = d.kind === 'event', ic = ev ? '🎂' : '📅', paidLbl = ev ? 'صرفت' : 'دفعت';
    if(ev && left < 0){ out.push(['info', ic, `${nm} عدّى من ${-left} يوم — سجّل صرفت كام`, `<button class="btn sm dark" data-act="payDue" data-id="${d.id}">صرفت</button>`]); return; }
    if(left < 0) out.push(['bad', '📅', `ميعاد سداد ${nm} (<span class="num">${fmt(d.amount)}</span>) عدّى من ${-left} يوم`, `<button class="btn sm dark" data-act="payDue" data-id="${d.id}">دفعت</button>`]);
    else if(left <= 14) out.push([short > 1 ? 'warn' : 'info', ic, `${nm}: <span class="num">${fmt(d.amount)}</span> ${left === 0 ? 'النهاردة' : 'بعد ' + left + ' يوم'}${short > 1 ? ` — جاهز منه <span class="num">${fmt(res)}</span>، ناقصك <b class="num">${fmt(short)}</b>` : ' — الفلوس جاهزة ✔'}`, `<button class="btn sm dark" data-act="${short > 1 && left > 0 ? 'reserveDue' : 'payDue'}" data-id="${d.id}">${short > 1 && left > 0 ? 'شلت' : paidLbl}</button>`]);
  });
  activeRecvs().forEach(rv => {
    const nx = recvNext(rv); if(!nx || !nx.date) return;
    const left = diffDays(td, nx.date);
    if(left < 0) out.push(['warn', '🤝', `${esc(rv.name)} كان المفروض يرجعلك <b class="num">${fmt(nx.left)}</b> من ${-left} يوم — فكّره`, `<button class="btn sm good" data-act="recvGet" data-id="${rv.id}">استلمت</button>`]);
    else if(left <= 3) out.push(['info', '🤝', `${esc(rv.name)} هيرجعلك <b class="num">${fmt(nx.left)}</b> ${left === 0 ? 'النهاردة' : 'بعد ' + left + ' يوم'}`, `<button class="btn sm good" data-act="recvGet" data-id="${rv.id}">استلمت</button>`]);
  });
  const toSet = sum(o.dueLines.filter(l => diffDays(td, l.d.date) > 14), l => Math.max(0, l.per - l.resThis));
  if(toSet > 1) out.push(['info', '📥', `الشهر ده المفروض تشيل <b class="num">${fmt(toSet)}</b> للمواعيد الجاية`, `<button class="btn sm dark" data-act="goDues">التفاصيل</button>`]);
  limitLines(o).forEach(l => {
    if(l.pct >= 1) out.push(['bad', l.c.icon, `${esc(l.c.name)} عدّى الحد الشهري: <b class="num">${fmt(l.spent)}</b> من <span class="num">${fmt(l.c.limit)}</span>`]);
    else if(l.pct >= 0.8) out.push(['warn', l.c.icon, `${esc(l.c.name)} وصل <b class="num">${Math.round(l.pct * 100)}%</b> من الحد — فاضل <span class="num">${fmt(l.c.limit - l.spent)}</span> لآخر الشهر`]);
  });
  const low = S.items.filter(it => !isPaused(it)).map(it => ({it, d:daysLeft(it)})).filter(x => x.d != null && x.d <= 5).sort((a, b) => a.d - b.d);
  if(low.length) out.push(['warn', '🧺', `هيخلصوا قريب: ${low.slice(0, 4).map(x => esc(x.it.name) + ' (' + Math.max(0, Math.floor(x.d)) + ' يوم)').join('، ')}${low.length > 4 ? '…' : ''}`, `<button class="btn sm dark" data-act="goShop">قائمة الشراء</button>`]);
  // امبارح ما اتسجلش فيه ولا مصروف
  const yd = addDays(td, -1), firstExp = S.tx.filter(t => t.type === 'exp').map(t => t.date).sort()[0];
  if(firstExp && firstExp < yd && !S.tx.some(t => t.type === 'exp' && t.date === yd) && !(S.settings.noSpend || {})[yd])
    out.push(['info', '📝', `امبارح ما سجلتش ولا مصروف — صرفت حاجة؟`, `<span class="btns"><button class="btn sm dark" data-act="addYesterday">سجّل</button><button class="btn sm" data-act="noSpend" data-d="${yd}">ما صرفتش</button></span>`]);
  if(!S.settings.syncUrl && S.tx.length >= 5){
    const ex = Number(localStorage.getItem(EXPORTED_KEY) || 0);
    if(Date.now() - ex > 7 * 864e5) out.push(['info', '💾', 'اعمل نسخة احتياطية الأسبوع ده — دوسة واحدة تبعتها لنفسك على واتساب أو تحفظها في Files.', `<button class="btn sm dark" data-act="exportData">نسخة</button>`]);
  }
  if(!out.length) return '';
  const one = a => `<div class="alert ${a[0]}"><span class="ic">${a[1]}</span><span class="tx">${a[2]}</span>${a[3] || ''}</div>`;
  // أول تنبيهين بس ظاهرين، والباقي مطوي — عشان الأرقام المهمة ما تنزلش لتحت
  if(out.length <= 3) return out.map(one).join('');
  return out.slice(0, 2).map(one).join('') + `<details class="more-alerts"><summary>🔔 ${out.length - 2} تنبيهات تانية</summary>${out.slice(2).map(one).join('')}</details>`;
}

/* ===================== اليومية ===================== */
function txInfo(t){
  if(t.type === 'xfer'){ const a = byId(S.wallets, t.from), b = byId(S.wallets, t.to); return {ic:'⇄', title:`تحويل: ${a ? a.name : '—'} ← ${b ? b.name : '—'}`}; }
  if(t.type === 'inc' && t.recvId){ const rv = byId(S.recvs || [], t.recvId); return {ic:'🤝', title:'رجعلي من: ' + (rv ? rv.name : (t.note || '—'))}; }
  if(t.type === 'inc'){ const i = byId(S.incomes, t.incomeId); return {ic:'💰', title:i ? i.name : 'دخل إضافي'}; }
  if(t.type === 'lend'){ const rv = byId(S.recvs || [], t.recvId); return {ic:'🤝', title:'سلّفت: ' + (rv ? rv.name : (t.note || '—'))}; }
  if(t.type === 'bill'){ const b = byId(S.bills, t.billId), du = byId(S.dues || [], t.dueId); return {ic:'📋', title:'التزام: ' + (b ? b.name : du ? du.name : (t.note || '—'))}; }
  if(t.type === 'reserve'){ const du = byId(S.dues || [], t.dueId); return {ic:t.amount < 0 ? '📤' : '📥', title:(t.amount < 0 ? 'اتدفع من المحجوز: ' : 'شلت لـ: ') + (du ? dueName(du) : '—')}; }
  if(t.type === 'debt'){ const d = byId(S.debts, t.debtId); return {ic:'💳', title:'قسط: ' + (d ? d.name : '—')}; }
  if(t.type === 'save'){ const g = byId(S.goals, t.goalId); return {ic:t.amount < 0 ? '↩️' : '🏦', title:(t.amount < 0 ? 'سحب من: ' : 'تحويش: ') + (g ? g.name : '—')}; }
  if(t.type === 'exp' && t.dueId){ const du = byId(S.dues || [], t.dueId); return {ic:'🎂', title:du ? du.name : (t.note || 'مناسبة')}; }
  const c = catOf(t.cat), it = t.itemId ? byId(S.items, t.itemId) : null;
  return {ic:c.icon, title:it ? `${it.name} · ${qtyPlain(it, t.qty)}` : c.name};
}
function txRow(t){
  if(t.type === 'xfer'){ const i = txInfo(t); return `<div class="list-item" data-act="editTx" data-id="${t.id}"><div class="li-ic">⇄</div><div class="li-main"><div class="li-title">${esc(i.title)}</div>${t.note ? `<div class="li-sub">${esc(t.note)}</div>` : ''}</div><div class="li-end"><b class="num muted">${fmt(t.amount)}</b></div></div>`; }
  const i = txInfo(t), plus = t.type === 'inc' || ((t.type === 'save' || t.type === 'reserve') && t.amount < 0);
  return `<div class="list-item" data-act="editTx" data-id="${t.id}">
    <div class="li-ic">${i.ic}</div>
    <div class="li-main"><div class="li-title">${esc(i.title)}${t.grp ? ' <span class="tag">🧾</span>' : ''}</div>${t.note && t.note !== i.title ? `<div class="li-sub">${esc(t.note)}</div>` : ''}</div>
    <div class="li-end"><b class="num ${plus ? 'pos' : ''}">${plus ? '+' : '−'}${fmt(Math.abs(t.amount))}</b></div></div>`;
}
/* نص البحث لكل حركة: العنوان والملاحظة والمبلغ والتصنيف والمحفظة */
function txSearchText(t){
  const w = S.wallets.length > 1 ? (byId(S.wallets, walletOf(t)) || {}).name : '';
  return [txInfo(t).title, t.note, t.amount, t.cat ? catOf(t.cat).name : '', w].join(' ').toLowerCase();
}
function logFiltered(o){
  let list = LOGALL ? S.tx.slice() : o.T.slice();
  if(LOGF !== 'all') list = list.filter(t => t.type === LOGF);
  if(LOGCAT) list = list.filter(t => t.cat === LOGCAT);
  const q = normNum(LOGQ).toLowerCase() || LOGQ.trim().toLowerCase();
  const qa = normAr(LOGQ);
  if(LOGQ.trim()) list = list.filter(t => normAr(txSearchText(t)).includes(qa) || (q && String(t.amount).includes(q)));
  return list.sort((a, b) => evKey(a) < evKey(b) ? 1 : -1);
}
function logListHtml(o){
  const all = logFiltered(o), list = all.slice(0, 400), filtered = LOGQ.trim() || LOGCAT || LOGALL;
  if(!list.length) return `<div class="card empty"><div class="e-ic">🧾</div>${filtered ? 'مفيش نتايج.' : 'مفيش حاجة متسجلة في الشهر ده.<br>دوس على <b>+</b> وسجّل أول مصروف.'}</div>`;
  let h = filtered ? `<div class="muted" style="margin:0 2px 8px">النتيجة: <b class="num">${all.length}</b> حركة · خارج <b class="num">${fmt(sum(all.filter(t => !['inc', 'xfer'].includes(t.type)), t => t.amount))}</b>${all.length > 400 ? ' (معروض أحدث 400)' : ''}</div>` : '';
  h += '<div class="card" style="padding-top:4px">';
  let cur = null;
  list.forEach(t => {
    if(t.date !== cur){
      cur = t.date;
      const dayOut = sum(list.filter(x => x.date === cur && x.type !== 'inc' && x.type !== 'xfer' && x.amount > 0), x => x.amount);
      h += `<div class="day-h"><span>${dayLabel(cur)}${LOGALL && pd(cur).getFullYear() !== new Date().getFullYear() ? ' ' + pd(cur).getFullYear() : ''}</span><span class="num">${dayOut ? '−' + fmt(dayOut) : ''}</span></div>`;
    }
    h += txRow(t);
  });
  return h + '</div>';
}

/* ===================== استوك البيت ===================== */
PAGES.stock = function(){
  const sub = SUB.stock;
  let h = `<div class="seg">
    <button class="${sub === 'items' ? 'on' : ''}" data-act="sub" data-k="stock" data-v="items">الأصناف</button>
    <button class="${sub === 'jard' ? 'on' : ''}" data-act="sub" data-k="stock" data-v="jard">الجرد (اللي عندي)</button>
    <button class="${sub === 'shop' ? 'on' : ''}" data-act="sub" data-k="stock" data-v="shop">أشتري إيه</button></div>`;
  if(!S.items.length){
    return h + `<div class="card empty"><div class="e-ic">🧺</div>لسه مفيش أصناف.<br>ضيف حاجات البيت اللي بتشتريها كل شهر، وكل صنف بتستهلك منه قد إيه في الشهر.
      <div class="btns" style="justify-content:center; margin-top:12px"><button class="btn primary" data-act="seedItems">ضيف الأصناف الشائعة</button><button class="btn" data-act="itemForm">صنف جديد</button></div></div>`;
  }

/* جرد أقل من اللي اشتريته النهارده بعد آخر جرد (جبنة: اشتريت نص كيلو الصبح، وكتبت 0 بليل)

  const ck = evKey(at), cs = itemCounts(it).filter(c => evKey(c) < ck), last = cs[cs.length - 1], lk = last ? evKey(last) : '';

/* بيسجّل الجرد — ولو فيه صنف من دول بيسأل الأول. بيرجّع false لو فتح شاشة السؤال (عشان ما تتقفلش) */
function pushCounts(list, then){
  // x.ts = وقت ما كتبت الرقم (من مسودة الجرد) — وإلا دلوقتي

  const conf = list.map((x, i) => ({x, B:buysBeforeCount(x.it, x.qty, at(x, i))})).filter(y => y.B);
  const write = before => {
    list.forEach((x, i) => {
      const y = before && conf.find(z => z.x === x), a = at(x, i);
      S.counts.push({id:uid(), ts:y ? Math.min(...y.B.map(t => t.ts || 0)) - 1 : a.ts, itemId:x.it.id, date:a.date, qty:x.qty});
    });
    then();
  };
  if(!conf.length){ write(false); return; }
  openSheet('الجرد ده اتعمل امتى؟', `<div class="muted" style="line-height:1.8; margin-bottom:8px">كتبت أقل من اللي اشتريته النهارده:</div>

    <div class="muted" style="margin-bottom:10px; line-height:1.7"><b>قبل:</b> الشراء يتضاف على الجرد (الموجود = الجرد + اللي اشتريته).<br><b>بعد:</b> اللي كتبته هو الموجود دلوقتي، يعني اللي اشتريته اتاكل.</div>${Fd.foot('حفظ الجرد')}`,
    v => write(v.when !== 'after'));
  return false;
}

/* بحث الجرد: بيخبّي الأصناف اللي مش مطابقة بس — الأرقام اللي اتكتبت بتفضل زي ما هي وبتتحفظ عادي */
