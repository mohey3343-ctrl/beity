/* متوسط صرفك اليومي الحقيقي (آخر 30 يوم) — ولو لسه مفيش تسجيلات، المسموح في اليوم */
function avgDailySpend(){
  const td = todayS(), from = addDays(td, -30);
  const all = S.tx.filter(t => t.type === 'exp' && !t.dueId);
  if(!all.length){ const o = summary(periodOf(td)); return {v:Math.max(0, o.perDay || 0), src:'budget'}; }
  const first = all.map(t => t.date).sort()[0];
  const days = Math.min(30, Math.max(7, diffDays(first, td) + 1));
  return {v:sum(all.filter(t => t.date > from && t.date <= td), t => t.amount) / days, src:'actual', days};
}
/* الرصيد يوم بيوم لـ N يوم قدام:
   الفلوس كلها دلوقتي (الحر + المحجوز) + المرتبات − الالتزامات − الأقساط − مواعيد السداد
   − التحويش الشهري − متوسط الصرف اليومي. (فلوس الناس اختياري لأنها مش مضمونة) */
function forecast(N, withRecv){
  const td = todayS(), tom = addDays(td, 1), end = addDays(td, N), b = cashBalance();
  const start = (b.known ? b.value : 0) + totalReserved(), daily = avgDailySpend();
  const evs = [], paidIn = (pred, r) => S.tx.some(t => pred(t) && t.date >= r.start && t.date <= r.end);
  const at = d => d < tom ? tom : d;
  for(let p = periodOf(td); periodRange(p).start <= end; p = addMonths(p, 1)){
    const r = periodRange(p), isCur = samePeriod(p, periodOf(td));
    let payday = null;
    S.incomes.forEach(inc => {
      const d = at(dueDateIn(r, inc.day || 1));
      if(!payday || d < payday) payday = d;
      if(paidIn(t => t.type === 'inc' && t.incomeId === inc.id, r)) return;
      if(d <= end) evs.push({date:d, n:'💰 ' + inc.name, a:inc.amount || 0});
    });
    S.bills.filter(x => !x.off).forEach(x => {
      if(paidIn(t => t.type === 'bill' && t.billId === x.id, r)) return;
      const d = at(dueDateIn(r, x.dueDay || 1)); if(d <= end) evs.push({date:d, n:'📋 ' + x.name, a:-(x.amount || 0)});
    });
    S.debts.filter(x => x.monthly > 0).forEach(x => {
      if(paidIn(t => t.type === 'debt' && t.debtId === x.id, r)) return;
      const d = at(dueDateIn(r, x.dueDay || 1)); if(d <= end) evs.push({date:d, n:'💳 ' + x.name, a:-x.monthly, debt:x.id});
    });
    // ادفع لنفسك الأول: التحويش الشهري يوم نزول المرتب
    S.goals.forEach(g => {
      let need = goalPlanMonthly(g);
      if(isCur) need -= sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && t.date >= r.start && t.date <= r.end), t => t.amount);
      if(g.kind === 'gameya' && g.start && (p.y + '-' + pad(p.m + 1)) > g.deadline) need = 0;
      const d = at(payday || r.start);
      if(need > 1 && d <= end) evs.push({date:d, n:(g.icon || '🎯') + ' تحويش ' + g.name, a:-need});
    });
  }
  activeDues().forEach(d => {
    let dt = d.date, first = true;
    while(dt <= end){
      evs.push({date:at(dt), n:(d.kind === 'event' ? '🎂 ' : '📅 ') + dueName(d), a:-(first ? d.amount : (d.baseAmount || d.amount))});
      first = false; if(!(d.repeat > 0)) break; dt = addMonthsDate(dt, d.repeat);
    }
  });
  if(withRecv) activeRecvs().forEach(rv => recvSchedule(rv).forEach(it => { if(it.left > 0.5 && it.date >= tom && it.date <= end) evs.push({date:it.date, n:'🤝 ' + rv.name, a:it.left}); }));
  evs.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : y.a - x.a);
  const rem = {}; S.debts.forEach(x => rem[x.id] = debtRemaining(x));
  const pts = [{date:td, bal:start, ev:[]}];
  let bal = start, k = 0;
  for(let i = 1; i <= N; i++){
    const date = addDays(td, i), ev = [];
    while(k < evs.length && evs[k].date === date){
      const e = evs[k++];
      if(e.debt){ e.a = -Math.min(-e.a, rem[e.debt]); rem[e.debt] += e.a; if(e.a > -0.5) continue; }
      bal += e.a; ev.push(e);
    }
    bal -= daily.v;
    pts.push({date, bal, ev});
  }
  const min = pts.reduce((m, x) => x.bal < m.bal ? x : m, pts[0]);
  const firstNeg = pts.find(x => x.bal < 0) || null;
  return {pts, min, firstNeg, daily, start, known:b.known};
}
function cashSuggestions(F){
  const out = [], neg = F.firstNeg, days = neg ? Math.max(1, diffDays(todayS(), neg.date)) : 0;
  const gap = -F.min.bal;
  if(gap > 0){
    out.push(`🛒 قلّل الصرف اليومي بحوالي <b class="num">${fmt(gap / Math.max(1, diffDays(todayS(), F.min.date)))}</b> ج (من <span class="num">${fmt(F.daily.v)}</span> لـ <span class="num">${fmt(Math.max(0, F.daily.v - gap / Math.max(1, diffDays(todayS(), F.min.date))))}</span>) لحد ${dayLabel(F.min.date)}.`);
    const before = F.pts.filter(x => x.date <= F.min.date).flatMap(x => x.ev);
    const saves = before.filter(e => e.a < 0 && /تحويش/.test(e.n));
    if(saves.length) out.push(`⏸️ أجّل ${saves.map(e => esc(e.n.replace(/^\S+\s/, ''))).join(' و')} الشهر ده (<b class="num">${fmt(-sum(saves, e => e.a))}</b>) — الأمان قبل التحويش.`);
    const big = before.filter(e => e.a < 0 && !/تحويش/.test(e.n)).sort((x, y) => x.a - y.a)[0];
    if(big) out.push(`📆 أكبر حاجة خارجة قبل العجز: ${esc(big.n)} (<span class="num">${fmt(-big.a)}</span>) يوم ${dayLabel(big.date)} — حاول تأجّلها لبعد المرتب أو تقسّمها.`);
    const rv = activeRecvs().map(x => ({x, nx:recvNext(x)})).filter(y => y.nx);
    if(rv.length) out.push(`🤝 ليك فلوس عند ${rv.map(y => esc(y.x.name) + ' (' + fmt(y.nx.left) + ')').join('، ')} — اطلبها بدري.`);
  }
  return out;
}
function emergencyCard(){
  const ess = sum(S.bills.filter(x => !x.off), x => x.amount || 0) + sum(S.debts.filter(x => debtRemaining(x) > 0.5), x => x.monthly || 0) + houseMonthlyCost() + avgDailySpend().v * 30;
  if(ess < 1) return '';
  const target = Math.round(ess * 3 / 100) * 100, g = S.goals.find(x => x.kind === 'emergency' || /طوارئ/.test(x.name));
  return `<div class="card"><h3>🛟 صندوق الطوارئ</h3>
    <div class="muted" style="line-height:1.8">أهم حماية من العجز: مبلغ على جنب يغطي <b>3 شهور</b> من مصاريفك الأساسية (التزامات + أقساط + بيت + مصروف) — حوالي <b class="num">${fmt(target)}</b> ج.</div>
    ${g ? `<div class="kv"><span>معاك فيه</span><b>${money(goalSaved(g))}</b></div><div class="bar good"><i style="width:${Math.min(100, goalSaved(g) / target * 100)}%"></i></div>`
        : `<button class="btn dark" style="margin-top:10px" data-act="emergencyGoal" data-t="${target}">ابدأ صندوق طوارئ</button>`}</div>`;
}
function cashChart(F){
  const W = 340, H = 170, L = 8, Rr = 8, T = 14, B = 24, N = F.pts.length - 1;
  const vals = F.pts.map(x => x.bal), lo = Math.min(0, ...vals), hi = Math.max(0, ...vals) || 1, span = (hi - lo) || 1;
  const x = i => L + i * (W - L - Rr) / N, y = v => T + (hi - v) / span * (H - T - B);
  const line = F.pts.map((pt, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(pt.bal).toFixed(1)).join(' ');
  const area = line + ` L ${x(N).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;
  const ticks = F.pts.map((pt, i) => ({i, d:pd(pt.date)})).filter(t => t.d.getDate() === 1 && t.i > 0)
    .map(t => `<line x1="${x(t.i)}" x2="${x(t.i)}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width="1"/><text x="${x(t.i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--soft)">1 ${MONTHS[t.d.getMonth()]}</text>`).join('');
  const mi = F.pts.indexOf(F.min);
  window.__fc = {F, x, y, W, H, T, B};
  return `<div class="fc-wrap" id="fcWrap"><svg class="fc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="توقّع الرصيد">
    ${lo < 0 ? `<rect x="${L}" y="${y(0)}" width="${W - L - Rr}" height="${H - B - y(0)}" fill="var(--bad)" opacity=".08"/>` : ''}
    ${ticks}
    <path d="${area}" fill="var(--c1)" opacity=".12"/>
    <line x1="${L}" x2="${W - Rr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--soft)" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="${W - Rr}" y="${y(0) - 4}" text-anchor="end" font-size="10" fill="var(--soft)">صفر</text>
    <path d="${line}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(mi)}" cy="${y(F.min.bal)}" r="4.5" fill="${F.min.bal < 0 ? 'var(--bad)' : 'var(--c1)'}" stroke="var(--card)" stroke-width="2"/>
    <line id="fcCross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity="0"/>
    <circle id="fcDot" r="4" fill="var(--c1)" stroke="var(--card)" stroke-width="2" opacity="0"/>
    <rect id="fcHit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="fc-tip" id="fcTip"></div></div>`;
}
AFTER.cash = () => {
  const hit = document.getElementById('fcHit'); if(!hit || !window.__fc) return;
  const {F, x, y} = window.__fc, svg = hit.ownerSVGElement, tip = $('#fcTip'), N = F.pts.length - 1;

    const vx = (pt.clientX - rc.left) / rc.width * window.__fc.W;
    let i = Math.round((vx - 8) / ((window.__fc.W - 16) / N)); i = Math.max(0, Math.min(N, i));

    tip.style.display = 'block';
    const px = x(i) / window.__fc.W * rc.width, tw = tip.offsetWidth;

  };

  hit.addEventListener('mousemove', show); hit.addEventListener('mouseleave', hide);

};

/* ===================== الشيت (النوافذ) ===================== */
let SHEET_SUBMIT = null, lastSubmit = 0;
function openSheet(title, body, onSubmit){
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  $('#sheetWrap').classList.add('open');
  SHEET_SUBMIT = onSubmit || null;
  lastSubmit = 0;
  const f = $('#sheetBody [autofocus]');
  if(f) setTimeout(() => { f.focus(); if(f.select) f.select(); }, 60);
}
function closeSheet(){ $('#sheetWrap').classList.remove('open'); SHEET_SUBMIT = null; }
$('#sheetForm').addEventListener('submit', e => {
  e.preventDefault();
  if(!SHEET_SUBMIT) return;
  if(Date.now() - lastSubmit < 800) return;   // دوسة مكررة بالغلط
  if(!validNums(e.target)) return;
  lastSubmit = Date.now();
  const fd = new FormData(e.target), v = {};
  for(const [k, val] of fd.entries()) v[k] = val;
  if(SHEET_SUBMIT(v, e.target) !== false) closeSheet();
});
$('#sheetWrap').addEventListener('click', e => { if(e.target.id === 'sheetWrap') closeSheet(); });

const Fd = {
  text:(n, l, v, a) => `<label class="fld"><span>${l}</span><input name="${n}" value="${esc(v)}" ${a || ''}></label>`,
  num:(n, l, v, a, hint) => `<label class="fld"><span>${l}</span><input name="${n}" inputmode="decimal" value="${v === '' || v == null || v === 0 ? '' : esc(v)}" ${a || ''}>${hint ? `<div class="hint">${hint}</div>` : ''}</label>`,
  date:(n, l, v) => `<label class="fld"><span>${l}</span><input type="date" name="${n}" value="${esc(v)}"></label>`,
  month:(n, l, v) => `<label class="fld"><span>${l}</span><input type="month" name="${n}" value="${esc(v)}"></label>`,
  day:(n, l, v) => `<label class="fld"><span>${l}</span><select name="${n}">${Array.from({length:31}, (_, i) => `<option ${(v || 1) === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></label>`,
  /* قايمة اختيار + "إضافة جديد" — الجديد بيتحفظ في الإعدادات عشان يفضل موجود */
  pick:(n, l, opts, v, store) => {
    const list = opts.slice(); if(v && !list.includes(v)) list.push(v);
    return `<label class="fld"><span>${l}</span><select name="${n}" data-pick="${store}" data-label="${l}" data-prev="${esc(v || list[0] || '')}">${list.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}<option value="__new">➕ إضافة جديد…</option></select></label>`;
  },
  foot:(save, del) => `<div class="sheet-foot"><button type="submit" class="btn primary">${save || 'حفظ'}</button>${del ? `<button type="button" class="btn danger" data-act="${del.act}" data-id="${del.id}">${del.label || 'حذف'}</button>` : ''}</div>`,
};
function need(v, msg){ if(!v){ toast(msg, true); return false; } return true; }

/* ---- تسجيل مصروف / دخل ---- */
function quickAdd(preset){
  preset = preset || {};
  const t = preset.tx || null;
  const type = t ? t.type : (preset.type || 'exp');
  const cat = t ? t.cat : (preset.cat || 'market');
  const cats = S.cats.map(c => `<label><input type="radio" name="cat" value="${c.id}" ${c.id === cat ? 'checked' : ''}><span><em>${c.icon}</em>${esc(c.name)}</span></label>`).join('');
  const isExp = type === 'exp', isInc = type === 'inc';
  let body = '';
  if(!t){
    body += `<div class="seg"><button type="button" class="${isExp ? 'on' : ''}" data-act="qaType" data-v="exp">مصروف</button><button type="button" data-act="qaMulti">🧾 كذا حاجة</button><button type="button" class="${isInc ? 'on' : ''}" data-act="qaType" data-v="inc">دخل إضافي</button></div>`;
  }
  body += `<label class="fld"><input class="amount" name="amount" inputmode="decimal" placeholder="0" value="${t ? Math.abs(t.amount) : ''}" autofocus></label>`;
  if(type === 'exp' && !(t && t.itemId)) body += `<div class="catpick">${cats}</div>`;
  if(t && t.itemId) body += Fd.num('qty', 'الكمية', t.qty);
  body += Fd.text('note', 'ملاحظة (اختياري)', t ? t.note : '', 'placeholder="مثلاً: خضار من السوق"');
  body += Fd.date('date', 'التاريخ', t ? t.date : (preset.date || todayS()));
  body += Fd.foot(t ? 'حفظ التعديل' : 'سجّل', t ? {act:'delTx', id:t.id} : null);
  const title = t ? 'تعديل: ' + txInfo(t).title : isInc ? 'دخل إضافي' : 'مصروف جديد';
  openSheet(title, body, v => {
    const amount = num(v.amount);
    if(!need(amount > 0, 'اكتب المبلغ')) return false;
    if(!sane(amount, v.date, t ? t.type : type, t ? t.id : null, v.cat)) return false;
    if(t){
      t.amount = (t.type === 'save' || t.type === 'reserve') && t.amount < 0 ? -amount : amount;
      t.note = v.note.trim(); t.date = v.date || t.date;
      if(v.cat) t.cat = v.cat;
      if(t.itemId && v.qty !== undefined) t.qty = num(v.qty);
      save(); toast('اتعدّل');
    }else{
      S.tx.push({id:uid(), ts:Date.now(), type, amount, cat:type === 'exp' ? (v.cat || 'other') : undefined, note:v.note.trim(), date:v.date || todayS()});
      save(); toast(type === 'inc' ? 'اتسجّل الدخل' : 'اتسجّل ✔');
      if(type === 'inc' && amount >= 100) setTimeout(() => allocateExtra(amount, v.date || todayS()), 60);
    }
  });
}

/* تحذيرات منطقية قبل التسجيل (مش منع): مبلغ كبير غريب، تاريخ في المستقبل أو قديم، أو تسجيل مكرر */
function sane(amount, date, type, editId, cat){
  const td = todayS(), inc = sum(S.incomes, i => i.amount || 0);
  const big = type === 'inc' ? Math.max(50000, inc * 3) : Math.max(10000, inc * 0.5);
  if(amount >= big && !confirm(`المبلغ ${fmt(amount)} ج كبير — متأكد إنه مظبوط؟ (مش ${fmt(amount / 10)}؟)`)) return false;
  if(date && date > addDays(td, 1) && !confirm(`التاريخ ${dayLabel(date)} في المستقبل — متأكد؟`)) return false;
  if(date && date < addDays(td, -90) && !confirm(`التاريخ ${dayLabel(date)} ${pd(date).getFullYear()} قديم أوي — متأكد؟`)) return false;
  if(!editId){
    const dup = S.tx.find(x => x.type === type && Math.abs(x.amount - amount) < 0.01 && (!cat || x.cat === cat) && x.date === (date || td) && Date.now() - (x.ts || 0) < 3 * 60000);
    if(dup && !confirm('سجّلت نفس المبلغ ده من دقايق — تسجّله تاني؟')) return false;
  }
  return true;
}

/* ---- الأصناف ---- */
function itemForm(id){
  const it = id ? byId(S.items, id) : null;
  const groups = Array.from(new Set(['تموين','ألبان وبروتين','خضار وفاكهة','منظفات','عناية شخصية', ...(S.settings.groups || []), ...groupsOf()]));
  const packs = Array.from(new Set([...PACKS, ...(S.settings.packs || []), ...S.items.map(x => x.pu).filter(Boolean)]));
  const r = it ? dailyRate(it) : null, learned = it ? learnedDaily(it) : null;
  const base = it ? baseOf(it) : 'KG', pu = it ? (it.pu || '') : 'كيس', f = it ? packF(it) : 1;
  let body = Fd.text('name', 'اسم الصنف', it ? it.name : '', 'autofocus placeholder="مثلاً: مكرونة"');
  body += `<div class="fld2">${Fd.pick('group', 'المجموعة', groups, it ? it.group : 'تموين', 'groups')}
    <label class="fld"><span>المقياس الأساسي</span><select name="base" data-ilbl>${Object.entries(BASES).map(([k, v]) => `<option value="${k}" ${k === base ? 'selected' : ''}>${v.en} — ${v.ar}</option>`).join('')}</select></label></div>`;
  body += `<div class="fld2"><label class="fld"><span>بتشتريه في (العبوة)</span><select name="pu" data-ilbl data-pick="packs" data-label="العبوة" data-prev="${esc(pu)}">
      <option value="" ${!pu ? 'selected' : ''}>— من غير عبوة —</option>${packs.map(o => `<option value="${esc(o)}" ${o === pu ? 'selected' : ''}>${esc(o)}</option>`).join('')}<option value="__new">➕ إضافة جديد…</option></select></label>
    <label class="fld" data-l="pfWrap"><span data-l="pf">العبوة فيها كام</span><input name="pf" inputmode="decimal" value="${it && hasPack(it) ? it.pf : (it ? '' : 1)}" data-ilbl></label></div>`;
  body += `<div class="fld2">${Fd.num('monthly', '<span data-l="monthly">بتستهلك كام في الشهر</span>', it && it.monthly ? +(it.monthly / f).toFixed(3) : '')}${Fd.num('price', '<span data-l="price">السعر</span>', it && it.price ? +(it.price * f).toFixed(2) : '')}</div>`;
  body += `<div class="muted" data-l="conv" style="margin:-4px 0 10px"></div>`;
  if(!it) body += Fd.num('stock', '<span data-l="stock">الموجود عندك دلوقتي (اختياري)</span>', '');
  if(it){
    const cs = itemCounts(it).slice(-4).reverse(), bs = itemBuys(it).sort((a, b) => evKey(a) < evKey(b) ? 1 : -1).slice(0, 4);
    body += `<div class="note">📊 المعدل المستخدم: <b>${qtyTxt(it, r.v * 30)}</b>/شهر ${r.src === 'learned' ? '(محسوب من الجرد)' : '(تقديري)'}
      ${learned == null ? '<br>اعمل جردين بينهم أسبوع على الأقل عشان نحسب استهلاكك الحقيقي.' : ''}
      ${cs.length ? '<br><b>آخر جرد:</b> ' + cs.map(c => `${dayLabel(c.date)}: ${esc(qtyPlain(it, c.qty))}`).join(' · ') : ''}
      ${bs.length ? '<br><b>آخر شراء:</b> ' + bs.map(b => `${dayLabel(b.date)}: ${esc(qtyPlain(it, b.qty))} بـ ${fmt(b.amount)}ج`).join(' · ') : ''}</div>
      <div class="btns" style="margin-top:10px"><button type="button" class="btn good" data-act="buyItem" data-id="${it.id}">سجّل شراء</button><button type="button" class="btn" data-act="countItem" data-id="${it.id}">جرد الصنف ده</button></div>`;
  }
  body += Fd.foot(it ? 'حفظ' : 'إضافة', it ? {act:'delItem', id:it.id} : null);
  openSheet(it ? it.name : 'صنف جديد', body, v => {
    if(!need(v.name.trim(), 'اكتب اسم الصنف')) return false;
    const pu = v.pu && v.pu !== '__new' ? v.pu.trim() : '';
    const pf = pu ? (num(v.pf) > 0 ? num(v.pf) : 1) : 0, f = pu ? pf : 1;
    const unitTxt = pu || (BASES[v.base] || BASES.PCS).en;
    if(num(v.price) > 5000 && !confirm(`سعر الـ${unitTxt} ${fmt(num(v.price))} ج؟ ده كبير — متأكد؟`)) return false;
    if(num(v.monthly) > 200 && !confirm(`بتستهلك ${fmtQ(num(v.monthly))} ${unitTxt} في الشهر؟ متأكد؟`)) return false;
    if(pu && v.base !== 'PCS' && pf > 100 && !confirm(`الـ${pu} فيه ${fmtQ(pf)} ${(BASES[v.base] || BASES.PCS).en}؟ متأكد؟ (مثلاً 450 جرام تتكتب 0.45)`)) return false;
    const o = it || {id:uid(), createdAt:todayS()};
    Object.assign(o, {name:v.name.trim(), group:v.group.trim() || 'تاني', base:v.base || 'PCS', pu:pu || undefined, pf:pu ? pf : undefined,
      monthly:num(v.monthly) * f, price:Math.round(num(v.price) / f * 1000) / 1000});
    if(!it){
      S.items.push(o);
      if(String(v.stock || '').trim() !== '') S.counts.push({id:uid(), ts:Date.now(), itemId:o.id, date:todayS(), qty:num(v.stock) * f});
    }
    save(); toast('اتحفظ');
  });
  itemLabels();
}
/* بيحدّث عناوين خانات الصنف حسب المقياس والعبوة المختارين */
function itemLabels(){
  const q = n => document.querySelector(`#sheetBody [name="${n}"]`), L = k => document.querySelector(`#sheetBody [data-l="${k}"]`);
  if(!q('base')) return;
  const base = BASES[q('base').value] || BASES.PCS, pu = q('pu').value && q('pu').value !== '__new' ? q('pu').value : '';
  const unit = pu || base.en, pf = num(q('pf').value) || 1;
  L('pfWrap').style.display = pu ? '' : 'none';
  L('pf').textContent = pu ? `الـ${pu} فيه كام ${base.en}` : '';
  L('monthly').textContent = `بتستهلك كام ${unit} في الشهر`;
  L('price').textContent = `سعر الـ${unit} (جنيه)`;
  if(L('stock')) L('stock').textContent = `الموجود عندك دلوقتي بالـ${unit} (اختياري)`;
  L('conv').innerHTML = pu ? `يعني: 1 ${esc(pu)} = <b class="num">${fmtQ(pf)}</b> ${base.en}` : `الكميات هتتكتب بالـ${base.en} (${base.ar})`;
}
function buyItem(id){
  const it = byId(S.items, id); if(!it) return;
  const x = shopList().find(s_ => s_.it.id === id), base = BASES[baseOf(it)];
  const opts = hasPack(it)
    ? [[it.pu, esc(it.pu) + ` (= ${fmtQ(it.pf)} ${base.en})`], [baseOf(it), base.en + ' — ' + base.ar]]
    : [[baseOf(it), base.en + ' — ' + base.ar], ['__setpack', '➕ بعبوة (كيس، زجاجة، علبة…)']];
  const f0 = packF(it), q0 = x && x.qty > 0 ? +(x.qty / f0).toFixed(2) : 1;
  const packs = Array.from(new Set([...PACKS, ...(S.settings.packs || [])]));
  const body = `<label class="fld"><span>اشتريت بالـ</span><select name="bu" data-bl>${opts.map(o => `<option value="${esc(o[0])}">${o[1]}</option>`).join('')}</select></label>
    <div class="fld2" data-bl-pack style="display:none"><label class="fld"><span>العبوة</span><select name="npu" data-bl>${packs.map(p_ => `<option>${esc(p_)}</option>`).join('')}</select></label>
      ${Fd.num('npf', `<span data-bl-l="npf">فيها كام ${base.en}</span>`, '', 'data-bl')}</div>
    <div class="fld2">${Fd.num('qty', '<span data-bl-l="qty">الكمية</span>', q0, 'autofocus data-bl')}${Fd.num('amount', 'دفعت كام إجمالي', it.price ? Math.round(q0 * f0 * it.price) : '')}</div>
    <div class="muted" data-bl-l="conv" style="margin:-4px 0 10px"></div>
    ${Fd.date('date', 'التاريخ', todayS())}<div class="muted">هيتسجّل كمصروف "استوك البيت"، والكمية هتتضاف للموجود، والسعر هيتحدّث.</div>${Fd.foot('سجّل الشراء')}`;
  openSheet('اشتريت ' + it.name, body, v => {
    const q = num(v.qty), a = num(v.amount);
    if(!need(q > 0, 'اكتب الكمية')) return false;
    let f = 1;
    if(v.bu === '__setpack'){
      if(!need(num(v.npf) > 0, `اكتب العبوة فيها كام ${base.en}`)) return false;
      it.pu = v.npu; it.pf = num(v.npf); f = it.pf;   // تتحفظ للصنف للمرة الجاية
    }else if(hasPack(it) && v.bu === it.pu) f = it.pf;
    recordBuy(it, q * f, a, v.date || todayS());
    save(); toast('اتسجّل الشراء');
  });
  $('#sheetBody').dataset.item = it.id;
  buyLabels(it);
}
/* بيحدّث عناوين شاشة الشراء حسب الوحدة المختارة */
function buyLabels(it){
  const q = n => document.querySelector(`#sheetBody [name="${n}"]`), L = k => document.querySelector(`#sheetBody [data-bl-l="${k}"]`);
  if(!q('bu')) return;
  it = it || byId(S.items, document.querySelector('#sheetBody').dataset.item);
  const base = BASES[baseOf(it)], bu = q('bu').value, setp = bu === '__setpack';
  document.querySelector('#sheetBody [data-bl-pack]').style.display = setp ? '' : 'none';
  const unit = setp ? q('npu').value : (BASES[bu] ? base.en : bu);
  const f = setp ? num(q('npf').value) : (BASES[bu] ? 1 : it.pf);
  L('qty').textContent = `الكمية (عدد ${unit})`;
  if(setp) L('npf').textContent = `الـ${unit} فيه كام ${base.en}`;
  const qty = num(q('qty').value);
  L('conv').innerHTML = f > 0 && !BASES[bu] ? `${fmtQ(qty)} ${esc(unit)} = <b class="num">${fmtQ(qty * f)}</b> ${base.en}` : '';
}

function multiAdd(preset){
  preset = preset || {};
  ML = [{cat:'market'}, {cat:'market'}];
  const body = `<div class="seg"><button type="button" data-act="qaType" data-v="exp">مصروف</button><button type="button" class="on">🧾 كذا حاجة</button><button type="button" data-act="qaType" data-v="inc">دخل إضافي</button></div>

    <div class="note" id="mlTotal"></div>

    ${Fd.date('date', 'التاريخ', preset.date || todayS())}
    ${Fd.foot('سجّل الكل')}`;
  openSheet('🧾 كذا حاجة مع بعض', body, v => {
    mlRead();

    if(!need(lines.length, 'اكتب مبلغ حاجة واحدة على الأقل')) return false;
    const badItem = lines.find(o => o.cat === 'house' && o.item && !(num(o.qty) > 0));
    if(badItem){ toast(`اكتب الكمية لـ ${byId(S.items, badItem.item).name}`, true); return false; }
    const total = sum(lines, o => num(o.amount)), date = v.date || todayS(), place = v.note.trim();
    if(!sane(total, date, 'exp', null, null)) return false;
    const ts = Date.now(), grp = uid();
    lines.forEach((o, i) => {
      const a = num(o.amount), it = o.cat === 'house' && o.item ? byId(S.items, o.item) : null;
      if(it){ recordBuy(it, num(o.qty) * packF(it), a, date); Object.assign(S.tx[S.tx.length - 1], {ts:ts + i, grp, note:it.name + (place ? ' — ' + place : '')}); }
      else S.tx.push({id:uid(), ts:ts + i, grp, type:'exp', cat:o.cat || 'other', amount:a, note:[o.label.trim(), place].filter(Boolean).join(' — '), date});
    });

  });
  mlRender();
  setTimeout(() => { const f = document.querySelector('#mlines [data-f="amount"]'); if(f) f.focus(); }, 80);
}

function recordBuy(it, q, a, date){
  if(a > 0){
    S.tx.push({id:uid(), ts:Date.now(), type:'exp', cat:'house', itemId:it.id, qty:q, amount:a, note:it.name, date});
    it.price = Math.round(a / q * 100) / 100;
  }else{
    // اتشرى بس من غير مبلغ (هدية مثلًا) — نضيفه للجرد كحركة شراء بصفر
    S.tx.push({id:uid(), ts:Date.now(), type:'exp', cat:'house', itemId:it.id, qty:q, amount:0, note:it.name, date});
  }
}

  if(!d) body += Fd.num('reserved', 'شايل له كام لحد دلوقتي (اختياري)', '');

    const res = Math.max(0, dueReserved(d));

  }
  body += Fd.foot(d ? 'حفظ' : 'إضافة', d ? {act:'delDue', id:d.id} : null);

    if(!need(num(v.amount) > 0, 'اكتب هتصرف كام تقريبًا')) return false;
    let date = v.date;
    while(date < todayS()) date = addMonthsDate(date, 12);   // أقرب ميعاد جاي

    save(); toast(`اتحفظ — ${dayLabel(o.date)}، اشيل ${fmt(duePerMonth(o, periodOf(todayS())))} في الشهر`);
  });
}
function reserveDue(id){
  const d = byId(S.dues, id), l = summary(periodOf(todayS())).dueLines.find(x => x.d.id === id);
  const res = Math.max(0, dueReserved(d)), sug = Math.min(d.amount - res, l ? Math.max(l.per - l.resThis, 0) || l.per : d.amount - res);
  openSheet('شلت لـ ' + dueName(d), `${Fd.num('amount', 'حطيت على جنب كام', Math.round(sug), 'autofocus', `جاهز <b class="num">${fmt(res)}</b> من <b class="num">${fmt(d.amount)}</b>`)}${Fd.date('date', 'التاريخ', todayS())}${Fd.foot('سجّل')}`, v => {
    const a = num(v.amount); if(!need(a > 0, 'اكتب المبلغ')) return false;
    S.tx.push({id:uid(), ts:Date.now(), type:'reserve', dueId:id, dueDate:d.date, amount:a, note:'', date:v.date || todayS()});
    save(); toast(dueReserved(d) >= d.amount - 1 ? '✅ فلوس الميعاد ده بقت جاهزة' : 'اتسجّل ✔');

function payDue(id){
  const d = byId(S.dues, id), res = Math.max(0, dueReserved(d));
  const ev = d.kind === 'event';
  openSheet((ev ? 'صرفت على: ' : 'دفعت: ') + dueName(d), `${Fd.num('amount', ev ? 'صرفت كام' : 'المبلغ اللي اتدفع', d.amount, 'autofocus', res > 0 ? `منهم <b class="num">${fmt(res)}</b> كانوا محجوزين${ev ? ' — ولو صرفت أقل، الباقي يرجع لرصيدك' : ''}` : '')}${Fd.date('date', 'التاريخ', todayS())}${Fd.foot('سجّل')}`, v => {
    const a = num(v.amount); if(!need(a > 0, 'اكتب المبلغ')) return false;
    const date = v.date || todayS(), ts = Date.now(), full = ev || a >= d.amount - 1;
    if(ev) S.tx.push({id:uid(), ts, type:'exp', cat:d.cat || 'gifts', dueId:d.id, amount:a, note:d.name, date});
    else S.tx.push({id:uid(), ts, type:d.debtId ? 'debt' : 'bill', debtId:d.debtId, dueId:d.id, amount:a, note:dueName(d), date});
    const rel = full ? res : Math.min(res, a);
    if(rel > 0) S.tx.push({id:uid(), ts:ts + 1, type:'reserve', dueId:d.id, dueDate:d.date, amount:-rel, note:'', date});
    if(full){
      if(d.repeat > 0){ d.date = addMonthsDate(d.date, d.repeat); d.amount = d.baseAmount || d.amount; }
      else d.paidOn = date;
    }else d.amount = Math.round((d.amount - a) * 100) / 100;
    save(); toast(full ? (d.repeat > 0 ? 'اتسجّل ✔ — الجاي ' + dayLabel(d.date) + ' ' + pd(d.date).getFullYear() : '🎉 اتسدد') : `اتسجّل — فاضل ${fmt(d.amount)}`);
  });
}

    else el.textContent = '';

  document.querySelectorAll('#sheetBody input').forEach(x => x.addEventListener('input', upd)); upd();

function gameyaCard(g){
  const saved = goalSaved(g), target = g.target || 0, k = Math.min(g.months, Math.floor(saved / g.monthly + 0.01));
  const r = periodRange(periodOf(todayS())), thisM = sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && t.date >= r.start && t.date <= r.end), t => t.amount);
  const started = curKey() >= g.start, full = saved >= target - 0.5;
  const pct = target ? Math.min(100, saved / target * 100) : 0;
  let status;
  if(g.doneOn) status = `🎉 قبضت الجمعية ${dayLabel(g.doneOn)}.`;
  else if(full) status = `✅ كملت الأقساط كلها — فلوسك جاهزة <b class="num">${fmt(saved)}</b> ج.`;
  else if(!started) status = `⏳ هتبدأ ${monthName(g.start)}.`;
  else if(thisM >= g.monthly - 0.5) status = `✅ قسط الشهر ده اتدفع.`;
  else status = `⏳ قسط الشهر ده لسه (<b class="num">${fmt(g.monthly - Math.max(0, thisM))}</b> ج).`;
  return `<div class="card"><div class="goal-hero"><div class="ring" style="--p:${pct}"><b class="num">${k}/${g.months}</b></div>
      <div style="flex:1"><h3 style="margin:0">🪙 ${esc(g.name)}</h3>
        <div class="muted">قسط <b class="num">${fmt(g.monthly)}</b> × <b class="num">${g.months}</b> شهر · من ${monthName(g.start)} لـ ${monthName(g.deadline)}</div></div>

    <div class="kv"><span>دفعت لحد دلوقتي</span><b>${money(saved, 'pos')}</b></div>
    <div class="note">${status}${g.note ? '<br>📝 ' + esc(g.note) : ''}</div>
    ${g.doneOn ? '' : `<div class="btns" style="margin-top:10px">${full ? `<button class="btn primary" style="flex:1" data-act="gameyaPayout" data-id="${g.id}">قبضت الجمعية</button>` : `<button class="btn primary" style="flex:1" data-act="goalMove" data-id="${g.id}" data-s="1">دفعت القسط</button>`}</div>`}</div>`;

/* ---- توزيع دخل إضافي (مكافأة، شغل زيادة...) ----
   الاقتراح: الأول نكمّل أي ميعاد سداد قريب ناقصه فلوس، وبعدين جزء للديون وجزء للهدف،
   والباقي يفضل للصرف. كل الأرقام تتعدّل قبل التسجيل. */
function allocateExtra(amount, date){
  let left = amount;
  const rows = [];
  activeDues().filter(d => diffDays(todayS(), d.date) <= 90).sort((a, b) => a.date < b.date ? -1 : 1).forEach(d => {
    const short = Math.max(0, d.amount - Math.max(0, dueReserved(d)));
    if(short < 1 || left < 1) return;
    const a = Math.min(short, left); left -= a;
    rows.push({k:'due', id:d.id, label:`📅 ${esc(dueName(d))} <span class="muted">(${dayLabel(d.date)} — ناقصه ${fmt(short)})</span>`, v:a});
  });
  const debt = S.debts.filter(d => debtRemaining(d) > 0.5).sort((a, b) => debtRemaining(a) - debtRemaining(b))[0];
  const goal = S.goals.find(g => g.kind !== 'gameya' && !g.doneOn && goalSaved(g) < (g.target || 0));
  const base = left;
  if(debt){ const a = Math.min(debtRemaining(debt), Math.round(base * (goal ? 0.3 : 0.6))); left -= a; rows.push({k:'debt', id:debt.id, label:`💳 سداد زيادة من دين: ${esc(debt.name)} <span class="muted">(باقي ${fmt(debtRemaining(debt))})</span>`, v:a}); }
  if(goal){ const a = Math.round(base * (debt ? 0.5 : 0.7)); left -= a; rows.push({k:'goal', id:goal.id, label:`${esc(goal.icon || "🎯")} تحويش للهدف: ${esc(goal.name)}`, v:a}); }
  allocSheet({title:'توزّع الدخل الإضافي إزاي؟', amount, date, rows, ok:'وزّع كده', skip:'سيبه كله للصرف', leftLbl:'الباقي للصرف',
    intro:`جالك <b class="num">${fmt(amount)}</b> ج زيادة 🎉 الفلوس الزيادة لو اتسابت في الجيب بتتصرف من غير ما تحس. ده اقتراح للتوزيع، وتقدر تعدّل أي رقم:`});
}
/* تقسيم المرتب أول ما ينزل (ادفع لنفسك الأول): الجمعيات والأهداف + المواعيد، والباقي للالتزامات والمصروف */
function allocateSalary(amount, date){
  const r = periodRange(periodOf(date)), rows = [];
  S.goals.filter(g => !g.doneOn).forEach(g => {
    const need = goalPlanMonthly(g) - sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && t.date >= r.start && t.date <= r.end), t => t.amount);
    if(need > 1) rows.push({k:'goal', id:g.id, label:`${esc(g.icon || '🎯')} ${g.kind === 'gameya' ? 'قسط ' : 'تحويش '}${esc(g.name)}`, v:Math.round(need)});
  });
  const o = summary(periodOf(date));
  o.dueLines.forEach(l => { const need = l.per - l.resThis; if(need > 1) rows.push({k:'due', id:l.d.id, label:`${l.d.kind === 'event' ? '🎂' : '📅'} شيل لـ ${esc(dueName(l.d))} <span class="muted">(${dayLabel(l.d.date)})</span>`, v:Math.round(need)}); });
  const fixed = Math.max(0, o.billPlanned - o.billPaid) + Math.max(0, o.debtPlanned - o.debtPaid) + Math.max(0, o.houseBudget - o.houseSpent);
  allocSheet({title:'🧮 قسّم المرتب', amount, date, rows, ok:'قسّم كده', skip:'بعدين', leftLbl:'يفضل للالتزامات والمصروف',
    intro:`نزل <b class="num">${fmt(amount)}</b> ج. أحسن وقت تحوّش فيه هو <b>أول ما المرتب ينزل</b> — قبل ما يتصرف. ده التقسيم حسب خطتك (تقدر تعدّل):`,
    extra:used => { const rest = amount - used; return `<br><span class="muted">منهم التزامات وأقساط واستوك لسه: <b class="num">${fmt(fixed)}</b> · ويفضل للمصروف اليومي: <b class="num ${rest - fixed < 0 ? 'neg' : ''}">${fmt(rest - fixed)}</b> (حوالي <span class="num">${fmt((rest - fixed) / Math.max(1, diffDays(date, r.end) + 1))}</span> في اليوم)</span>`; }});
}
function allocSheet(cfg){
  const {amount, date, rows} = cfg;
  if(!rows.length) return;
  const body = `<div class="muted" style="line-height:1.8; margin-bottom:10px">${cfg.intro}</div>
    ${rows.map((r, i) => `<label class="fld"><span>${r.label}</span><input name="a${i}" inputmode="decimal" value="${Math.round(r.v)}" data-alloc></label>`).join('')}
    <div class="note" id="allocLeft"></div>
    <div class="sheet-foot"><button type="submit" class="btn primary">${cfg.ok}</button><button type="button" class="btn" data-act="closeSheet">${cfg.skip}</button></div>`;
  openSheet(cfg.title, body, v => {
    let n = 0; const ts = Date.now();
    rows.forEach((r, i) => {
      const a = num(v['a' + i]); if(!(a > 0)) return;
      if(r.k === 'due'){ const d = byId(S.dues, r.id); S.tx.push({id:uid(), ts:ts + i, type:'reserve', dueId:d.id, dueDate:d.date, amount:a, note:'', date}); }
      if(r.k === 'debt') S.tx.push({id:uid(), ts:ts + i, type:'debt', debtId:r.id, amount:Math.min(a, debtRemaining(byId(S.debts, r.id))), note:'سداد زيادة', date});
      if(r.k === 'goal') S.tx.push({id:uid(), ts:ts + i, type:'save', goalId:r.id, amount:a, note:'', date});
      n++;
    });
    if(!n) return;
    save(); toast('اتسجّل ✔');
  });
  const upd = () => {
    const used = sum([...document.querySelectorAll('#sheetBody [data-alloc]')], x => num(x.value));
    const el = $('#allocLeft');
    if(el) el.innerHTML = used > amount ? `<span class="neg">الأرقام أكبر من المبلغ بـ <b class="num">${fmt(used - amount)}</b></span>` : `${cfg.leftLbl}: <b class="num">${fmt(amount - used)}</b> ج${cfg.extra ? cfg.extra(used) : ''}`;
  };
  document.querySelectorAll('#sheetBody [data-alloc]').forEach(x => x.addEventListener('input', upd));
  upd();
}

/* ---- جرد الفلوس ---- */
function cashCount(){
  const b = cashBalance();
  const hint = b.known
    ? `حسب اللي متسجل المفروض معاك <b class="num">${fmt(b.value)}</b> ج.`
    : 'اجمع الكاش اللي معاك + اللي في البنك أو المحفظة (من غير فلوس التحويش لو حاططها لوحدها).';
  const resNote = totalReserved() > 0 ? `<br>⚠️ من غير الـ <b class="num">${fmt(totalReserved())}</b> اللي شايلهم لمواعيد السداد.` : '';
  openSheet('جرد الفلوس', Fd.num('amount', 'معاك كام فلوس دلوقتي؟', '', 'autofocus', hint + resNote) + Fd.text('note', 'ملاحظة (اختياري)', '') + Fd.foot('حفظ الرصيد'), v => {
    if(!need(String(v.amount).trim() !== '', 'اكتب المبلغ')) return false;
    const amount = num(v.amount), ts = Date.now();
    if(b.known){
      const diff = b.value - amount;
      if(diff > 1 && confirm(`فيه ${fmt(diff)} ج أقل من المتسجل — غالبًا مصاريف ما اتسجلتش.\nأسجّلهم كمصروف "متنوع" عشان الحسابات تتظبط؟`)){
        S.tx.push({id:uid(), ts, type:'exp', cat:'other', amount:Math.round(diff), note:'فرق جرد الفلوس — مصاريف ما اتسجلتش', date:todayS()});
      }else if(diff < -1){
        toast(`معاك ${fmt(-diff)} ج زيادة عن المتسجل — لو دخل فلوس سجّلها كدخل إضافي`);
      }
    }
    S.cashCounts = S.cashCounts || [];
    S.cashCounts.push({id:uid(), ts:ts + 1, date:todayS(), amount, note:v.note.trim()});
    save(); if(!b.known || Math.abs(b.value - amount) <= 1) toast('اتسجّل الرصيد ✔');
  });
}

/* التاريخ الافتراضي للتسجيل: النهاردة لو بنبص على الشهر الحالي، وإلا أول يوم في الشهر المعروض */
function defaultDate(){
  const r = periodRange(VIEW), t = todayS();
  return (t >= r.start && t <= r.end) ? t : r.start;
}

/* ===================== الأحداث ===================== */
const ACT = {
  tab:(d) => { TAB = d.tab; render(); window.scrollTo(0, 0); },
  per:(d) => { VIEW = addMonths(VIEW, +d.d); render(); },
  perNow:() => { VIEW = periodOf(todayS()); render(); },
  sub:(d) => { SUB[d.k] = d.v; render(); },
  logf:(d) => { LOGF = d.f; render(); },
  closeSheet,
  quickAdd:() => quickAdd({date:defaultDate()}),

function downloadIcs(file, title, desc, time, rrule){

  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//beity//AR', 'BEGIN:VEVENT', 'UID:' + uid() + '@beity',

    `DTSTART:${d}T${pad(hh)}${pad(mm)}00`, `DTEND:${d}T${pad(hh)}${pad((+mm + 10) % 60)}00`, 'RRULE:FREQ=' + rrule,
    'SUMMARY:' + title, 'DESCRIPTION:' + desc + ' — ' + location.href.split('#')[0], 'URL:' + location.href.split('#')[0],
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:' + title, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics); a.download = file;
  document.body.appendChild(a); a.click(); a.remove();

/* ===================== المزامنة مع جوجل شيت (اختياري) =====================
   الجهاز هو الأساس. لما المزامنة شغالة:
   - أول ما البرنامج يفتح (أو ترجعله)، بيسحب النسخة اللي على الشيت لو أحدث.
   - بعد أي تعديل بثانية ونص، بيرفع النسخة للشيت.
   - لو فيه تعديلات على الجهاز ما اترفعتش ونسخة الشيت أحدث، بيسألك. */
let syncTimer = null, syncState = '', syncBusy = false;
function syncedAt(){ return Number(localStorage.getItem(SYNCED_KEY) || 0); }
function setSynced(v){ localStorage.setItem(SYNCED_KEY, String(v)); }
function setSync(state, msg){
  syncState = msg || '';
  const el = $('#syncDot');
  if(!S.settings.syncUrl){ el.textContent = ''; return; }
  el.textContent = state === 'busy' ? '⏳ بيتزامن' : state === 'ok' ? '☁️ متزامن' : '⚠️ ' + (msg || 'مش متزامن');
  const info = $('#syncInfo'); if(info) info.textContent = syncInfoText();
}
function syncInfoText(){
  if(!S.settings.syncUrl) return 'المزامنة مقفولة — البيانات على الجهاز ده بس.';
  const t = syncedAt();
  return (syncState ? syncState + ' · ' : '') + (t ? 'آخر مزامنة: ' + new Date(t).toLocaleString('ar-EG') : 'لسه ما اتزامنش');
}
function scheduleSync(){
  if(!S.settings.syncUrl) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushRemote(false), 1500);
}
async function api(method, payload){
  const s = S.settings;
  let res;
  if(method === 'GET') res = await fetch(s.syncUrl + (s.syncUrl.includes('?') ? '&' : '?') + 'secret=' + encodeURIComponent(s.syncSecret || '') + '&t=' + Date.now(), {cache:'no-store'});
  else res = await fetch(s.syncUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({secret:s.syncSecret || ''}, payload))});
  const txt = await res.text();
  let j = null; try{ j = JSON.parse(txt); }catch(e){}
  if(!j) throw new Error('رد غير مفهوم — راجع إن النشر Anyone');
  if(!j.ok){ const err = new Error(j.error || 'فشل'); err.code = j.code; throw err; }
  return j;
}
async function pushRemote(force){
  if(!S.settings.syncUrl || syncBusy) return;
  syncBusy = true; setSync('busy');
  try{
    await api('POST', {action:'set', updatedAt:S.updatedAt, value:JSON.stringify(S), force:!!force});
    setSynced(S.updatedAt); setSync('ok', 'اترفعت');
  }catch(e){
    syncBusy = false;
    if(e.code === 'stale'){ setSync('err', 'فيه نسخة أحدث على الشيت'); return pullRemote(true); }
    if(e.code === 'shrink'){
      if(confirm('النسخة اللي هتترفع أصغر بكتير من اللي على الشيت (ممكن تكون اتمسحت حاجات). ترفعها برضه؟')) return pushRemote(true);
      setSync('err', 'الرفع اتلغى'); return;
    }
    setSync('err', e.message);
  }
  syncBusy = false;
}
async function pullRemote(manual){
  if(!S.settings.syncUrl || syncBusy) return;
  syncBusy = true; setSync('busy');
  try{
    const j = await api('GET');
    syncBusy = false;
    const rUp = Number(j.updatedAt) || 0;
    if(j.value && rUp > S.updatedAt){
      const dirty = S.updatedAt > syncedAt();
      if(dirty && !confirm('فيه تعديلات على الجهاز ده ما اترفعتش، وفيه نسخة أحدث على جوجل شيت.\n\nموافق = خد نسخة الشيت (تعديلات الجهاز هتضيع)\nإلغاء = ارفع نسخة الجهاز فوق الشيت')){
        return pushRemote(true);
      }
      const keep = {syncUrl:S.settings.syncUrl, syncSecret:S.settings.syncSecret};
      S = migrate(JSON.parse(j.value)); Object.assign(S.settings, keep);
      S.updatedAt = rUp; persist(); setSynced(rUp); setSync('ok', 'اتسحبت من الشيت');
      render(); if(manual) toast('اتحدّثت من جوجل شيت');
    }else if(S.updatedAt > rUp){
      return pushRemote(false);
    }else{
      setSynced(S.updatedAt); setSync('ok', 'متزامن'); if(manual) toast('كله متزامن ✔');
    }
  }catch(e){
    syncBusy = false; setSync('err', e.message); if(manual) toast('المزامنة فشلت: ' + e.message, true);
  }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pullRemote(false); });

/* ===================== تشغيل ===================== */
load();
VIEW = periodOf(todayS());
render();
// اطلب من المتصفح ما يمسحش بيانات التطبيق من نفسه
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().then(ok => { PERSISTED = ok; const el = $('#persistInfo'); if(el) el.textContent = ok ? 'التخزين محمي ✅' : 'التخزين مش محمي — اعمل نسخ'; }).catch(() => {});
}
setSync('');
pullRemote(false);
</script>
