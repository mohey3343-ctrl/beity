/* ===================== التقرير الشهري ونقاط التحسين ===================== */
/* البنود اللي في إيدك تتحكم فيها (مش التزام ولا أساسي) */
const FLEX_CATS = ['food','fun','clothes','gifts','other','transport','phone'];
function expByCat(T){ const by = {}; T.filter(t => t.type === 'exp').forEach(t => by[t.cat] = (by[t.cat] || 0) + t.amount); return by; }
function elapsedDays(o){ return o.isCurrent ? diffDays(o.r.start, todayS()) + 1 : o.r.days; }
/* متوسط كل تصنيف في آخر n شهور فيها تسجيلات */
function baseline(p, n){
  const per = [];
  for(let i = 1; i <= n; i++){
    const r = periodRange(addMonths(p, -i)), T = txBetween(r.start, r.end);
    if(T.some(t => t.type === 'exp')) per.push(expByCat(T));
  }
  const avg = {};
  per.forEach(b => { for(const k in b) avg[k] = (avg[k] || 0) + b[k] / per.length; });
  return {avg, n:per.length};
}
const pctTxt = (a, b) => b > 0 ? Math.round((a / b - 1) * 100) : null;

function insights(p){
  const o = summary(p), el = elapsedDays(o), scale = o.r.days / el;
  const by = expByCat(o.T), base = baseline(p, 3), out = [];
  const proj = v => o.isCurrent ? v * scale : v;
  const canProject = !o.isCurrent || el >= 7;
  // ١) ماشي إزاي مع ميزانية المصروف اليومي
  if(o.varBudget > 0){
    if(o.isCurrent && el >= 3){
      const pv = proj(o.varSpent);
      if(pv > o.varBudget * 1.05) out.push(['bad', '🚨', `بالمعدل ده هتصرف حوالي <b class="num">${fmt(pv)}</b> مصروف يومي، والميزانية <b class="num">${fmt(o.varBudget)}</b>. عشان تلحق نفسك، صرفك لازم ينزل لـ <b class="num">${fmt(Math.max(0, o.perDay))}</b> في اليوم.`]);
      else if(pv < o.varBudget * 0.9) out.push(['good', '👏', `ماشي كويس: بالمعدل ده هيفضل معاك حوالي <b class="num">${fmt(o.varBudget - pv)}</b> من ميزانية المصروف آخر الشهر — حطهم للعربية أو الديون.`]);
    }else if(!o.isCurrent){
      if(o.varSpent > o.varBudget) out.push(['bad', '📉', `صرفت <b class="num">${fmt(o.varSpent - o.varBudget)}</b> زيادة عن ميزانية المصروف اليومي الشهر ده.`]);
      else if(o.varSpent > 0) out.push(['good', '👏', `خلّصت الشهر وفاضل من ميزانية المصروف <b class="num">${fmt(o.varBudget - o.varSpent)}</b>.`]);
    }
  }
  // الخطة نفسها أكبر من الدخل
  if(o.income > 0 && o.varBudget < 0){
    const g = S.goals.filter(g => goalSaved(g) < (g.target || 0)).sort((a, b) => goalPlanMonthly(b) - goalPlanMonthly(a))[0];
    const gTxt = g && goalPlanMonthly(g) > 0 ? ` أكبر بند فيها تحويش ${esc(g.name)} (<span class="num">${fmt(goalPlanMonthly(g))}</span> في الشهر) — ممكن تأجّل الميعاد، أو تعدّل المبلغ المطلوب، أو تحدد مبلغ شهري تقدر عليه فعلًا.` : '';
    out.push(['bad', '⚖️', `الخطة الشهرية أكبر من دخلك بـ <b class="num">${fmt(-o.varBudget)}</b>، وكده مفيش فلوس متاحة للمصروف اليومي.${gTxt}`]);
  }
  // ٢) تصنيفات زادت أو قلّت عن متوسطك
  if(base.n && canProject){
    for(const c in by){
      const cur = proj(by[c]), b = base.avg[c] || 0, ct = catOf(c), name = ct.icon + ' ' + esc(ct.name);
      if(b > 0 && cur > b * 1.25 && cur - b >= 300) out.push(['warn', '📈', `${name} ${o.isCurrent ? 'ماشي على' : 'وصل'} <b class="num">${fmt(cur)}</b>، أعلى بـ <b class="num">${pctTxt(cur, b)}%</b> من متوسطك (<span class="num">${fmt(b)}</span>).`]);
      else if(b > 0 && cur < b * 0.8 && b - cur >= 300) out.push(['good', '✅', `${name} أقل من متوسطك بـ <b class="num">${fmt(b - cur)}</b> — برافو.`]);
    }
  }
  // حدود التصنيفات
  limitLines(o).forEach(l => {
    if(l.pct >= 1) out.push(['bad', '🎯', `${esc(l.c.name)} عدّى الحد بـ <b class="num">${fmt(l.spent - l.c.limit)}</b> (${fmt(l.spent)} من ${fmt(l.c.limit)}).`]);
    else if(o.isCurrent && l.pace > l.c.limit * 1.05 && el >= 5) out.push(['warn', '🎯', `${esc(l.c.name)} ماشي بمعدل هيوصل <b class="num">${fmt(l.pace)}</b> والحد <span class="num">${fmt(l.c.limit)}</span> — هدّي شوية.`]);
  });
  // غلا الأسعار: أصناف آخر سعر ليها زاد 10% أو أكتر (اشتريتها الشهر ده)
  const ups = S.items.map(it => ({it, pc:priceChange(it)})).filter(x => x.pc && x.pc.pct >= 10 && x.pc.date >= o.r.start && x.pc.date <= o.r.end);
  if(ups.length) out.push(['warn', '💲', `أسعار زادت: ${ups.slice(0, 4).map(x => `${esc(x.it.name)} <b class="num">+${Math.round(x.pc.pct)}%</b> (${fmtQ(x.pc.from)} ← ${fmtQ(x.pc.to)} لل${esc(entryUnit(x.it))})`).join('، ')}. قارن أماكن الشراء أو اشتري بالجملة.`]);
  // ٣) المصاريف الصغيرة المتكررة
  FLEX_CATS.forEach(c => {
    const ts = o.T.filter(t => t.type === 'exp' && t.cat === c);
    if(ts.length >= 6){
      const tot = sum(ts, t => t.amount);
      out.push(['info', '🔁', `${esc(catOf(c).name)}: <b class="num">${ts.length}</b> مرة بإجمالي <b class="num">${fmt(tot)}</b> (حوالي <span class="num">${fmt(tot / ts.length)}</span> للمرة). المصاريف الصغيرة المتكررة بتاكل الميزانية من غير ما تحس.`]);
    }
  });
  // ٤) استوك البيت
  if(o.houseMonthly > 0 && o.houseSpent > o.houseMonthly * 1.1) out.push(['warn', '🧺', `مشتريات استوك البيت <b class="num">${fmt(o.houseSpent)}</b>، أكتر من المتوقع (<span class="num">${fmt(o.houseMonthly)}</span>). راجع الكميات، أو اعمل جرد عشان معدلات الاستهلاك تتظبط.`]);
  // ٥) نسبة التحويش وسداد الديون من الدخل
  if(o.incReceived > 0){
    const rate = (o.saved + o.debtPaid) / o.incReceived;
    if(rate >= 0.2) out.push(['good', '💪', `حوّشت وسددت ديون بـ <b class="num">${Math.round(rate * 100)}%</b> من دخلك — معدل ممتاز.`]);
    else if(!o.isCurrent || el >= 20) out.push(['warn', '🐢', `اللي راح للتحويش وسداد الديون <b class="num">${Math.round(rate * 100)}%</b> بس من الدخل. حاول توصّله لـ 20%.`]);
  }
  // ٦) فلوس طلعت في الجرد ومتسجلتش
  const diffT = o.T.filter(t => t.type === 'exp' && /فرق جرد/.test(t.note || ''));
  if(diffT.length) out.push(['warn', '🕳️', `فيه <b class="num">${fmt(sum(diffT, t => t.amount))}</b> ج طلعوا في جرد الفلوس من غير ما يتسجلوا. سجّل أول بأول عشان تعرف الفلوس بتروح فين.`]);
  // ٧) أيام من غير تسجيل
  const daysWith = new Set(o.T.filter(t => t.type === 'exp').map(t => t.date));
  const gaps = el - daysWith.size;
  if(el >= 5 && daysWith.size > 0 && gaps >= Math.max(3, el * 0.3)) out.push(['info', '📝', `فيه <b class="num">${gaps}</b> يوم من <span class="num">${el}</span> ما سجلتش فيهم ولا مصروف. لو صرفت فيهم حاجة سجّلها، عشان التقرير يبقى دقيق.`]);
  // ٨) التزامات اتدفعت متأخر
  const late = o.billLines.filter(l => l.paidT.length && l.paidT[0].date > l.due).length;
  if(late) out.push(['info', '⏰', `<b class="num">${late}</b> التزام اتدفع بعد ميعاده الشهر ده.`]);
  // ٩) اقتراح توفير وأثره على الهدف
  const flex = Object.entries(by).filter(([c]) => FLEX_CATS.includes(c)).sort((a, b) => b[1] - a[1])[0];
  if(flex && canProject){
    const monthly = proj(flex[1]), cut = monthly * 0.25;
    if(cut >= 50){
      const g = S.goals.find(g => goalSaved(g) < (g.target || 0));
      const tail = g ? ` — يعني <b class="num">${fmt(cut * monthsUntil(g.deadline))}</b> زيادة لهدف ${esc(g.name)} لحد ${monthName(g.deadline)}.` : '.';
      out.push(['info', '💡', `أكبر بند في إيدك تتحكم فيه: ${catOf(flex[0]).icon} ${esc(catOf(flex[0]).name)} (<span class="num">${fmt(monthly)}</span> في الشهر). لو قللته الربع هتوفر <b class="num">${fmt(cut)}</b> شهريًا${tail}`]);
    }
  }
  const rank = {bad:0, warn:1, info:2, good:3};
  return out.sort((a, b) => rank[a[0]] - rank[b[0]]);
}
const insightHtml = a => `<div class="alert ${a[0]}"><span class="ic">${a[1]}</span><span class="tx">${a[2]}</span></div>`;

/* كل الخارج متقسم: التزامات + أقساط + تحويش + كل تصنيف مصروف */
function outflowRows(o){
  const rows = [];
  if(o.billPaid) rows.push({k:'bill', name:'📋 الالتزامات', v:o.billPaid});
  if(o.duePaid > 0) rows.push({k:'due', name:'📅 مواعيد سداد اتدفعت', v:o.duePaid});
  if(o.debtPaid) rows.push({k:'debt', name:'💳 أقساط الديون', v:o.debtPaid});
  if(o.saved > 0) rows.push({k:'save', name:'🏦 التحويش', v:o.saved});
  if(o.reserveNet > 0) rows.push({k:'reserve', name:'📥 اتشال لمواعيد السداد', v:o.reserveNet});
  if(o.lent > 0) rows.push({k:'lend', name:'🤝 سلف للناس', v:o.lent});
  const by = expByCat(o.T);
  for(const c in by) if(by[c] > 0) rows.push({k:c, name:catOf(c).icon + ' ' + catOf(c).name, v:by[c]});
  return rows.sort((a, b) => b.v - a.v);
}
/* أول n يوم بس من شهر — عشان نقارن الشهر الجاري بنفس الفترة من اللي قبله */
function firstDays(o, n){
  const end = addDays(o.r.start, n - 1), T = o.T.filter(t => t.date <= end);
  const s_ = type => sum(T.filter(t => t.type === type), t => t.amount);
  const dueP = sum(T.filter(t => t.type === 'bill' && t.dueId), t => t.amount);
  return {T, billPaid:s_('bill') - dueP, duePaid:dueP, debtPaid:s_('debt'), saved:s_('save'), reserveNet:s_('reserve'), lent:s_('lend'), outActual:s_('bill') + s_('debt') + s_('save') + s_('reserve') + s_('lend') + s_('exp')};
}
function rowVal(o, k){
  if(k === 'bill') return o.billPaid;
  if(k === 'due') return o.duePaid || 0;
  if(k === 'debt') return o.debtPaid;
  if(k === 'save') return Math.max(0, o.saved);
  if(k === 'reserve') return Math.max(0, o.reserveNet || 0);
  if(k === 'lend') return o.lent || 0;
  return expByCat(o.T)[k] || 0;
}

/* ===================== البيت بيتكلف كام في الشهر =====================
   الالتزامات (كهربا، غاز، نت…) + استهلاك الاستوك بأسعاره (مقسوم بالمجموعات: تموين، منظفات…)
   + التصنيفات اللي انت تختارها (خضار وسوبر ماركت، صيانة…) بمتوسط آخر 3 شهور.
   من غير مواصلات وزيارات وخروجات إلا لو اخترتها. */
const homeCats = () => S.settings.homeCats || ['market', 'fix'];
function homeCost(){
  const lines = [];
  const offB = new Set(S.settings.homeBillsOff || []);
  S.bills.filter(b => !b.off && !offB.has(b.id)).forEach(b => lines.push({k:'bill', icon:'📋', name:b.name, v:b.amount || 0}));
  const byG = {};
  S.items.filter(it => it.pause !== 'always').forEach(it => { const g = it.group || 'تاني'; byG[g] = (byG[g] || 0) + dailyRate(it).v * 30 * (it.price || 0); });
  Object.entries(byG).filter(([, v]) => v > 0.5).forEach(([g, v]) => lines.push({k:'stock', icon:'🧺', name:'استوك: ' + g, v}));
  // التصنيفات: متوسط آخر 3 شهور فيهم تسجيلات، ولو لسه مفيش — الشهر ده متوقع على الشهر كله
  const p = periodOf(todayS()), bl = baseline(p, 3), cur = summary(p), el = elapsedDays(cur);
  const curBy = expByCat(cur.T.filter(t => !t.dueId));
  homeCats().filter(id => id !== 'house').forEach(id => {
    const c = catOf(id), v = bl.n ? (bl.avg[id] || 0) : (curBy[id] || 0) / Math.max(1, el) * cur.r.days;
    if(v > 0.5) lines.push({k:'cat', icon:c.icon, name:c.name, v, est:!bl.n});
  });
  lines.sort((a, b) => b.v - a.v);
  return {lines, total:sum(lines, l => l.v), months:bl.n};
}
function homeCostCard(){
  const H = homeCost();
  if(!H.lines.length) return '';
  const top = H.lines[0].v;
  return `<div class="card"><div class="row"><h3 style="margin:0">🏠 البيت بيتكلف كام في الشهر</h3><button class="btn sm" data-act="homeCostPick">اختار إيه يتحسب</button></div>
    <div style="font-size:26px; margin:6px 0 2px">${money(H.total)}</div>
    <div class="muted" style="margin-bottom:10px">يعني حوالي <b class="num">${fmt(H.total / 30)}</b> ج في اليوم — من غير مواصلات وزيارات وخروجات (إلا لو اخترتهم)</div>
    ${H.lines.map(l => `<div class="cat-row"><div class="row"><span>${l.icon} ${esc(l.name)}${l.est ? ' <span class="tag">متوقع</span>' : ''}</span><span><b class="num">${fmt(l.v)}</b> <span class="muted num">${Math.round(l.v / H.total * 100)}%</span></span></div>
      <div class="bar"><i style="width:${l.v / top * 100}%"></i></div></div>`).join('')}
    <div class="muted" style="margin-top:8px; line-height:1.7">📋 الالتزامات بقيمتها الشهرية · 🧺 الاستوك = استهلاكك في الشهر × السعر · والتصنيفات ${H.months ? `بمتوسط آخر <span class="num">${H.months}</span> شهر` : 'متوقعة من صرف الشهر ده (لحد ما يبقى فيه شهور كاملة)'}.</div></div>`;

/* متوسط صرفك اليومي الحقيقي (آخر 30 يوم) — ولو لسه مفيش تسجيلات، المسموح في اليوم */
function avgDailySpend(){
  const td = todayS(), from = addDays(td, -30);
  const all = S.tx.filter(t => t.type === 'exp' && !t.dueId);
  if(!all.length){ const o = summary(periodOf(td)); return {v:Math.max(0, o.perDay || 0), src:'budget'}; }
  const first = all.map(t => t.date).sort()[0];
  const days = Math.min(30, Math.max(7, diffDays(first, td) + 1));
  return {v:sum(all.filter(t => t.date > from && t.date <= td), t => t.amount) / days, src:'actual', days};
}
/* الرصيد يوم بيوم لـ N يوم قدام:
   الفلوس كلها دلوقتي (الحر + المحجوز) + المرتبات − الالتزامات − الأقساط − مواعيد السداد
   − التحويش الشهري − متوسط الصرف اليومي. (فلوس الناس اختياري لأنها مش مضمونة) */
function forecast(N, withRecv){
  const td = todayS(), tom = addDays(td, 1), end = addDays(td, N), b = cashBalance();
  const start = (b.known ? b.value : 0) + totalReserved(), daily = avgDailySpend();
  const evs = [], paidIn = (pred, r) => S.tx.some(t => pred(t) && t.date >= r.start && t.date <= r.end);
  const at = d => d < tom ? tom : d;
  for(let p = periodOf(td); periodRange(p).start <= end; p = addMonths(p, 1)){
    const r = periodRange(p), isCur = samePeriod(p, periodOf(td));
    let payday = null;
    S.incomes.forEach(inc => {
      const d = at(dueDateIn(r, inc.day || 1));
      if(!payday || d < payday) payday = d;
      if(incClosed(inc, p)) return;   // نزل كله (حتى لو بدري) — ولو نزل جزء بنحسب الباقي بس
      if(d <= end) evs.push({date:d, n:'💰 ' + inc.name, a:Math.max(0, (inc.amount || 0) - incGot(inc, p))});
    });
    S.bills.filter(x => !x.off).forEach(x => {
      if(paidIn(t => t.type === 'bill' && t.billId === x.id, r)) return;
      const d = at(dueDateIn(r, x.dueDay || 1)); if(d <= end) evs.push({date:d, n:'📋 ' + x.name, a:-(x.amount || 0)});
    });
    S.debts.filter(x => x.monthly > 0).forEach(x => {
      if(paidIn(t => t.type === 'debt' && t.debtId === x.id, r)) return;
      const d = at(dueDateIn(r, x.dueDay || 1)); if(d <= end) evs.push({date:d, n:'💳 ' + x.name, a:-x.monthly, debt:x.id});
    });
    // ادفع لنفسك الأول: التحويش الشهري يوم نزول المرتب
    S.goals.forEach(g => {
      let need = goalMonthlyAt(g, p.y + '-' + pad(p.m + 1));
      if(isCur) need -= sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && t.date >= r.start && t.date <= r.end), t => t.amount);
      const d = at(payday || r.start);
      if(need > 1 && d <= end) evs.push({date:d, n:(g.icon || '🎯') + ' تحويش ' + g.name, a:-need, goal:g.id});
    });
  }
  activeDues().forEach(d => {
    let dt = d.date, first = true;
    while(dt <= end){
      evs.push({date:at(dt), n:(d.kind === 'event' ? '🎂 ' : '📅 ') + dueName(d), a:-(first ? d.amount : (d.baseAmount || d.amount))});
      first = false; if(!(d.repeat > 0)) break; dt = addMonthsDate(dt, d.repeat, d.dom);
    }
  });
  if(withRecv) activeRecvs().forEach(rv => recvSchedule(rv).forEach(it => { if(it.left > 0.5 && it.date >= tom && it.date <= end) evs.push({date:it.date, n:'🤝 ' + rv.name, a:it.left}); }));
  evs.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : y.a - x.a);
  const rem = {}; S.debts.forEach(x => rem[x.id] = debtRemaining(x));
  const remG = {}; S.goals.forEach(g => remG[g.id] = Math.max(0, (g.target || 0) - goalSaved(g)));
  const pts = [{date:td, bal:start, ev:[]}];
  let bal = start, k = 0;
  for(let i = 1; i <= N; i++){
    const date = addDays(td, i), ev = [];
    while(k < evs.length && evs[k].date === date){
      const e = evs[k++];
      if(e.debt){ e.a = -Math.min(-e.a, rem[e.debt]); rem[e.debt] += e.a; if(e.a > -0.5) continue; }
      if(e.goal){ e.a = -Math.min(-e.a, remG[e.goal]); remG[e.goal] += e.a; if(e.a > -0.5) continue; }
      bal += e.a; ev.push(e);
    }
    bal -= daily.v;
    pts.push({date, bal, ev});
  }
  const min = pts.reduce((m, x) => x.bal < m.bal ? x : m, pts[0]);
  const firstNeg = pts.find(x => x.bal < 0) || null;
  return {pts, min, firstNeg, daily, start, known:b.known};
}
function cashSuggestions(F){

    <div class="muted" style="line-height:1.8; margin-top:6px">حرّك صباعك على الرسم تشوف رصيد كل يوم. بنفترض إنك بتصرف حوالي <b class="num">${fmt(F.daily.v)}</b> ج في اليوم (${F.daily.src === 'actual' ? 'متوسط آخر ' + F.daily.days + ' يوم من تسجيلاتك' : 'المسموح في اليوم حسب الخطة'})، وإن المرتب والالتزامات والأقساط والمواعيد والتحويش هيمشوا في ميعادهم.</div>
    <label class="switch" style="margin-top:8px"><input type="checkbox" data-act="fcRecv" ${withRecv ? 'checked' : ''}> احسب الفلوس اللي هترجعلي من الناس</label></div>`;
  const sug = cashSuggestions(F);
  if(sug.length) h += `<div class="card"><h3>💡 تتجنب العجز إزاي</h3>${sug.map(t => `<div class="alert info"><span class="tx">${t}</span></div>`).join('')}</div>`;
  const evs = F.pts.slice(1).filter(x => x.ev.length);
  if(evs.length) h += `<div class="card"><h3>اللي جاي <span class="muted">والرصيد بعده</span></h3>` + evs.map(x => x.ev.map(e => `<div class="kv"><span>${dayLabel(x.date)} · ${esc(e.n)}</span><b class="num ${e.a > 0 ? 'pos' : ''}">${e.a > 0 ? '+' : '−'}${fmt(Math.abs(e.a))}</b></div>`).join('') + `<div class="kv" style="border-bottom:1px dashed var(--line); padding-bottom:6px; margin-bottom:4px"><span class="muted">الرصيد آخر اليوم</span><b class="num ${x.bal < 0 ? 'neg' : ''}">${fmt(x.bal)}</b></div>`).join('') + `</div>`;
  h += emergencyCard();
  h += `<div class="note">💡 قواعد بسيطة ضد العجز: خلّي أول ما المرتب ينزل تحوّش وتشيل للمواعيد (ادفع لنفسك الأول)، وحط الالتزامات الكبيرة بعد المرتب بيومين مش قبله، وخلّي في الحساب دايمًا مصروف أسبوع على الأقل.</div>`;
  return h;
};

/* ===================== الشيت (النوافذ) ===================== */
let SHEET_SUBMIT = null, lastSubmit = 0;
let NEXT_WALLET = null, PENDING_WALLET = null;
function walletSelect(sel, label){
  sel = byId(S.wallets, sel) ? sel : (byId(S.wallets, S.settings.lastWallet) ? S.settings.lastWallet : mainWallet());
  return `<label class="fld"><span>${label || 'المحفظة'}</span><select name="wallet">${S.wallets.map(w => `<option value="${w.id}" ${w.id === sel ? 'selected' : ''}>${w.icon} ${esc(w.name)}</option>`).join('')}</select></label>`;
}
function openSheet(title, body, onSubmit){
  // الشاشات اللي بتحرّك فلوس بتاخد اختيار المحفظة (لو عندك أكتر من واحدة)
  if(NEXT_WALLET && S.wallets.length > 1){
    const f = walletSelect(NEXT_WALLET.sel, NEXT_WALLET.label), i = body.lastIndexOf('<div class="sheet-foot">');
    body = i >= 0 ? body.slice(0, i) + f + body.slice(i) : body + f;
  }
  NEXT_WALLET = null;
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  $('#sheetWrap').classList.add('open');
  SHEET_SUBMIT = onSubmit || null;
  lastSubmit = 0;
  const f = $('#sheetBody [autofocus]');
  // نحط المؤشر في أول خانة — إلا لو المستخدم بدأ يكتب في خانة تانية فعلًا
  const untouched = () => !$('#sheetBody').contains(document.activeElement);
  if(f) setTimeout(() => { if(untouched()){ f.focus(); if(f.select) f.select(); } }, 60);
}
function closeSheet(){
  $('#sheetWrap').classList.remove('open'); SHEET_SUBMIT = null;
  if(PULL_AFTER_SHEET){ PULL_AFTER_SHEET = false; setTimeout(() => pullRemote(false), 300); }
}
$('#sheetForm').addEventListener('submit', e => {
  e.preventDefault();
  if(!SHEET_SUBMIT) return;
  if(Date.now() - lastSubmit < 800) return;   // دوسة مكررة بالغلط
  if(!validNums(e.target)) return;
  lastSubmit = Date.now();
  const fd = new FormData(e.target), v = {};
  for(const [k, val] of fd.entries()) v[k] = val;
  PENDING_WALLET = v.wallet ? {w:v.wallet, n0:S.tx.length} : null;
  if(v.wallet) S.settings.lastWallet = v.wallet;
  const ok = SHEET_SUBMIT(v, e.target);
  PENDING_WALLET = null;
  if(ok !== false) closeSheet();
});
$('#sheetWrap').addEventListener('click', e => { if(e.target.id === 'sheetWrap') closeSheet(); });

const Fd = {
  text:(n, l, v, a) => `<label class="fld"><span>${l}</span><input name="${n}" value="${esc(v)}" ${a || ''}></label>`,
  num:(n, l, v, a, hint) => `<label class="fld"><span>${l}</span><input name="${n}" inputmode="decimal" value="${v === '' || v == null || v === 0 ? '' : esc(v)}" ${a || ''}>${hint ? `<div class="hint">${hint}</div>` : ''}</label>`,
  date:(n, l, v) => `<label class="fld"><span>${l}</span><input type="date" name="${n}" value="${esc(v)}"></label>`,
  // الشهر والسنة في قايمتين (اختيار الشهر الجاهز في الآيفون ساعات ما بيثبتش)
  month:(n, l, v) => {
    const [y0, m0] = /^\d{4}-\d{2}$/.test(v || '') ? v.split('-').map(Number) : [periodOf(todayS()).y, periodOf(todayS()).m + 1];
    const cy = new Date().getFullYear(), ys = []; for(let y = Math.min(cy - 1, y0); y <= Math.max(cy + 8, y0); y++) ys.push(y);
    return `<div class="fld"><span>${l}</span><div class="mpick"><select data-mp="${n}" data-mpk="m">${MONTHS.map((t, i) => `<option value="${pad(i + 1)}" ${i + 1 === m0 ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select data-mp="${n}" data-mpk="y">${ys.map(y => `<option ${y === y0 ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
      <input type="hidden" name="${n}" value="${y0}-${pad(m0)}"></div>`;
  },
  day:(n, l, v) => `<label class="fld"><span>${l}</span><select name="${n}">${Array.from({length:31}, (_, i) => `<option ${(v || 1) === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></label>`,
  /* قايمة اختيار + "إضافة جديد" — الجديد بيتحفظ في الإعدادات عشان يفضل موجود */
  pick:(n, l, opts, v, store) => {
    const list = opts.slice(); if(v && !list.includes(v)) list.push(v);
    return `<label class="fld"><span>${l}</span><select name="${n}" data-pick="${store}" data-label="${l}" data-prev="${esc(v || list[0] || '')}">${list.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}<option value="__new">➕ إضافة جديد…</option></select></label>`;
  },
  foot:(save, del) => `<div class="sheet-foot"><button type="submit" class="btn primary">${save || 'حفظ'}</button>${del ? `<button type="button" class="btn danger" data-act="${del.act}" data-id="${del.id}">${del.label || 'حذف'}</button>` : ''}</div>`,
};
function need(v, msg){ if(!v){ toast(msg, true); return false; } return true; }

/* ---- تسجيل مصروف / دخل ---- */
function quickAdd(preset){
  preset = preset || {};
  const t = preset.tx || null;
  const type = t ? t.type : (preset.type || 'exp');
  const cat = t ? t.cat : (preset.cat || 'market');
  const cats = S.cats.map(c => `<label><input type="radio" name="cat" value="${c.id}" ${c.id === cat ? 'checked' : ''}><span><em>${c.icon}</em>${esc(c.name)}</span></label>`).join('');
  const isExp = type === 'exp', isInc = type === 'inc';
  let body = '';
  if(!t){
    body += `<div class="seg"><button type="button" class="${isExp ? 'on' : ''}" data-act="qaType" data-v="exp">مصروف</button><button type="button" data-act="qaMulti">🧾 كذا حاجة</button><button type="button" class="${isInc ? 'on' : ''}" data-act="qaType" data-v="inc">دخل إضافي</button></div>`;
  }
  body += `<label class="fld"><input class="amount" name="amount" inputmode="decimal" placeholder="0" value="${t ? Math.abs(t.amount) : ''}" autofocus></label>`;
  if(type === 'exp' && !(t && t.itemId)) body += `<div class="catpick">${cats}</div>`;
  // دخل جديد: لو ده المرتب (أو جزء منه، أو نزل بدري) يتسجّل عليه مش "دخل إضافي"
  if(!t && isInc && S.incomes.length) body += `<label class="fld"><span>ده إيه؟</span><select name="src"><option value="">دخل إضافي (مكافأة، شغل زيادة…)</option>${S.incomes.map(i => `<option value="${i.id}">${esc(i.name)} — كله أو جزء أو بدري</option>`).join('')}</select></label>`;
  // مصروف اتسجل عادي وهو تبع مناسبة (أو العكس): تربطه بميزانيتها — بيتطرح من الفاضل فيها ومن المحجوز لها
  const evNow = t && t.dueId ? byId(S.dues || [], t.dueId) : null;
  const evLinkable = t && t.type === 'exp' && !t.itemId && (!t.dueId || (evNow && evNow.kind === 'event' && !evNow.paidOn && t.duePrev && t.duePrev.date === evNow.date));
  const evOpen = (S.dues || []).filter(d => d.kind === 'event' && !d.paidOn);
  if(evLinkable && evOpen.length) body += `<label class="fld"><span>🎂 من ميزانية مناسبة؟</span><select name="ev"><option value="">لأ — مصروف عادي</option>${evOpen.map(d => `<option value="${d.id}" ${t.dueId === d.id ? 'selected' : ''}>${esc(d.name)} (فاضل ${fmt(d.amount)})</option>`).join('')}</select></label>`;
  const eit = t && t.itemId ? byId(S.items, t.itemId) : null;
  // وحدات التعديل: الوحدة اللي اتشرى بيها فعلًا (لو متسجلة) + وحدات الصنف + المقياس (لتر/كيلو/قطعة)
  let EU = [];
  if(eit){
    EU = itemUnits(eit).map(u => ({n:u.name, f:u.f}));
    if(t.u && t.u.f > 0 && !EU.some(u => u.n === t.u.n && Math.abs(u.f - t.u.f) < 1e-9)) EU.unshift({n:t.u.n, f:t.u.f});
  }
  const eu0 = eit ? (t.u ? EU.findIndex(u => u.n === t.u.n && Math.abs(u.f - t.u.f) < 1e-9) : EU.findIndex(u => u.f === 1 && u.n === BASES[baseOf(eit)].en)) : -1;
  const eui = eu0 >= 0 ? eu0 : EU.length - 1;
  if(t && t.itemId) body += eit
    ? `<div class="fld2">${Fd.num('qty', 'الكمية', +(t.qty / EU[eui].f).toFixed(3))}<label class="fld"><span>بالـ</span><select name="qu" data-prev="${eui}">${EU.map((u, i) => `<option value="${i}" data-f="${u.f}" ${i === eui ? 'selected' : ''}>${esc(u.n)}${u.f !== 1 || u.n !== BASES[baseOf(eit)].en ? ` (${fmtQ(u.f)} ${BASES[baseOf(eit)].en})` : ''}</option>`).join('')}</select></label></div>
       <div class="muted" style="margin:-4px 0 10px">= <b class="num" data-qbase>${fmtQ(t.qty)}</b> ${BASES[baseOf(eit)].en} في الاستوك</div>`
    : Fd.num('qty', 'الكمية', t.qty);
  if(t && t.grp){
    const g = S.tx.filter(x => x.grp === t.grp);
    if(g.length > 1) body += `<div class="note">🧾 جزء من فاتورة فيها <b class="num">${g.length}</b> حاجة بإجمالي <b class="num">${fmt(sum(g, x => x.amount))}</b> ج
      <div style="margin-top:8px"><button type="button" class="btn sm danger" data-act="delGroup" data-id="${t.grp}">امسح الفاتورة كلها</button></div></div>`;
  }
  body += Fd.text('note', 'ملاحظة (اختياري)', t ? t.note : '', 'placeholder="مثلاً: خضار من السوق"');
  body += Fd.date('date', 'التاريخ', t ? t.date : (preset.date || todayS()));
  body += Fd.foot(t ? 'حفظ التعديل' : 'سجّل', t ? {act:'delTx', id:t.id} : null);
  const title = t ? 'تعديل: ' + txInfo(t).title : isInc ? 'دخل إضافي' : 'مصروف جديد';
  NEXT_WALLET = {sel:t ? walletOf(t) : undefined, label:t && t.type === 'inc' ? 'دخلوا في' : 'دفعت من'};
  openSheet(title, body, v => {
    const amount = num(v.amount);
    if(!need(amount > 0, 'اكتب المبلغ')) return false;
    if(!sane(amount, v.date, t ? t.type : type, t ? t.id : null, v.cat)) return false;
    if(t){
      t.amount = (t.type === 'save' || t.type === 'reserve') && t.amount < 0 ? -amount : amount;
      t.note = v.note.trim(); t.date = v.date || t.date;
      if(v.wallet) t.walletId = v.wallet;
      if(v.cat) t.cat = v.cat;
      if(evLinkable && v.ev !== undefined && v.ev !== (t.dueId || '')){
        if(t.dueId){ S.tx = S.tx.filter(x => x.pair !== t.id); delete t.dueId; delete t.duePrev; }
        const du = v.ev ? byId(S.dues, v.ev) : null;
        if(du){
          t.dueId = du.id; t.duePrev = {date:du.date, amount:du.amount, paidOn:null};
          const rel = Math.min(Math.max(0, dueReserved(du)), t.amount);
          if(rel > 0) S.tx.push({id:uid(), ts:Date.now(), type:'reserve', dueId:du.id, dueDate:du.date, amount:-rel, note:'', date:t.date, pair:t.id, walletId:t.walletId});
        }
      }
      if(t.itemId && v.qty !== undefined){
        const uu = eit ? EU[+v.qu] || EU[eui] : null;
        t.qty = num(v.qty) * (uu ? uu.f : 1);
        if(uu) t.u = {n:uu.n, f:uu.f};
        // لو دي آخر مرة اشتريته، السعر يتظبط على التعديل
        const lastBuy = eit && itemBuys(eit).filter(x => x.amount > 0).sort((a, b) => evKey(a) < evKey(b) ? -1 : 1).pop();
        if(lastBuy === t && t.qty > 0) eit.price = Math.round(t.amount / t.qty * 10000) / 10000;
      }
      save(); toast('اتعدّل');
    }else{
      if(v.src && byId(S.incomes, v.src)){ receiveIncome(v.src, {amount, date:v.date}); return false; }
      S.tx.push({id:uid(), ts:Date.now(), type, amount, cat:type === 'exp' ? (v.cat || 'other') : undefined, note:v.note.trim(), date:v.date || todayS()});
      save();
      const lm = type === 'exp' ? limitMsg(v.cat || 'other') : null;
      if(lm) setTimeout(() => toast(lm.t, lm.bad), 50); else toast(type === 'inc' ? 'اتسجّل الدخل' : 'اتسجّل ✔');
      if(type === 'inc' && amount >= 100) setTimeout(() => allocateExtra(amount, v.date || todayS()), 60);
    }
  });
}

/* تحذيرات منطقية قبل التسجيل (مش منع): مبلغ كبير غريب، تاريخ في المستقبل أو قديم، أو تسجيل مكرر */
function sane(amount, date, type, editId, cat){
  const td = todayS(), inc = sum(S.incomes, i => i.amount || 0);
  const big = type === 'inc' ? Math.max(50000, inc * 3) : Math.max(10000, inc * 0.5);
  if(amount >= big && !confirm(`المبلغ ${fmt(amount)} ج كبير — متأكد إنه مظبوط؟ (مش ${fmt(amount / 10)}؟)`)) return false;
  if(date && date > addDays(td, 1) && !confirm(`التاريخ ${dayLabel(date)} في المستقبل — متأكد؟`)) return false;
  if(date && date < addDays(td, -90) && !confirm(`التاريخ ${dayLabel(date)} ${pd(date).getFullYear()} قديم أوي — متأكد؟`)) return false;
  if(!editId){
    const dup = S.tx.find(x => x.type === type && Math.abs(x.amount - amount) < 0.01 && (!cat || x.cat === cat) && x.date === (date || td) && Date.now() - (x.ts || 0) < 3 * 60000);
    if(dup && !confirm('سجّلت نفس المبلغ ده من دقايق — تسجّله تاني؟')) return false;
  }
  return true;
}

/* بيحدّث عناوين خانات الصنف حسب المقياس والعبوة المختارين */
function itemLabels(){
  const q = n => document.querySelector(`#sheetBody [name="${n}"]`), L = k => document.querySelector(`#sheetBody [data-l="${k}"]`);
  if(!q('base')) return;
  const base = BASES[q('base').value] || BASES.PCS, pu = q('pu').value && q('pu').value !== '__new' ? q('pu').value : '';
  const unit = pu || base.en, pf = num(q('pf').value) || 1;
  // العبوة اتغيرت: نحوّل الاستهلاك والسعر والموجود للعبوة الجديدة عشان القيمة الحقيقية (بالكيلو/القطعة) تفضل زي ما هي
  const fNow = pu ? pf : 1, fPrev = num($('#sheetBody').dataset.f) || 1;
  if(fNow !== fPrev){
    const sc = (n, k) => { const el = q(n); if(el && el.value.trim() !== '' && num(el.value) > 0) el.value = +(num(el.value) * k).toFixed(4); };
    sc('monthly', fPrev / fNow); sc('stock', fPrev / fNow); sc('price', fNow / fPrev);
    $('#sheetBody').dataset.f = fNow;
  }
  L('pfWrap').style.display = pu ? '' : 'none';
  L('pf').textContent = pu ? `الـ${pu} فيه كام ${base.en}` : '';
  L('monthly').textContent = `بتستهلك كام ${unit} في الشهر`;
  L('price').textContent = `سعر الـ${unit} (جنيه)`;
  if(L('stock')) L('stock').textContent = `الموجود عندك دلوقتي بالـ${unit} (اختياري)`;
  L('conv').innerHTML = pu ? `يعني: 1 ${esc(pu)} = <b class="num">${fmtQ(pf)}</b> ${base.en}` : `الكميات هتتكتب بالـ${base.en} (${base.ar})`;
}
/* الوحدات اللي الصنف بيتشرى بيها: العبوة الأساسية + أي عبوات تانية اتشرى بيها قبل كده + المقياس (KG/L/PCS) */
function itemUnits(it){
  const out = [];
  if(hasPack(it)) out.push({k:'pack', name:it.pu, f:it.pf});
  (it.alt || []).forEach((a, i) => { if(a && a.pu && a.pf > 0 && !(hasPack(it) && a.pu === it.pu && a.pf === it.pf)) out.push({k:'alt' + i, name:a.pu, f:a.pf}); });
  out.push({k:'base', name:BASES[baseOf(it)].en, f:1, base:true});
  return out;
}
const unitOf = (it, k) => itemUnits(it).find(u => u.k === k) || itemUnits(it)[0];
const unitLabel = (it, u) => u.base ? `${u.name} — ${BASES[baseOf(it)].ar}` : `${u.name} (= ${fmtQ(u.f)} ${BASES[baseOf(it)].en})`;
/* بيحفظ عبوة تانية للصنف (لو نفس الاسم موجود بيتحدّث) */
function addAltUnit(it, pu, pf){
  it.alt = (it.alt || []).filter(a => a && !(a.pu === pu && a.pf === pf));
  if(!(hasPack(it) && it.pu === pu && it.pf === pf)) it.alt.push({pu, pf});
  it.alt = it.alt.slice(-5);
}
/* اسم الوحدة مختصر — ولو فيه عبوتين بنفس الاسم (علبة كبيرة وصغيرة) بنكتب حجمها جنبها */
const unitShort = (it, u) => !u.base && itemUnits(it).filter(x => x.name === u.name).length > 1 ? `${u.name} ${fmtQ(u.f)}` : u.name;

    <div data-bl-pack style="display:none"><div class="fld2"><label class="fld" data-bl-new><span>العبوة</span><select name="npu" data-bl data-pick="packs" data-label="العبوة" data-prev="${esc(packs[0])}">${packs.map(p_ => `<option>${esc(p_)}</option>`).join('')}<option value="__new">➕ إضافة جديد…</option></select></label>

      f = num(v.npf);
      if(v.main){ const old = hasPack(it) ? {pu:it.pu, pf:it.pf} : null; it.pu = pu; it.pf = f; it.alt = (it.alt || []).filter(a_ => !(a_.pu === pu && a_.pf === f)); if(old) addAltUnit(it, old.pu, old.pf); }
      else addAltUnit(it, pu, f);

      f = u.base ? 1 : num(v.npf) > 0 ? num(v.npf) : u.f;

    save(); toast('اتسجّل الشراء');
  });
  $('#sheetBody').dataset.item = it.id;

/* الكيلو واللتر بيتشروا بأي كمية (ربع، نص، كيلو ونص…) حتى لو الصنف عبوته كيس كيلو — ضغطة وتتحط بالكيلو/اللتر */
function quickQtyChips(it){
  const b = baseOf(it); if(b === 'PCS') return '';
  const ar = BASES[b].ar, Q = [[0.25, 'ربع ' + ar], [0.5, 'نص ' + ar], [1, ar], [1.5, ar + ' ونص'], [2, '2 ' + ar]];
  return `<div class="chips" style="margin:-2px 0 8px">${Q.map(([q, t]) => `<button type="button" class="chip" data-act="buyQuick" data-q="${q}">${t}</button>`).join('')}</div>`;

/* بيحدّث عناوين شاشة الشراء حسب الوحدة المختارة */
function buyLabels(it){
  const q = n => document.querySelector(`#sheetBody [name="${n}"]`), L = k => document.querySelector(`#sheetBody [data-bl-l="${k}"]`);

  if(!isNew && !u.base) L('sizeNote').textContent = num(q('npf').value) > 0 && num(q('npf').value) !== u.f ? `الحجم ده للمرة دي بس — المحفوظ ${fmtQ(u.f)} ${base.en}` : '';
  else L('sizeNote').textContent = '';
  const unit = isNew ? (q('npu').value !== '__new' ? q('npu').value : 'العبوة') : u.name;

  L('qty').textContent = u && u.base && baseOf(it) !== 'PCS' ? `الكمية (كام ${base.ar} — نص = 0.5)` : `الكمية (عدد ${unit})`;
  L('npf').textContent = `حجم الـ${unit} (كام ${base.en})`;
  const qty = num(q('qty').value);
  L('conv').innerHTML = f > 0 && (isNew || !u.base) ? `${fmtQ(qty)} ${esc(unit)} = <b class="num">${fmtQ(qty * f)}</b> ${base.en}` : '';
  // المبلغ المقترح بيتحسب من الكمية لحد ما تكتب انت المبلغ
  const am = q('amount'); if(am && !am.dataset.dirty && it.price > 0 && qty > 0 && f > 0) am.value = Math.round(qty * f * it.price);

/* ---- تسجيل كذا حاجة مع بعض (فاتورة) ----

   سطر جديد بيتفتح لوحده أول ما تكتب مبلغ في آخر سطر. */
let ML = [];

      <input data-f="amount" inputmode="decimal" placeholder="المبلغ" value="${esc(o.amount || '')}">

    ${o.cat === 'house' && S.items.length
      ? `<div class="ml-sub"><select data-f="item" data-ml><option value="">— الصنف —</option>${S.items.map(x => `<option value="${x.id}" ${x.id === o.item ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
         <input data-f="qty" inputmode="decimal" placeholder="كام" value="${esc(o.qty || '')}">${!it ? '' : itemUnits(it).length > 1
           ? `<select data-f="unit" class="ml-unit">${itemUnits(it).map(u => `<option value="${u.k}" ${u.k === o.unit ? 'selected' : ''}>${esc(unitShort(it, u))}</option>`).join('')}</select>`
           : `<span class="muted ml-u">${esc(entryUnit(it))}</span>`}</div>`
      : `<div class="ml-sub"><input data-f="label" placeholder="إيه هي؟ (اختياري)" value="${esc(o.label || '')}"></div>`}</div>`;
}
function mlRead(){
  document.querySelectorAll('#mlines .ml-row').forEach((r, i) => {
    const g = f => { const el = r.querySelector(`[data-f="${f}"]`); return el ? el.value : ''; };
    Object.assign(ML[i], {cat:g('cat'), amount:g('amount'), item:g('item'), qty:g('qty'), unit:g('unit'), label:g('label')});
  });
}
function mlRender(){ $('#mlines').innerHTML = ML.map(mlRowHtml).join(''); mlTotal(); }
function mlTotal(){
  const a = [...document.querySelectorAll('#mlines [data-f="amount"]')].map(x => num(x.value));
  const el = $('#mlTotal'); if(el) el.innerHTML = `الإجمالي: <b class="num">${fmt(sum(a))}</b> ج · <span class="num">${a.filter(x => x > 0).length}</span> حاجة`;
}
function multiAdd(preset){
  preset = preset || {};
  ML = [{cat:'market'}, {cat:'market'}];
  const body = `<div class="seg"><button type="button" data-act="qaType" data-v="exp">مصروف</button><button type="button" class="on">🧾 كذا حاجة</button><button type="button" data-act="qaType" data-v="inc">دخل إضافي</button></div>
    <div class="muted" style="margin-bottom:8px; line-height:1.7">كل حاجة في سطر: التصنيف والمبلغ. لو حاجة من أصناف البيت اختار "استوك البيت" والصنف والكمية — هتتضاف للمخزون.</div>
    <div id="mlines"></div>
    <button type="button" class="btn sm" data-act="mlAdd">+ سطر</button>
    <div class="note" id="mlTotal"></div>
    ${Fd.text('note', 'المكان / ملاحظة للكل (اختياري)', '', 'placeholder="مثلاً: كارفور، السوق"')}
    ${Fd.date('date', 'التاريخ', preset.date || todayS())}
    ${Fd.foot('سجّل الكل')}`;
  NEXT_WALLET = {label:'دفعت من'};
  openSheet('🧾 كذا حاجة مع بعض', body, v => {
    mlRead();
    const lines = ML.filter(o => num(o.amount) > 0);
    if(!need(lines.length, 'اكتب مبلغ حاجة واحدة على الأقل')) return false;
    const badItem = lines.find(o => o.cat === 'house' && o.item && !(num(o.qty) > 0));
    if(badItem){ toast(`اكتب الكمية لـ ${byId(S.items, badItem.item).name}`, true); return false; }
    const total = sum(lines, o => num(o.amount)), date = v.date || todayS(), place = v.note.trim();
    if(!sane(total, date, 'exp', null, null)) return false;
    const ts = Date.now(), grp = uid();
    lines.forEach((o, i) => {
      const a = num(o.amount), it = o.cat === 'house' && o.item ? byId(S.items, o.item) : null;
      if(it){ const uu = unitOf(it, o.unit); recordBuy(it, num(o.qty) * uu.f, a, date, false, {n:uu.name, f:uu.f}); Object.assign(S.tx[S.tx.length - 1], {ts:ts + i, grp, note:it.name + (place ? ' — ' + place : '')}); }
      else S.tx.push({id:uid(), ts:ts + i, grp, type:'exp', cat:o.cat || 'other', amount:a, note:[o.label.trim(), place].filter(Boolean).join(' — '), date});
    });
    save();
    const lm = [...new Set(lines.map(o => o.cat))].map(limitMsg).filter(Boolean).sort((a, b) => b.bad - a.bad)[0];
    toast(lm ? lm.t : `اتسجّل ${lines.length} حاجة بـ ${fmt(total)} ج ✔`, lm && lm.bad);
  });
  mlRender();
  setTimeout(() => { const f = document.querySelector('#mlines [data-f="amount"]'); if(f && !$('#sheetBody').contains(document.activeElement)) f.focus(); }, 80);
}

function recordBuy(it, q, a, date, keepPrice, u){
  if(a > 0){
    // u = الوحدة اللي اتشرى بيها (جركن 4 / زجاجة 0.6 …) عشان التعديل بعدين يعرضها زي ما اتسجلت
    S.tx.push({id:uid(), ts:Date.now(), type:'exp', cat:'house', itemId:it.id, qty:q, amount:a, note:it.name, date, u});
    // السعر بيتحدّث من اللي دفعته فعلًا — إلا لو سبت المبلغ المقترح زي ما هو (تقديري)
    if(!keepPrice) it.price = Math.round(a / q * 10000) / 10000;
  }else{
    // اتشرى بس من غير مبلغ (هدية مثلًا) — نضيفه للجرد كحركة شراء بصفر
    S.tx.push({id:uid(), ts:Date.now(), type:'exp', cat:'house', itemId:it.id, qty:q, amount:0, note:it.name, date, u});
  }
}
function buyMany(){
  const L = shopList().filter(x => x.qty > 0);
  // الفرط بيتكتب بالكيلو/اللتر، والباقي بالعبوة
  const bf = it => isLoose(it) ? 1 : packF(it), bu = it => isLoose(it) ? BASES[baseOf(it)].en : entryUnit(it);
  let body = `<div class="muted" style="margin-bottom:8px">عدّل الكمية والسعر الفعلي، وشيل علامة ✓ من اللي ما اشترتهوش.</div><table class="tbl"><tr><th></th><th>الصنف</th><th>الكمية</th><th>دفعت</th></tr>`;
  L.forEach(x => {
    body += `<tr><td><input type="checkbox" name="k_${x.it.id}" checked style="width:20px;height:20px;accent-color:var(--gold)"></td><td><b>${esc(x.it.name)}</b><div class="muted">بالـ${isLoose(x.it) ? BASES[baseOf(x.it)].ar : esc(entryUnit(x.it))}</div></td>
      <td><input name="q_${x.it.id}" data-bm="${x.it.id}" data-up="${(x.it.price || 0) * bf(x.it)}" inputmode="decimal" value="${+(x.qty / bf(x.it)).toFixed(2)}" style="width:64px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);color:var(--ink);text-align:center"></td>
      <td><input name="c_${x.it.id}" data-amt inputmode="decimal" value="${x.cost ? Math.round(x.cost) : ''}" style="width:78px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);color:var(--ink);text-align:center"></td></tr>`;
  });
  body += `</table>${Fd.date('date', 'التاريخ', defaultDate())}${Fd.foot('سجّل كل ده')}`;
  NEXT_WALLET = {label:'دفعت من'};
  openSheet('اشتريت من القائمة', body, v => {
    let n = 0, tot = 0;
    L.forEach(x => {
      if(!v['k_' + x.it.id]) return;
      const q = num(v['q_' + x.it.id]), a = num(v['c_' + x.it.id]);
      if(q > 0){ recordBuy(x.it, q * bf(x.it), a, v.date || todayS(), !$(`#sheetBody [name="c_${x.it.id}"]`).dataset.dirty, {n:bu(x.it), f:bf(x.it)}); n++; tot += a; }
    });
    if(!n){ toast('مفيش حاجة متعلّمة', true); return false; }
    save(); toast(`اتسجّل ${n} صنف بـ ${fmt(tot)} ج`);
  });
}

  body += `<div class="fld2">${Fd.num('amount', 'المبلغ', d ? (d.baseAmount || d.amount) : (pre.amount || ''), debt ? 'autofocus' : '')}${Fd.date('date', 'الميعاد', d ? d.date : (pre.date || addDays(todayS(), 30)))}</div>`;
  body += `<label class="fld"><span>بيتكرر؟</span><select name="repeat">${Object.entries(REPEATS).map(([k, v]) => `<option value="${k}" ${(d ? d.repeat || 0 : (pre.repeat || 0)) == k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`;
  if(!d) body += Fd.num('reserved', 'شايل له كام لحد دلوقتي (اختياري)', '');
  if(d){
    const res = Math.max(0, dueReserved(d));
    body += `<div class="note">جاهز <b class="num">${fmt(res)}</b> من <b class="num">${fmt(d.amount)}</b> · المفروض تشيل <b class="num">${fmt(duePerMonth(d, periodOf(todayS())))}</b> في الشهر${res > 0 ? `<div style="margin-top:8px"><button type="button" class="btn sm" data-act="unreserve" data-id="${d.id}">↩️ رجّع فلوس من المحجوز لرصيدك</button></div>` : ''}</div>`;
  }
  body += Fd.foot(d ? 'حفظ' : 'إضافة', d ? {act:'delDue', id:d.id} : null);
  openSheet(d ? dueName(d) : debt ? 'ميعاد سداد: ' + debt.name : 'ميعاد سداد جديد', body, v => {
    if(!debt && !need(v.name.trim(), 'اكتب اسم الحاجة')) return false;
    if(!need(num(v.amount) > 0, 'اكتب المبلغ')) return false;
    if(!need(/^\d{4}-\d{2}-\d{2}$/.test(v.date), 'اختار الميعاد')) return false;
    const o = d || {id:uid(), createdAt:todayS(), debtId:debtId || undefined};
    const oldDate = o.date, paidPart = d ? Math.max(0, (d.baseAmount || d.amount) - d.amount) : 0;   // اللي اتدفع من الميعاد ده قبل كده
    Object.assign(o, {name:v.name.trim(), amount:Math.max(0, num(v.amount) - paidPart), baseAmount:num(v.amount), date:v.date, repeat:+v.repeat || 0, dom:pd(v.date).getDate()});
    // لو الميعاد اتغيّر، اللي اتشال يفضل محسوب للميعاد الجديد
    if(d && oldDate && oldDate !== o.date) S.tx.forEach(t => { if(t.type === 'reserve' && t.dueId === o.id && t.dueDate === oldDate) t.dueDate = o.date; });
    if(!d){
      S.dues = S.dues || []; S.dues.push(o);
      const r0 = num(v.reserved);
      if(r0 > 0) S.tx.push({id:uid(), ts:Date.now(), type:'reserve', dueId:o.id, dueDate:o.date, amount:r0, note:'اللي كان متشال قبل كده', date:todayS()});
    }
    if(!SUB.bills || !debt) SUB.bills = 'dues';
    save(); toast('اتحفظ — هيقولك تشيل كام كل شهر');
  });
}

  const rp = d ? (d.repeat || 0) : 12;
  body += `<label class="fld"><span>بتتكرر؟</span><select name="repeat">${[[12, 'كل سنة (عيد ميلاد، ذكرى جواز...)'], [1, 'كل شهر (زيارة الأهل، عزومة...)'], [3, 'كل 3 شهور'], [6, 'كل 6 شهور'], [0, 'مرة واحدة (فرح، مناسبة واحدة)']]
    .map(([k, t]) => `<option value="${k}" ${rp === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  body += `<label class="fld"><span>يتسجل على تصنيف</span><select name="cat">${expCats.map(c => `<option value="${c.id}" ${(d ? d.cat || 'gifts' : 'gifts') === c.id ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></label>`;
  if(!d) body += Fd.num('reserved', 'شايل له كام لحد دلوقتي (اختياري)', '');
  if(d){
    const res = Math.max(0, dueReserved(d));
    const sp = evSpent(d);
    body += `<div class="note">الجاي: <b>${dayLabel(d.date)} ${pd(d.date).getFullYear()}</b>${sp > 0 ? ` · اتصرف عليها <b class="num">${fmt(sp)}</b> · فاضل <b class="num">${fmt(d.amount)}</b>` : ''} · جاهز <b class="num">${fmt(res)}</b> من <b class="num">${fmt(d.amount)}</b>${res > d.amount + 1 ? '' : ` · اشيل <b class="num">${fmt(duePerMonth(d, periodOf(todayS())))}</b> في الشهر`}
      ${sp > 0 ? '<br><span class="muted">"هتصرف كام" = الميزانية كلها — اللي اتصرف بيتطرح منها لوحده.</span>' : ''}${res > 0 ? `<div style="margin-top:8px"><button type="button" class="btn sm" data-act="unreserve" data-id="${d.id}">↩️ رجّع فلوس من المحجوز لرصيدك</button></div>` : ''}</div>`;
  }
  body += Fd.foot(d ? 'حفظ' : 'إضافة', d ? {act:'delDue', id:d.id} : null);
  openSheet(d ? '🎂 ' + d.name : '🎂 عيد ميلاد / مناسبة', body, v => {
    if(!need(v.name.trim(), 'اكتب اسم المناسبة')) return false;
    if(!need(/^\d{4}-\d{2}-\d{2}$/.test(v.date), 'اختار التاريخ')) return false;
    if(!need(num(v.amount) > 0, 'اكتب هتصرف كام تقريبًا')) return false;
    let date = v.date;
    const repeat = +v.repeat || 0;
    const dom = pd(date).getDate();
    if(repeat) while(date < todayS()) date = addMonthsDate(date, repeat, dom);   // أقرب ميعاد جاي
    else if(date < todayS() && !confirm('التاريخ ده عدّى — متأكد؟')) return false;
    const o = d || {id:uid(), createdAt:todayS(), kind:'event'};
    const oldDate = o.date, spent = d ? evSpent(d) : 0;   // اللي اتصرف عليها قبل كده ما يرجعش يتحسب من الأول
    Object.assign(o, {name:v.name.trim(), amount:Math.max(0, num(v.amount) - spent), baseAmount:num(v.amount), date, repeat, cat:v.cat || 'gifts', dom});
    if(d && oldDate && oldDate !== o.date) S.tx.forEach(t => {
      if(t.type === 'reserve' && t.dueId === o.id && t.dueDate === oldDate) t.dueDate = o.date;
      if(t.type === 'exp' && t.dueId === o.id && t.duePrev && t.duePrev.date === oldDate) t.duePrev.date = o.date;
    });
    if(!d){
      S.dues = S.dues || []; S.dues.push(o);
      const r0 = num(v.reserved);
      if(r0 > 0) S.tx.push({id:uid(), ts:Date.now(), type:'reserve', dueId:o.id, dueDate:o.date, amount:r0, note:'اللي كان متشال قبل كده', date:todayS()});
    }
    SUB.bills = 'dues';
    save(); toast(`اتحفظ — ${dayLabel(o.date)}، اشيل ${fmt(duePerMonth(o, periodOf(todayS())))} في الشهر`);
  });
}
function reserveDue(id){
  const d = byId(S.dues, id), l = summary(periodOf(todayS())).dueLines.find(x => x.d.id === id);
  const res = Math.max(0, dueReserved(d)), sug = Math.min(d.amount - res, l ? Math.max(l.per - l.resThis, 0) || l.per : d.amount - res);
  NEXT_WALLET = {label:'شلتهم من'};
  openSheet('شلت لـ ' + dueName(d), `${Fd.num('amount', 'حطيت على جنب كام', Math.round(sug), 'autofocus', `جاهز <b class="num">${fmt(res)}</b> من <b class="num">${fmt(d.amount)}</b>`)}${Fd.date('date', 'التاريخ', defaultDate())}${Fd.foot('سجّل')}`, v => {
    const a = num(v.amount); if(!need(a > 0, 'اكتب المبلغ')) return false;
    S.tx.push({id:uid(), ts:Date.now(), type:'reserve', dueId:id, dueDate:d.date, amount:a, note:'', date:v.date || todayS()});
    save(); toast(dueReserved(d) >= d.amount - 1 ? '✅ فلوس الميعاد ده بقت جاهزة' : 'اتسجّل ✔');
  });
}
function payDue(id){
  const d = byId(S.dues, id), res = Math.max(0, dueReserved(d));
  const ev = d.kind === 'event';
  NEXT_WALLET = {label:'دفعت من'};
  // المناسبة: ممكن تصرف عليها على كذا مرة — تختار "لسه هكمل" (الميزانية تفضل مفتوحة) أو "خلصت" (الباقي يرجع لرصيدك)
  const spentSoFar = ev ? Math.max(0, (d.baseAmount || d.amount) - d.amount) : 0;
  const evChoice = ev ? `<div class="note" style="margin:-2px 0 10px">${spentSoFar > 0 ? `اتصرف عليها قبل كده <b class="num">${fmt(spentSoFar)}</b> · ` : ''}فاضل في ميزانيتها <b class="num">${fmt(d.amount)}</b></div>
    <div class="seg" style="margin-bottom:6px"><label style="flex:1"><input type="radio" name="evdone" value="0" checked style="display:none"><span class="evopt">لسه هكمل صرف عليها</span></label><label style="flex:1"><input type="radio" name="evdone" value="1" style="display:none"><span class="evopt">خلصت — اقفلها</span></label></div>
    <div class="muted" data-evhint style="margin-bottom:10px">الميزانية هتفضل مفتوحة بالباقي، وتكمّل تسجّل عليها.</div>
    <label class="fld"><span>التصنيف</span><select name="cat">${S.cats.filter(c => c.id !== 'house').map(c => `<option value="${c.id}" ${(d.cat || 'gifts') === c.id ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></label>
    ${Fd.text('note', 'اشتريت إيه؟ (اختياري)', '', 'placeholder="مثلًا: تورتة، هدية، زينة"')}` : '';
  openSheet((ev ? 'صرفت على: ' : 'دفعت: ') + dueName(d), `${Fd.num('amount', ev ? 'صرفت كام المرة دي' : 'المبلغ اللي اتدفع', ev ? '' : d.amount, 'autofocus', !ev && res > 0 ? `منهم <b class="num">${fmt(res)}</b> كانوا محجوزين` : '')}${evChoice}${Fd.date('date', 'التاريخ', defaultDate())}${Fd.foot('سجّل')}`, v => {
    const a = num(v.amount); if(!need(a > 0, 'اكتب المبلغ')) return false;
    const date = v.date || todayS(), ts = Date.now(), full = ev ? (v.evdone === '1' || a >= d.amount - 1) : a >= d.amount - 1;
    // الدفعة بتفتكر الميعاد كان عامل إزاي، عشان لو اتمسحت من اليومية يرجع زي ما كان
    const duePrev = {date:d.date, amount:d.amount, paidOn:d.paidOn || null}, payId = uid();
    if(ev) S.tx.push({id:payId, ts, type:'exp', cat:v.cat || d.cat || 'gifts', dueId:d.id, amount:a, note:[d.name, (v.note || '').trim()].filter(Boolean).join(' — '), date, duePrev});
    else S.tx.push({id:payId, ts, type:d.debtId ? 'debt' : 'bill', debtId:d.debtId, dueId:d.id, amount:a, note:dueName(d), date, duePrev});
    const rel = full ? res : Math.min(res, a);
    if(rel > 0) S.tx.push({id:uid(), ts:ts + 1, type:'reserve', dueId:d.id, dueDate:d.date, amount:-rel, note:'', date, pair:payId});
    if(full){
      if(d.repeat > 0){ d.date = addMonthsDate(d.date, d.repeat, d.dom || pd(d.date).getDate()); d.amount = d.baseAmount || d.amount; }
      else d.paidOn = date;
    }else d.amount = Math.round((d.amount - a) * 100) / 100;
    save(); toast(full ? (ev ? '🎉 المناسبة اتقفلت' + (res > a ? ' — الباقي رجع لرصيدك' : '') + (d.repeat > 0 ? ' · الجاية ' + dayLabel(d.date) + ' ' + pd(d.date).getFullYear() : '') : d.repeat > 0 ? 'اتسجّل ✔ — الجاي ' + dayLabel(d.date) + ' ' + pd(d.date).getFullYear() : '🎉 اتسدد')
      : ev ? `اتسجّل — فاضل في ميزانيتها ${fmt(d.amount)}` : `اتسجّل — فاضل ${fmt(d.amount)}`);
  });
}

/* جمعية مع نفسك: قسط ثابت كل شهر لعدد شهور، وتقبض المبلغ كله في الآخر */
function gameyaForm(id){
  const g = id ? byId(S.goals, id) : null, cp = periodOf(todayS());
  let body = Fd.text('name', 'اسم الجمعية', g ? g.name : 'جمعية', 'autofocus');
  body += `<div class="fld2">${Fd.num('monthly', 'القسط الشهري', g ? g.monthly : '')}${Fd.num('months', 'عدد الشهور', g ? g.months : 10, 'data-int data-max="60"')}</div>`;
  body += `<div class="fld2">${Fd.month('start', 'أول قسط شهر', g ? g.start : cp.y + '-' + pad(cp.m + 1))}${g ? '' : Fd.num('paidBefore', 'دفعت كام قسط قبل كده', '', 'data-int')}</div>`;
  body += `<div class="muted" data-gm style="margin:-4px 0 10px"></div>`;
  body += Fd.text('note', 'ملاحظة', g ? g.note : '', 'placeholder="مثلاً: هقبضها لمقدّم العربية"');
  body += Fd.foot(g ? 'حفظ' : 'إضافة', g ? {act:'delGoal', id:g.id} : null);
  openSheet(g ? '🪙 ' + g.name : '🪙 جمعية جديدة', body, v => {
    const m = num(v.monthly), n = Math.round(num(v.months));
    if(!need(m > 0, 'اكتب القسط')) return false;
    if(!need(n >= 2 && n <= 60, 'عدد الشهور من 2 لـ 60')) return false;
    if(!need(/^\d{4}-\d{2}$/.test(v.start), 'اختار شهر البداية')) return false;
    const sp = v.start.split('-').map(Number), endP = addMonths({y:sp[0], m:sp[1] - 1}, n - 1);
    const o = g || {id:uid(), createdAt:todayS(), kind:'gameya', icon:'🪙', rollDebts:false};
    Object.assign(o, {name:v.name.trim() || 'جمعية', monthly:m, months:n, start:v.start, target:m * n, deadline:endP.y + '-' + pad(endP.m + 1), note:v.note.trim()});
    if(!g){ o.initial = Math.max(0, Math.round(num(v.paidBefore))) * m; S.goals.push(o); }
    save(); toast(`اتحفظ — هتقبض ${fmt(m * n)} في ${monthName(o.deadline)}`);
  });
  const upd = () => {
    const m = num($('#sheetBody [name="monthly"]').value), n = Math.round(num($('#sheetBody [name="months"]').value)), st = $('#sheetBody [name="start"]').value;
    const el = $('#sheetBody [data-gm]'); if(!el) return;
    if(m > 0 && n > 1 && /^\d{4}-\d{2}$/.test(st)){ const sp = st.split('-').map(Number), e = addMonths({y:sp[0], m:sp[1] - 1}, n - 1); el.innerHTML = `هتقبض <b class="num">${fmt(m * n)}</b> ج في <b>${MONTHS[e.m]} ${e.y}</b>`; }
    else el.textContent = '';
  };
  document.querySelectorAll('#sheetBody input').forEach(x => x.addEventListener('input', upd)); upd();
}
function gameyaCard(g){
  const saved = goalSaved(g), target = g.target || 0, k = Math.min(g.months, Math.floor(saved / g.monthly + 0.01));
  const r = periodRange(periodOf(todayS())), thisM = sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && t.date >= r.start && t.date <= r.end), t => t.amount);
  const started = curKey() >= g.start, full = saved >= target - 0.5;
  const pct = target ? Math.min(100, saved / target * 100) : 0;
  let status;
  if(g.doneOn) status = `🎉 قبضت الجمعية ${dayLabel(g.doneOn)}.`;
  else if(full) status = `✅ كملت الأقساط كلها — فلوسك جاهزة <b class="num">${fmt(saved)}</b> ج.`;
  else if(!started) status = `⏳ هتبدأ ${monthName(g.start)}.`;
  else if(thisM >= g.monthly - 0.5) status = `✅ قسط الشهر ده اتدفع.`;
  else status = `⏳ قسط الشهر ده لسه (<b class="num">${fmt(g.monthly - Math.max(0, thisM))}</b> ج).`;
  return `<div class="card"><div class="goal-hero"><div class="ring" style="--p:${pct}"><b class="num">${k}/${g.months}</b></div>
      <div style="flex:1"><h3 style="margin:0">🪙 ${esc(g.name)}</h3>
        <div class="muted">قسط <b class="num">${fmt(g.monthly)}</b> × <b class="num">${g.months}</b> شهر · من ${monthName(g.start)} لـ ${monthName(g.deadline)}</div></div>
      <button class="btn sm" data-act="goalForm" data-id="${g.id}">تعديل</button></div>
    <div class="kv"><span>هتقبض</span><b>${money(target)}</b></div>
    <div class="kv"><span>دفعت لحد دلوقتي</span><b>${money(saved, 'pos')}</b></div>
    <div class="note">${status}${g.note ? '<br>📝 ' + esc(g.note) : ''}</div>
    ${g.doneOn ? '' : `<div class="btns" style="margin-top:10px">${full ? `<button class="btn primary" style="flex:1" data-act="gameyaPayout" data-id="${g.id}">قبضت الجمعية</button>` : `<button class="btn primary" style="flex:1" data-act="goalMove" data-id="${g.id}" data-s="1">دفعت القسط</button>`}</div>`}</div>`;
}

/* استلام دخل: كله أو جزء منه، وفي ميعاده أو بدري (مرتب الشهر الجاي) */
function receiveIncome(id, pre){
  const i = byId(S.incomes, id); pre = pre || {};
  const cur = periodOf(todayS()), nxt = addMonths(cur, 1);
  // الافتراضي: الشهر ده — إلا لو مرتب الشهر ده نزل خلاص، يبقى ده بتاع الشهر الجاي (نزل بدري)
  const tgt = incClosed(i, cur) ? nxt : cur, left = p_ => Math.max(0, (i.amount || 0) - incGot(i, p_));
  const dueOf = p_ => dayLabel(dueDateIn(periodRange(p_), i.day || S.settings.cycleDay || 1));
  const opt = p_ => `<option value="${pKey(p_)}" data-left="${left(p_)}" ${samePeriod(p_, tgt) ? 'selected' : ''}>اللي ميعاده ${dueOf(p_)}${incGot(i, p_) > 0 ? ` (نزل منه ${fmt(incGot(i, p_))})` : ''}${samePeriod(p_, nxt) ? ' — نزل بدري' : ''}</option>`;
  NEXT_WALLET = {label:'نزل في'};
  openSheet('استلمت ' + i.name, `<label class="fld"><span>ده</span><select name="forp" data-incleft>${opt(cur)}${opt(nxt)}</select></label>
    ${Fd.num('amount', 'المبلغ اللي نزل فعلًا', pre.amount || left(tgt) || i.amount, 'autofocus')}
    <div class="seg" style="margin-bottom:6px"><label style="flex:1"><input type="radio" name="fin" value="0" checked style="display:none"><span class="evopt">لسه هينزل الباقي</span></label><label style="flex:1"><input type="radio" name="fin" value="1" style="display:none"><span class="evopt">ده كله (مفيش باقي)</span></label></div>
    <div class="muted" style="margin-bottom:10px; line-height:1.7">لو نزل جزء بس: "لسه هينزل الباقي" يخلّي الباقي متوقع في الخطة. ولو نزل أقل (خصم مثلًا) اختار "ده كله".<br>ولو ده مرتب الشهر الجاي ونزل بدري، بيتحسب لشهره — مش بيتصرف منه الشهر ده.</div>
    <label class="switch" data-early style="${samePeriod(tgt, nxt) ? '' : 'display:none;'}margin:-2px 0 10px"><input type="checkbox" name="useNow"> <span>هصرف منه الشهر ده (سلفة من مرتب الشهر الجاي) — يدخل في "حر للصرف" دلوقتي</span></label>
    ${Fd.date('date', 'نزل يوم', pre.date || defaultDate())}${Fd.foot('سجّل')}`, v => {
    const a = num(v.amount); if(!need(a > 0, 'اكتب المبلغ')) return false;
    const date = v.date || todayS(), fp = v.forp || pKey(cur), early = fp > pKey(periodOf(date));
    S.tx.push({id:uid(), ts:Date.now(), type:'inc', incomeId:id, amount:a, note:'', date, forP:fp !== pKey(periodOf(date)) ? fp : undefined, final:v.fin === '1' || undefined, useNow:early && v.useNow ? true : undefined});
    save();
    const fpP = {y:+fp.slice(0, 4), m:+fp.slice(5) - 1}, rem = incClosed(i, fpP) ? 0 : left(fpP);
    if(early){ toast(v.useNow ? `💰 اتسجّل — دخل في رصيدك الحر دلوقتي، ولما ميعاده ييجي هيتطرح من المتوقع` : `💰 اتسجّل — هيفضل على جنب لحد ميعاده${rem > 0 ? `، وفاضل ${fmt(rem)} لسه هينزل` : ''}`, false, 6000); return; }
    toast(rem > 0 ? `💰 اتسجّل — فاضل ${fmt(rem)} لسه هينزل` : '💰 اتسجّل');
    setTimeout(() => allocateSalary(a, date), 60);
  });
}
/* ---- توزيع دخل إضافي (مكافأة، شغل زيادة...) ----
   الاقتراح: الأول نكمّل أي ميعاد سداد قريب ناقصه فلوس، وبعدين جزء للديون وجزء للهدف،
   والباقي يفضل للصرف. كل الأرقام تتعدّل قبل التسجيل. */
function allocateExtra(amount, date){
  let left = amount;
  const rows = [];
  activeDues().filter(d => diffDays(todayS(), d.date) <= 90).sort((a, b) => a.date < b.date ? -1 : 1).forEach(d => {
    const short = Math.max(0, d.amount - Math.max(0, dueReserved(d)));
    if(short < 1 || left < 1) return;
    const a = Math.min(short, left); left -= a;
    rows.push({k:'due', id:d.id, label:`📅 ${esc(dueName(d))} <span class="muted">(${dayLabel(d.date)} — ناقصه ${fmt(short)})</span>`, v:a});
  });
  const debt = S.debts.filter(d => debtRemaining(d) > 0.5).sort((a, b) => debtRemaining(a) - debtRemaining(b))[0];
  const goal = S.goals.find(g => g.kind !== 'gameya' && !g.doneOn && goalSaved(g) < (g.target || 0));
  const base = left;
  if(debt){ const a = Math.min(debtRemaining(debt), Math.round(base * (goal ? 0.3 : 0.6))); left -= a; rows.push({k:'debt', id:debt.id, label:`💳 سداد زيادة من دين: ${esc(debt.name)} <span class="muted">(باقي ${fmt(debtRemaining(debt))})</span>`, v:a}); }
  if(goal){ const a = Math.round(base * (debt ? 0.5 : 0.7)); left -= a; rows.push({k:'goal', id:goal.id, label:`${esc(goal.icon || "🎯")} تحويش للهدف: ${esc(goal.name)}`, v:a}); }
  allocSheet({title:'توزّع الدخل الإضافي إزاي؟', amount, date, rows, ok:'وزّع كده', skip:'سيبه كله للصرف', leftLbl:'الباقي للصرف',
    intro:`جالك <b class="num">${fmt(amount)}</b> ج زيادة 🎉 الفلوس الزيادة لو اتسابت في الجيب بتتصرف من غير ما تحس. ده اقتراح للتوزيع، وتقدر تعدّل أي رقم:`});
}
/* تقسيم المرتب أول ما ينزل (ادفع لنفسك الأول): الجمعيات والأهداف + المواعيد، والباقي للالتزامات والمصروف */
function allocateSalary(amount, date){
  const r = periodRange(periodOf(date)), rows = [];
  S.goals.filter(g => !g.doneOn).forEach(g => {
    const need = goalPlanMonthly(g) - sum(S.tx.filter(t => t.type === 'save' && t.goalId === g.id && t.date >= r.start && t.date <= r.end), t => t.amount);
    if(need > 1) rows.push({k:'goal', id:g.id, label:`${esc(g.icon || '🎯')} ${g.kind === 'gameya' ? 'قسط ' : 'تحويش '}${esc(g.name)}`, v:Math.round(need)});
  });
  const o = summary(periodOf(date));
  o.dueLines.forEach(l => { const need = l.per - l.resThis; if(need > 1) rows.push({k:'due', id:l.d.id, label:`${l.d.kind === 'event' ? '🎂' : '📅'} شيل لـ ${esc(dueName(l.d))} <span class="muted">(${dayLabel(l.d.date)})</span>`, v:Math.round(need)}); });
  const fixed = Math.max(0, o.billPlanned - o.billPaid) + Math.max(0, o.debtPlanned - o.debtPaid) + Math.max(0, o.houseBudget - o.houseSpent);
  allocSheet({title:'🧮 قسّم المرتب', amount, date, rows, ok:'قسّم كده', skip:'بعدين', leftLbl:'يفضل للالتزامات والمصروف',
    intro:`نزل <b class="num">${fmt(amount)}</b> ج. أحسن وقت تحوّش فيه هو <b>أول ما المرتب ينزل</b> — قبل ما يتصرف. ده التقسيم حسب خطتك (تقدر تعدّل):`,
    extra:used => { const rest = amount - used; return `<br><span class="muted">منهم التزامات وأقساط واستوك لسه: <b class="num">${fmt(fixed)}</b> · ويفضل للمصروف اليومي: <b class="num ${rest - fixed < 0 ? 'neg' : ''}">${fmt(rest - fixed)}</b> (حوالي <span class="num">${fmt((rest - fixed) / Math.max(1, diffDays(date, r.end) + 1))}</span> في اليوم)</span>`; }});
}
function allocSheet(cfg){
  const {amount, date, rows} = cfg;
  if(!rows.length) return;
  const body = `<div class="muted" style="line-height:1.8; margin-bottom:10px">${cfg.intro}</div>
    ${rows.map((r, i) => `<label class="fld"><span>${r.label}</span><input name="a${i}" inputmode="decimal" value="${Math.round(r.v)}" data-alloc></label>`).join('')}
    <div class="note" id="allocLeft"></div>
    <div class="sheet-foot"><button type="submit" class="btn primary">${cfg.ok}</button><button type="button" class="btn" data-act="closeSheet">${cfg.skip}</button></div>`;
  NEXT_WALLET = {label:'من محفظة'};
  openSheet(cfg.title, body, v => {
    let n = 0; const ts = Date.now();
    rows.forEach((r, i) => {
      const a = num(v['a' + i]); if(!(a > 0)) return;
      if(r.k === 'due'){ const d = byId(S.dues, r.id); S.tx.push({id:uid(), ts:ts + i, type:'reserve', dueId:d.id, dueDate:d.date, amount:a, note:'', date}); }
      if(r.k === 'debt') S.tx.push({id:uid(), ts:ts + i, type:'debt', debtId:r.id, amount:Math.min(a, debtRemaining(byId(S.debts, r.id))), note:'سداد زيادة', date});
      if(r.k === 'goal') S.tx.push({id:uid(), ts:ts + i, type:'save', goalId:r.id, amount:a, note:'', date});
      n++;
    });
    if(!n) return;
    save(); toast('اتسجّل ✔');
  });
  const upd = () => {
    const used = sum([...document.querySelectorAll('#sheetBody [data-alloc]')], x => num(x.value));
    const el = $('#allocLeft');
    if(el) el.innerHTML = used > amount ? `<span class="neg">الأرقام أكبر من المبلغ بـ <b class="num">${fmt(used - amount)}</b></span>` : `${cfg.leftLbl}: <b class="num">${fmt(amount - used)}</b> ج${cfg.extra ? cfg.extra(used) : ''}`;
  };
  document.querySelectorAll('#sheetBody [data-alloc]').forEach(x => x.addEventListener('input', upd));
  upd();
}

function setCycleDay(d){
  const td = todayS();
  S.settings.cycleDay = d;
  VIEW = periodOf(td);
}

/* ---- جرد الفلوس ---- */
/* المحجوز للمواعيد جوه كل محفظة (بيتشال من الرصيد، بس فلوسه لسه في الخزنة) */
function reservedIn(w){
  if(S.wallets.length < 2) return Math.max(0, totalReserved());
  const act = new Set(activeDues().map(d => d.id));
  return Math.max(0, sum(S.tx.filter(t => t.type === 'reserve' && act.has(t.dueId) && walletOf(t) === w.id), t => t.amount));
}
/* جرد الفلوس: بتكتب كل اللي في الخزنة (شامل المحجوز للمواعيد)، والبرنامج بيطرح المحجوز لوحده */
function cashCount(){
  const B = cashBalance(), multi = S.wallets.length > 1, resAll = Math.max(0, totalReserved());
  const W = B.wallets.map(x => Object.assign({}, x, {res:reservedIn(x.w), total:x.value + reservedIn(x.w)}));
  const resNote = resAll > 0 ? `<br>اكتب <b>كل</b> الفلوس حتى اللي شايلها للمواعيد — البرنامج هيطرح الـ <b class="num">${fmt(resAll)}</b> المحجوزين لوحده.` : '';
  let body;
  if(multi){
    body = `<div class="muted" style="line-height:1.8; margin-bottom:8px">اكتب اللي في كل محفظة دلوقتي (سيب الفاضي لو مش هتجرده).${resNote}</div>` +
      W.map(x => `<div class="jard-row"><div class="nm">${x.w.icon} ${esc(x.w.name)}${x.known ? `<small>المفروض ${fmt(x.total)}${x.res > 0 ? ` (منهم محجوز ${fmt(x.res)})` : ''}</small>` : ''}</div><input name="cw_${x.w.id}" inputmode="decimal" placeholder="${x.known ? fmt(x.total) : '—'}"></div>`).join('');
  }else{
    const x = W[0], hint = B.known ? `حسب اللي متسجل المفروض معاك <b class="num">${fmt(x.total)}</b> ج${x.res > 0 ? ` (منهم <span class="num">${fmt(x.res)}</span> محجوزين للمواعيد)` : ''}.` : 'اجمع الكاش اللي معاك + اللي في البنك أو المحفظة (من غير فلوس التحويش لو حاططها لوحدها).';
    body = Fd.num('amount', 'معاك كام فلوس دلوقتي؟ (الكل)', '', 'autofocus', hint + resNote);
  }
  body += Fd.text('note', 'ملاحظة (اختياري)', '') + Fd.foot('حفظ الرصيد');
  openSheet('جرد الفلوس', body, v => {
    // اللي اتكتب = الخزنة كلها؛ اللي بيتسجّل = بعد طرح المحجوز (عشان الرصيد يفضل "من غير المحجوز")
    const entries = (multi
      ? W.filter(x => String(v['cw_' + x.w.id] || '').trim() !== '').map(x => ({x, total:num(v['cw_' + x.w.id])}))
      : (String(v.amount).trim() !== '' ? [{x:W[0], total:num(v.amount)}] : [])).map(e => Object.assign(e, {amount:e.total - e.x.res}));
    if(!need(entries.length, 'اكتب المبلغ')) return false;
    const neg = entries.find(e => e.amount < -0.5);
    if(neg && !confirm(`كتبت ${fmt(neg.total)} بس المحجوز للمواعيد ${fmt(neg.x.res)} — يعني اتصرف من المحجوز ${fmt(-neg.amount)}. أكمّل؟`)) return false;
    // الجرد اللي قبله لو اتعمل بالطريقة القديمة (من غير "total") مش مضمون إنه كان من غير المحجوز،
    // فما نقارنش بيه ولا نسجّل "مصاريف ما اتسجلتش" — الجرد الجديد بيظبط الرصيد وخلاص
    const trusted = e => e.x.known && e.x.last && e.x.last.total != null;
    const ts = Date.now(), short = entries.filter(e => trusted(e) && e.x.value - e.amount > 1), over = entries.filter(e => trusted(e) && e.amount - e.x.value > 1);
    const shortSum = sum(short, e => e.x.value - e.amount);
    if(short.length && confirm(`فيه ${fmt(shortSum)} ج أقل من المتسجل — غالبًا مصاريف ما اتسجلتش.\nأسجّلهم كمصروف "متنوع" عشان الحسابات تتظبط؟`))
      short.forEach((e, i) => S.tx.push({id:uid(), ts:ts + i, type:'exp', cat:'other', amount:Math.round(e.x.value - e.amount), note:'فرق جرد الفلوس — مصاريف ما اتسجلتش', date:todayS(), walletId:e.x.w.id}));
    S.cashCounts = S.cashCounts || [];
    entries.forEach((e, i) => S.cashCounts.push({id:uid(), ts:ts + 10 + i, date:todayS(), amount:e.amount, total:e.total, walletId:e.x.w.id, note:v.note.trim()}));
    save();
    const tot = sum(entries, e => e.total), free = sum(entries, e => e.amount), res = tot - free;
    if(over.length) toast(`معاك ${fmt(sum(over, e => e.amount - e.x.value))} ج زيادة عن المتسجل — لو دخل فلوس سجّلها كدخل إضافي`, false, 6000);
    else if(!short.length) toast(res > 0.5 ? `اتسجّل ✔ في الخزنة ${fmt(tot)} — منهم ${fmt(res)} محجوز للمواعيد، ورصيدك ${fmt(free)}` : 'اتسجّل الرصيد ✔', false, res > 0.5 ? 6000 : 0);
  });
}

/* ---- المحافظ والتحويل ---- */

function transferForm(id){

  let body = `<div class="fld2"><label class="fld"><span>من</span><select name="from">${opt(t && t.from, S.wallets[0].id)}</select></label><label class="fld"><span>إلى</span><select name="to">${opt(t && t.to, S.wallets[1].id)}</select></label></div>`;

  body += Fd.date('date', 'التاريخ', t ? t.date : todayS()) + Fd.text('note', 'ملاحظة', t ? t.note : '', 'placeholder="مثلاً: سحب من الـ ATM"');
  body += Fd.foot(t ? 'حفظ' : 'حوّل', t ? {act:'delTx', id:t.id} : null);
  openSheet(t ? 'تعديل تحويل' : '⇄ تحويل بين المحافظ', body, v => {

    }

/* ---- حدود المصروف لكل تصنيف ---- */
function limitLines(o){
  const by = expByCat(o.T), el = elapsedDays(o);
  return S.cats.filter(c => c.limit > 0).map(c => {
    const spent = by[c.id] || 0, pct = spent / c.limit;
    return {c, spent, pct, pace:o.isCurrent ? spent / el * o.r.days : spent};
  });
}
/* رسالة بعد تسجيل مصروف لو التصنيف قرّب أو عدّى الحد */
function limitMsg(catId){
  const c = byId(S.cats, catId); if(!c || !(c.limit > 0)) return null;
  const spent = expByCat(summary(periodOf(todayS())).T)[catId] || 0, pct = spent / c.limit;
  if(pct >= 1) return {t:`⚠️ ${c.name} عدّى الحد: ${fmt(spent)} من ${fmt(c.limit)}`, bad:true};
  if(pct >= 0.8) return {t:`🟡 ${c.name}: ${Math.round(pct * 100)}% من الحد — فاضل ${fmt(c.limit - spent)}`, bad:false};
  return null;
}
function limitsCard(o){
  const L = limitLines(o);
  if(!L.length){
    if(S.tx.filter(t => t.type === 'exp').length < 10) return '';
    return `<div class="card"><h3>🎯 حدود المصروف <button class="btn sm dark" data-act="limitsForm">حط حدود</button></h3><div class="muted" style="line-height:1.8">حط حد شهري لكل تصنيف (مثلًا أكل برا 1,500)، والبرنامج ينبّهك لما توصل 80% ولما تعدّيه. أقوى طريقة عملية لتقليل المصاريف.</div></div>`;
  }
  const tot = sum(L, l => l.c.limit);
  return `<div class="card"><h3>🎯 حدود المصروف <button class="btn sm" data-act="limitsForm">تعديل</button></h3>` + L.sort((a, b) => b.pct - a.pct).map(l => {
    const cls = l.pct >= 1 ? 'bad' : l.pct >= 0.8 ? 'warn' : 'good';
    const paceTxt = o.isCurrent && l.pct < 1 && l.pace > l.c.limit * 1.05 ? ` · <span class="neg">بالمعدل ده هيوصل ${fmt(l.pace)}</span>` : '';
    return `<div class="cat-row"><div class="row"><span>${l.c.icon} ${esc(l.c.name)}</span><span><b class="num">${fmt(l.spent)}</b> <span class="muted">من</span> <span class="num">${fmt(l.c.limit)}</span>${l.pct >= 1 ? ' <span class="tag bad">عدّى</span>' : ''}</span></div>
      <div class="bar ${cls}"><i style="width:${Math.min(100, l.pct * 100)}%"></i></div><div class="muted" style="font-size:11.5px; margin-top:3px">${l.pct >= 1 ? 'زيادة ' + fmt(l.spent - l.c.limit) : 'فاضل ' + fmt(l.c.limit - l.spent)}${paceTxt}</div></div>`;
  }).join('') + `<div class="muted">مجموع الحدود <b class="num">${fmt(tot)}</b>${o.varBudget > 0 ? ` من المتاح للمصروف <b class="num">${fmt(o.varBudget)}</b>${tot > o.varBudget ? ' — <span class="neg">الحدود أكبر من المتاح</span>' : ''}` : ''}</div></div>`;
}
function limitsForm(){
  const base = baseline(periodOf(todayS()), 3).avg, cats = S.cats.filter(c => c.id !== 'house');
  const body = `<div class="muted" style="line-height:1.8; margin-bottom:10px">اكتب أقصى مبلغ في الشهر لكل تصنيف عاوز تراقبه، وسيب الباقي فاضي. الرقم الرمادي = متوسط صرفك الحقيقي آخر 3 شهور.</div>
    ${cats.map(c => `<div class="jard-row"><div class="nm">${c.icon} ${esc(c.name)}${base[c.id] ? `<small>متوسطك ${fmt(base[c.id])}</small>` : ''}</div><input name="l_${c.id}" inputmode="decimal" value="${c.limit > 0 ? c.limit : ''}" placeholder="${base[c.id] ? Math.round(base[c.id] * 0.9 / 50) * 50 : '—'}"></div>`).join('')}

function catForm(id){
  const c = id ? byId(S.cats, id) : null;
  const used = c ? S.tx.some(t => t.cat === c.id) : false;
  let body = `<div class="fld2">${Fd.text('name', 'اسم التصنيف', c ? c.name : '', 'autofocus')}${Fd.text('icon', 'أيقونة (إيموجي)', c ? c.icon : '🧾')}</div>`;
  if(!c || c.id !== 'house') body += Fd.num('limit', 'حد شهري (اختياري)', c && c.limit > 0 ? c.limit : '', '', 'البرنامج هينبّهك لما توصل 80% من الحد ولما تعدّيه.');
  body += Fd.foot('حفظ', c && !c.fixed ? {act:'delCat', id:c.id, label:used ? 'حذف (مستخدم)' : 'حذف'} : null);
  openSheet(c ? 'تعديل تصنيف' : 'تصنيف جديد', body, v => {
    if(!need(v.name.trim(), 'اكتب الاسم')) return false;
    const o = c || {id:'c' + uid()};
    o.name = v.name.trim(); o.icon = v.icon.trim() || '🧾';
    if(v.limit !== undefined){ if(num(v.limit) > 0) o.limit = num(v.limit); else delete o.limit; }
    if(!c) S.cats.push(o);
    save();
  });
}

    const done = new Set(filled.map(x => x.it.id));
    const countedToday = new Set(S.counts.filter(c => c.date === todayS()).map(c => c.itemId));
    const left = S.items.filter(it => !done.has(it.id) && !countedToday.has(it.id) && !isPaused(it) && (estStock(it) || 0) > 0.001);

    const body = `<div class="muted" style="line-height:1.8; margin-bottom:10px">${filled.length ? `كتبت جرد <b class="num">${filled.length}</b> صنف. ` : ''}الـ <b class="num">${left.length}</b> صنف التانيين هيفضلوا زي ما هم.</div>

/* تراجع: أي حذف بياخد صورة من البيانات قبله، ويظهر زرار "تراجع" 8 ثواني */
let UNDO = null, undoT = null;
/* التراجع بيرجّع بس الحاجات اللي العملية دي غيّرتها (مش نسخة كاملة) — فأي حاجة اتسجلت بعدها أو جت من جهاز تاني ما بتضيعش */
function undoDiff(before){
  const d = {restore:{}, remove:{}};
  MERGE_KEYS.forEach(k => {
    const now = new Map((S[k] || []).filter(x => x && x.id).map(x => [x.id, JSON.stringify(x)]));
    const was = (before[k] || []).filter(x => x && x.id);
    const wasIds = new Set(was.map(x => x.id));
    d.restore[k] = was.map((x, i) => [i, x]).filter(([, x]) => now.get(x.id) !== JSON.stringify(x));
    d.remove[k] = [...now.keys()].filter(id => !wasIds.has(id));
  });
  return d;
}
function applyUndo(u){
  const back = [], gone = [];
  MERGE_KEYS.forEach(k => {
    S[k] = S[k] || [];
    (u.remove[k] || []).forEach(id => { S[k] = S[k].filter(x => !x || x.id !== id); gone.push(id); });
    (u.restore[k] || []).forEach(([i, x]) => {
      const j = S[k].findIndex(y => y && y.id === x.id);
      if(j >= 0) S[k][j] = x; else S[k].splice(Math.min(i, S[k].length), 0, x);
      back.push(x.id);
    });
  });
  const keep = new Set(back);
  S.tomb = (S.tomb || []).filter(e => !keep.has(String(e).replace(/\|\d+$/, '')));
  tombAdd(S, gone);
}
function showUndo(snap, msg){
  UNDO = snap; $('#undoMsg').textContent = msg || 'اتمسح'; $('#undoBar').classList.add('show');
  clearTimeout(undoT); undoT = setTimeout(() => { $('#undoBar').classList.remove('show'); UNDO = null; }, 8000);
}
Object.keys(ACT).filter(k => /^del|^wipe$|^restoreSnap$/.test(k)).forEach(k => {
  const fn = ACT[k];
  ACT[k] = (d, el) => {
    const snap = JSON.stringify(S), before = S.updatedAt, beforeS = JSON.parse(snap);
    const ids = /^del/.test(k) ? new Set(MERGE_KEYS.flatMap(m => (S[m] || []).map(x => x && x.id))) : null;
    fn(d, el);
    if(S.updatedAt !== before){
      if(ids){
        const now = new Set(MERGE_KEYS.flatMap(m => (S[m] || []).map(x => x && x.id)));
        const gone = [...ids].filter(id => id && !now.has(id));
        if(gone.length){ tombAdd(S, gone); persist(); }
      }
      const u = /^del/.test(k) ? undoDiff(beforeS) : {full:snap};
      setTimeout(() => showUndo(u, k === 'restoreSnap' ? 'اتسترجعت النسخة' : 'اتمسح'), 30);
    }
  };
});

/* استرجاع نسخة كاملة (ملف أو نسخة يومية): اللي مش موجود فيها يتعلّم إنه اتمسح، عشان المزامنة ما ترجعهوش من الشيت */
function replaceAll(ns){
  const keep = {syncUrl:S.settings.syncUrl, syncSecret:S.settings.syncSecret, lastWallet:S.settings.lastWallet};
  const prev = new Set(MERGE_KEYS.flatMap(k => (S[k] || []).map(x => x && x.id)));
  const oldTomb = S.tomb || [];
  S = ns; Object.assign(S.settings, keep);
  const now = new Set(MERGE_KEYS.flatMap(k => (S[k] || []).map(x => x && x.id)));
  S.tomb = [...new Set([...oldTomb, ...(S.tomb || [])])].filter(e => !now.has(String(e).replace(/\|\d+$/, '')));
  tombAdd(S, [...prev].filter(id => id && !now.has(id)));
  VIEW = periodOf(todayS()); save();
}
let toastT = null;
