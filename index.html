/* ===================== المزامنة مع جوجل شيت (اختياري) =====================
   الجهاز هو الأساس. لما المزامنة شغالة:
   - أول ما البرنامج يفتح (أو ترجعله)، بيسحب النسخة اللي على الشيت لو أحدث.
   - بعد أي تعديل بثانية ونص، بيرفع النسخة للشيت.
   - لو فيه تعديلات على الجهاز ما اترفعتش ونسخة الشيت أحدث، بيسألك. */
let syncTimer = null, syncState = '', syncBusy = false;
function syncedAt(){ return Number(localStorage.getItem(SYNCED_KEY) || 0); }
function setSynced(v){ localStorage.setItem(SYNCED_KEY, String(v)); }
function setSync(state, msg){
  syncState = msg || '';
  const el = $('#syncDot');
  if(!S.settings.syncUrl){ el.textContent = ''; return; }
  el.textContent = state === 'busy' ? '⏳ بيتزامن' : state === 'ok' ? '☁️ متزامن' : '⚠️ ' + (msg || 'مش متزامن');
  const info = $('#syncInfo'); if(info) info.textContent = syncInfoText();
}
function syncInfoText(){
  if(!S.settings.syncUrl) return 'المزامنة مقفولة — البيانات على الجهاز ده بس.';
  const t = syncedAt();
  return (syncState ? syncState + ' · ' : '') + (t ? 'آخر مزامنة: ' + new Date(t).toLocaleString('ar-EG') : 'لسه ما اتزامنش');
}
function scheduleSync(){
  if(!S.settings.syncUrl) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; pushRemote(false); }, 1500);
}
async function api(method, payload){
  const s = S.settings;
  if(!/^https?:\/\/\S+\/exec(\?\S*)?$/.test(s.syncUrl)) throw new Error('الرابط لازم يخلص بـ /exec (انسخ Web app URL مش رابط المحرر)');
  let res;
  try{
  if(method === 'GET') res = await fetch(s.syncUrl + (s.syncUrl.includes('?') ? '&' : '?') + 'secret=' + encodeURIComponent(s.syncSecret || '') + '&t=' + Date.now(), {cache:'no-store'});
  else res = await fetch(s.syncUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({secret:s.syncSecret || ''}, payload))});
  }catch(e){
    // "Failed to fetch" = يا مفيش نت، يا جوجل رجّع صفحة تسجيل دخول/خطأ بدل رد السكريبت
    throw new Error(navigator.onLine === false ? 'مفيش نت دلوقتي' : 'مش قادر يوصل للسكريبت — اتأكد إن النشر Who has access = Anyone، وإنك عملت Deploy بـ New version بعد آخر تعديل');
  }
  const txt = await res.text();
  let j = null; try{ j = JSON.parse(txt); }catch(e){}
  if(!j) throw new Error('رد غير مفهوم — راجع إن النشر Anyone');
  if(!j.ok){ const err = new Error(j.error || 'فشل'); err.code = j.code; throw err; }
  return j;
}
/* ---- حماية المزامنة من "رفع الفاضي فوق الحقيقي" ----
   ١) ممنوع أي رفع تلقائي قبل ما نسحب من الشيت بنجاح في نفس الفتحة (SYNC_READY).
   ٢) الرفع التلقائي عمره ما بيكتب فوق نسخة أكبر — لو الشيت رفض (shrink) بنقف ونقولك،
      والكتابة فوق الشيت بنسخة أصغر ممكنة بس يدوي من الإعدادات وبتأكيد مرتين.
   ٣) لو فيه تعديلات هنا ونسخة أحدث هناك (أو الجهاز ده فاضي/أصغر بكتير) بندمج الاتنين
      بدل ما نختار واحدة — ومفيش حاجة بتضيع. اللي اتمسح بإيدك بيتسجل (tomb) فما يرجعش. */
let SYNC_READY = false;
const MERGE_KEYS = ['tx', 'counts', 'cashCounts', 'items', 'dues', 'recvs', 'goals', 'debts', 'bills', 'incomes', 'cats', 'wallets'];
/* حجم البيانات الحقيقية (كل الأنواع، من غير الحاجات الافتراضية زي محفظة الكاش والتصنيفات) */
const dataSize = st => { const f = fresh(); return sum(MERGE_KEYS, k => Math.max(0, (st[k] || []).length - (f[k] || []).length)); };
/* علامة المسح: "id|وقت المسح" — العلامات القديمة من غير وقت بتمسح دايمًا.
   سجل اتعدّل (_m) بعد وقت مسحه بيفضل (زي اللي رجع بالتراجع) */
const tombAdd = (st, ids) => { if(ids.length){ const at = Date.now(); st.tomb = [...(st.tomb || []), ...ids.map(id => id + '|' + at)].slice(-2000); } };
function tombMap(list){
  const m = new Map();
  (list || []).forEach(e => { const i = String(e).lastIndexOf('|'), id = i > 0 ? e.slice(0, i) : e, at = i > 0 ? Number(e.slice(i + 1)) : Infinity; m.set(id, Math.max(m.get(id) || 0, at)); });
  return m;
}
function mergeStates(remote, local){
  const out = migrate(JSON.parse(JSON.stringify(remote)));
  const allTomb = [...new Set([...(remote.tomb || []), ...(local.tomb || [])])], tomb = tombMap(allTomb);
  MERGE_KEYS.forEach(k => {
    const at = new Map((out[k] || []).map((x, i) => [x && x.id, i]));
    (local[k] || []).forEach(x => {
      if(!x || !x.id) return;
      if(!at.has(x.id)) out[k].push(x);
      else if((x._m || 0) > (out[k][at.get(x.id)]._m || 0)) out[k][at.get(x.id)] = x;   // اتعدّل هنا بعد آخر تعديل هناك
    });
    out[k] = out[k].filter(x => !x || !x.id || !tomb.has(x.id) || (x._m || 0) > tomb.get(x.id));
  });
  if(local.settings && (local.settings._m || 0) > ((remote.settings || {})._m || 0)) out.settings = Object.assign({}, out.settings, local.settings);
  out.tomb = allTomb.slice(-2000);
  return out;
}
function adoptRemote(remoteState, rUp, msg){
  const keep = {syncUrl:S.settings.syncUrl, syncSecret:S.settings.syncSecret, lastWallet:S.settings.lastWallet};
  S = remoteState; Object.assign(S.settings, keep); LASTJ = null;
  S.updatedAt = rUp; persist(); setSynced(rUp); setSync('ok', msg); VIEW = periodOf(todayS()); render();
}
let PUSH_AGAIN = false, PULL_AFTER_SHEET = false;
const sheetOpen = () => $('#sheetWrap').classList.contains('open');
async function pushRemote(force){
  if(!S.settings.syncUrl) return;
  if(syncBusy){ PUSH_AGAIN = true; return; }   // فيه مزامنة شغالة: نرفع تاني بعدها
  if(!SYNC_READY && !force) return pullRemote(false);
  syncBusy = true; setSync('busy');
  try{
    if(!force){
      // جهاز تاني رفع بعد آخر مزامنة؟ ندمج الأول عشان ما نكتبش فوق اللي عمله
      const j = await api('GET'), rUp = Number(j.updatedAt) || 0;
      if(j.value && rUp > syncedAt()){ syncBusy = false; return pullRemote(false); }
    }
    const up = S.updatedAt, val = JSON.stringify(S);
    await api('POST', {action:'set', updatedAt:up, value:val, force:!!force});
    setSynced(up); setSync('ok', 'اترفعت');
    if(S.updatedAt !== up) PUSH_AGAIN = true;   // اتعدّل حاجة وإحنا بنرفع
  }catch(e){
    syncBusy = false;
    if(e.code === 'stale'){ setSync('err', 'فيه نسخة أحدث على الشيت'); return pullRemote(false); }
    if(e.code === 'shrink'){
      // لو النقص كله حاجات انت مسحتها بنفسك (متعلّم عليها)، نرفع عادي
      try{
        const j = await api('GET'), remote = j.value ? JSON.parse(j.value) : null, tm = tombMap(S.tomb);
        const mine = new Set(MERGE_KEYS.flatMap(k => (S[k] || []).map(x => x && x.id)));
        const missing = remote ? MERGE_KEYS.flatMap(k => (remote[k] || []).map(x => x && x.id)).filter(id => id && !mine.has(id)) : [];
        if(remote && missing.every(id => tm.has(id))){ return pushRemote(true); }
      }catch(_){}
      setSync('err', 'مارفعتش: النسخة على الشيت أكبر من اللي هنا'); toast('⚠️ مارفعتش للشيت عشان نسخته أكبر — افتح الإعدادات ← المزامنة', true); return;
    }
    setSync('err', e.message);
  }
  syncBusy = false;
  if(PUSH_AGAIN){ PUSH_AGAIN = false; scheduleSync(); }
}
async function pullRemote(manual){
  if(!S.settings.syncUrl || syncBusy) return;
  syncBusy = true; setSync('busy');
  try{
    const j = await api('GET');
    syncBusy = false;
    SYNC_READY = true;
    const rUp = Number(j.updatedAt) || 0;
    if(!j.value){ if(dataSize(S) > 0) return pushRemote(false); setSync('ok', 'متزامن'); return; }
    const remote = migrate(JSON.parse(j.value));
    const dirty = S.updatedAt > syncedAt(), localSize = dataSize(S), remoteSize = dataSize(remote);
    // فيه شاشة تسجيل مفتوحة: ما نغيّرش البيانات من تحتها — نكمّل المزامنة أول ما تتقفل
    if(sheetOpen() && rUp > S.updatedAt){ PULL_AFTER_SHEET = true; setSync('ok', 'هيتزامن بعد ما تقفل الشاشة'); return; }
    const remoteChanged = rUp > syncedAt();   // جهاز تاني رفع بعد آخر مزامنة لينا
    if(localSize === 0){
      adoptRemote(remote, rUp, 'اتسحبت من الشيت'); if(manual) toast('اتحمّلت بياناتك من جوجل شيت ✔');
    }else if(remoteChanged && !dirty && rUp >= S.updatedAt){
      adoptRemote(remote, rUp, 'اتسحبت من الشيت'); if(manual) toast('اتحدّثت من جوجل شيت');
    }else if(remoteChanged || localSize < remoteSize * 0.8){
      // تعديلات هنا + تعديلات هناك → دمج من غير ما حاجة تضيع، وبعدين رفع
      const merged = mergeStates(remote, S);
      const keep = {syncUrl:S.settings.syncUrl, syncSecret:S.settings.syncSecret, lastWallet:S.settings.lastWallet};
      S = merged; Object.assign(S.settings, keep); LASTJ = null; S.updatedAt = Math.max(Date.now(), rUp + 1);
      persist(); setSynced(rUp); VIEW = periodOf(todayS()); render(); toast('🔄 اتدمجت بيانات الجهاز مع جوجل شيت');
      return pushRemote(false);
    }else if(dirty || S.updatedAt > rUp){
      return pushRemote(false);
    }else{
      setSynced(S.updatedAt); setSync('ok', 'متزامن'); if(manual) toast('كله متزامن ✔');
    }
  }catch(e){
    syncBusy = false; setSync('err', e.message); if(manual) toast('المزامنة فشلت: ' + e.message, true);
  }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') pullRemote(false); });

/* ===================== تشغيل ===================== */
// بعد زرار ↻: نقولك اتحدّث ولا انت على آخر نسخة
try{
  const vb = sessionStorage.getItem('beity.verBefore');
  if(vb){ sessionStorage.removeItem('beity.verBefore'); setTimeout(() => toast(vb !== APP_VER ? `✔ اتحدّث للنسخة الجديدة (${APP_VER})` : `انت على آخر نسخة منشورة (${APP_VER}) — لو مستني تحديث استنى دقيقتين وجرّب تاني`, false, 5000), 400); }
}catch(e){}
load();
VIEW = periodOf(todayS());
render();
// يفتح من غير نت
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
// اطلب من المتصفح ما يمسحش بيانات التطبيق من نفسه
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().then(ok => { PERSISTED = ok; const el = $('#persistInfo'); if(el) el.textContent = ok ? 'التخزين محمي ✅' : 'التخزين مش محمي — اعمل نسخ'; }).catch(() => {});
}
setSync('');
pullRemote(false);
</script>
